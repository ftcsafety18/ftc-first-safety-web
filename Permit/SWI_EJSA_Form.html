  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #F4F7F9; -webkit-tap-highlight-color: transparent; }
    
    .input-field { width: 100%; border-radius: 0.5rem; border: 1px solid #cbd5e1; background-color: #fff; padding: 0.75rem 1rem; font-size: 0.875rem; color: #1e293b; outline: none; transition: all 0.2s; }
    .input-field:focus { border-color: #2A4365; box-shadow: 0 0 0 3px rgba(42, 67, 101, 0.1); }
    
    /* Custom Checkbox Cards */
    .check-card { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; background-color: #fff; cursor: pointer; transition: all 0.2s; }
    .check-card:active { transform: scale(0.98); }
    .check-box { flex-shrink: 0; width: 1.25rem; height: 1.25rem; border-radius: 0.25rem; border: 2px solid #94a3b8; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .check-box i { width: 0.875rem; height: 0.875rem; color: white; opacity: 0; transform: scale(0.5); transition: all 0.2s; }
    .check-text { font-size: 0.8125rem; color: #475569; font-weight: 500; line-height: 1.4; padding-top: 0.1rem;}
    
    /* Active States */
    .check-card.active-hazard { background-color: #fef2f2; border-color: #fca5a5; }
    .check-card.active-hazard .check-box { background-color: #dc2626; border-color: #dc2626; }
    .check-card.active-hazard .check-text { color: #b91c1c; font-weight: 600; }
    .check-card.active-hazard .check-box i { opacity: 1; transform: scale(1); }

    .check-card.active-measure { background-color: #f0fdf4; border-color: #6ee7b7; }
    .check-card.active-measure .check-box { background-color: #059669; border-color: #059669; }
    .check-card.active-measure .check-text { color: #047857; font-weight: 600; }
    .check-card.active-measure .check-box i { opacity: 1; transform: scale(1); }

    /* Severity Buttons */
    .sev-btn { flex: 1; display: flex; flex-col; justify-content: center; align-items: center; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid #cbd5e1; background-color: #fff; cursor: pointer; transition: all 0.2s; text-align: center; }
    .sev-btn .grade { font-size: 1.2rem; font-weight: 800; line-height: 1; }
    .sev-btn .desc { font-size: 0.65rem; font-weight: 700; margin-top: 0.2rem; text-transform: uppercase; }
    
    /* Active States for Severity */
    .sev-btn[data-rank="A"].active { border-color: #dc2626; background-color: #dc2626; color: white; box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.3); }
    .sev-btn[data-rank="A"] { color: #dc2626; }
    
    .sev-btn[data-rank="B"].active { border-color: #f97316; background-color: #f97316; color: white; box-shadow: 0 4px 6px -1px rgba(249, 115, 22, 0.3); }
    .sev-btn[data-rank="B"] { color: #f97316; }
    
    .sev-btn[data-rank="C"].active { border-color: #f59e0b; background-color: #f59e0b; color: white; box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.3); }
    .sev-btn[data-rank="C"] { color: #f59e0b; }
    
    .sev-btn[data-rank="D"].active { border-color: #10b981; background-color: #10b981; color: white; box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3); }
    .sev-btn[data-rank="D"] { color: #10b981; }

    .criteria-text { font-size: 0.65rem; font-weight: 500; color: #64748b; margin-top: 0.3rem; line-height: 1.2; display: none; }
    .sev-btn.active .criteria-text { color: rgba(255,255,255,0.9); display: block; }

    function handleMethodSelection(selectElement) {
        const stepContainer = selectElement.closest('.step-card');
        const customInput = stepContainer.querySelector('.custom-method-input');
        const value = selectElement.value;
        
        if (value === 'custom') {
            customInput.classList.remove('hidden');
            customInput.focus();
        } else {
            customInput.classList.add('hidden');
        }

        // ล้างค่า Checkbox เดิมทั้งหมด
        const allCards = stepContainer.querySelectorAll('.check-card');
        allCards.forEach(card => {
            card.classList.remove('active-hazard', 'active-measure');
            card.dataset.checked = "false";
        });

        // Auto-Select ตาม Smart Logic

                    toggleCheckCard(card);
                }
                if (card.dataset.type === 'measure' && measures.includes(text)) {
                    toggleCheckCard(card);
                }
            });
        }

                  <span class="text-[11px] font-medium mt-1">และแนบรูปภาพลงในขั้นตอนการปฏิบัติงานแต่ละขั้นตอน (Photo)</span>
                </div>
                <img class="image-preview absolute inset-0 w-full h-full object-cover hidden" src="" alt="Preview">
              </label>
              <input type="file" id="img-${stepId}" class="hidden" accept="image/*" onchange="previewImage(this)">
            </div>

            <!-- B. Method Statement -->
            <div>
              <label class="block text-[13px] font-bold text-slate-800 mb-1.5">1. ขั้นตอนการปฏิบัติงาน (Method Statement) <span class="text-red-500">*</span></label>
              <div class="relative mb-2">
                <select class="method-select input-field appearance-none pr-8 bg-white border-slate-300 text-slate-700 font-semibold text-[13px]" onchange="handleMethodSelection(this)">
                  <option value="" disabled selected>-- เลือกขั้นตอนการปฏิบัติงาน --</option>
                  <optgroup label="หมวด 1: งานระบบสาธารณูปโภค (MEP Work)">
                    <option value="elec_loto">แจ้งตัดแยกระบบพลังงาน (LOTO) และตรวจสอบกระแสไฟ</option>
                    <option value="hot_work">งานเชื่อม ตัด เจียร และป้องกันประกายไฟ (Hot Work)</option>
                  </optgroup>
                  <optgroup label="หมวด 2: งานโครงสร้างบนที่สูง (Structural & Height)">
                    <option value="scaffold_setup">งานติดตั้ง ประกอบ และใช้งานนั่งร้าน (Scaffolding)</option>
                  </optgroup>
                  <optgroup label="หมวด 3: เครื่องจักรหนักและยกวัสดุ (Heavy Lifting)">
                    <option value="crane_lift">งานยกและเคลื่อนย้ายวัสดุด้วยเครน (Crane Operations)</option>
                  </optgroup>
                  <optgroup label="หมวด 4: งานใต้ดินและอับอากาศ (Confined Space)">
                    <option value="confined_entry">งานในสถานที่อับอากาศและจัดการสารเคมี</option>
                  </optgroup>
                  <option value="custom" class="text-orange-600 font-bold">✏️ พิมพ์ระบุขั้นตอนการปฏิบัติงานเอง...</option>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
              </div>
              <textarea class="custom-method-input input-field resize-none hidden text-[13px]" rows="2" placeholder="โปรดพิมพ์อธิบายรายละเอียดขั้นตอนการทำงาน..."></textarea>
            </div>

            <!-- C. Hazards & Risk -->
            <div class="bg-red-50/20 p-3 -mx-2 rounded-xl border border-red-100">
              <label class="block text-[13px] font-bold text-red-600 mb-2 flex items-center gap-1.5"><i data-lucide="alert-triangle" class="w-4 h-4"></i> 2. อันตรายที่อาจเกิดขึ้น <span class="text-slate-400 font-medium text-[11px]">(Potential Hazard)</span> <span class="text-red-500">*</span></label>
              
              <div class="flex flex-col gap-2 mb-3">
                ${hazardHTML}
              </div>
              
              <!-- ช่องระบุอันตรายอื่นๆ -->
              <input type="text" class="hazard-custom-text input-field text-xs mb-4" placeholder="+ ระบุอันตรายอื่นๆ เพิ่มเติม (ถ้ามี)...">

              <div class="relative mb-3">
                <select class="source-select input-field appearance-none pr-8 bg-white border-slate-300 text-slate-600 text-[13px] font-medium">
                  <option value="" disabled selected>แหล่งที่มาของอันตราย (Source of Hazard)</option>
                  ${sourceOptions}
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
              </div>

              <div>
                <p class="text-[11px] font-bold text-slate-500 mb-1.5 uppercase tracking-wide">ระดับความรุนแรง (Severity Rank) <span class="text-red-500">*</span></p>
                <div class="flex gap-2">
                  <button type="button" class="sev-btn group" data-rank="A" onclick="selectSeverity(this)">
                    <span class="grade">A</span><span class="desc block">Fatal</span>
                    <span class="criteria-text">เสียชีวิต/ทรัพย์สินเสียหาย > 50,000</span>
                  </button>
                  <button type="button" class="sev-btn group" data-rank="B" onclick="selectSeverity(this)">
                    <span class="grade">B</span><span class="desc block">Disability</span>
                    <span class="criteria-text">ทุพพลภาพ/หยุดงาน > 3 วัน</span>
                  </button>
                  <button type="button" class="sev-btn group" data-rank="C" onclick="selectSeverity(this)">
                    <span class="grade">C</span><span class="desc block">Lost Time</span>
                    <span class="criteria-text">บาดเจ็บ/หยุดงาน ≤ 3 วัน</span>
                  </button>
                  <button type="button" class="sev-btn group" data-rank="D" onclick="selectSeverity(this)">
                    <span class="grade">D</span><span class="desc block">Minor</span>
                    <span class="criteria-text">บาดเจ็บเล็กน้อย/ไม่หยุดงาน</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- D. Measures -->
            <div class="bg-emerald-50/30 p-3 -mx-2 rounded-xl border border-emerald-100">
              <label class="block text-[13px] font-bold text-emerald-600 mb-2 flex items-center gap-1.5"><i data-lucide="shield-check" class="w-4 h-4"></i> 3. การควบคุมความเสี่ยง <span class="text-slate-400 font-medium text-[11px]">(Risk Control)</span> <span class="text-red-500">*</span></label>
              
              <div class="flex flex-col gap-2 mb-3">
                ${measureHTML}
              </div>
              
              <!-- ช่องระบุมาตรการอื่นๆ -->
              <input type="text" class="measure-custom-text input-field text-xs" placeholder="+ ระบุมาตรการควบคุมความเสี่ยงอื่นๆ เพิ่มเติม (ถ้ามี)...">
            </div>

            <!-- E. Remarks -->
            <div class="border-t border-slate-100 pt-3">
              <label class="block text-[11px] font-bold text-slate-500 mb-1 uppercase tracking-wide">4. หมายเหตุ (Remark)</label>
              <input type="text" class="remark-input input-field text-[13px] bg-slate-50 border-transparent focus:bg-white" placeholder="ระบุหมายเหตุเพิ่มเติม (ถ้ามี)...">
            </div>

          </div>
        </article>
      `;

      container.insertAdjacentHTML('beforeend', html);
      lucide.createIcons();
      updateStepNumbers();
    }

    function removeStep(id) {
      document.getElementById(id).remove();
      updateStepNumbers();
    }

    function updateStepNumbers() {
      const cards = document.querySelectorAll('.step-card');
      stepCounter = cards.length;
      cards.forEach((card, index) => {
        const num = index + 1;
        card.querySelector('.step-number').textContent = num;
        card.querySelector('h3').textContent = `ขั้นตอนที่ ${num}`;
        const trashBtn = card.querySelector('button[onclick^="removeStep"]');
        if(trashBtn) trashBtn.classList.toggle('hidden', index === 0);
      });
    }

    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const area = input.parentElement.querySelector('label');
          const preview = area.querySelector('.image-preview');
          const placeholder = area.querySelector('.upload-placeholder');
          
          preview.src = e.target.result;
          preview.classList.remove('hidden');
          placeholder.classList.add('hidden');
          area.classList.replace('border-dashed', 'border-solid');
          area.classList.replace('border-slate-300', 'border-navy/20');
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function toggleCheckCard(element) {
        const isHazard = element.dataset.type === 'hazard';
        const activeClass = isHazard ? 'active-hazard' : 'active-measure';
        
        if(element.dataset.checked === "true") {
            element.dataset.checked = "false";
            element.classList.remove(activeClass);
        } else {
            element.dataset.checked = "true";
            element.classList.add(activeClass);
        }
    }

    function selectSeverity(btn) {
      const container = btn.closest('.flex');
      const buttons = container.querySelectorAll('.sev-btn');
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // ==========================================
    // 🚀 ระบบบันทึกข้อมูล (ส่งเข้า Supabase)
    // ==========================================
    async function submitJsa() {
        if (!currentPtwId) {
            Swal.fire('ข้อผิดพลาด', 'ไม่พบรหัสอ้างอิงใบงาน (PTW-ID) โปรดเข้าผ่านระบบขอใบอนุญาตหลัก', 'error');
            return;
        }

        const steps = document.querySelectorAll('.step-card');
        let ejsaDataArray = [];
        let isValid = true;

        steps.forEach((stepEl, index) => {
            const methodSelect = stepEl.querySelector('.method-select').value;
            const methodCustom = stepEl.querySelector('.custom-method-input').value;
            let stepName = methodSelect === 'custom' ? methodCustom : stepEl.querySelector('.method-select option:checked')?.textContent;
            if (!methodSelect || (methodSelect === 'custom' && !methodCustom)) isValid = false;

            let hazards = Array.from(stepEl.querySelectorAll('.check-card[data-type="hazard"].active-hazard')).map(c => c.querySelector('.check-text').textContent);
            const hazardCustom = stepEl.querySelector('.hazard-custom-text').value;
            if (hazardCustom) hazards.push(hazardCustom);
            if (hazards.length === 0) isValid = false;

            const hazardSource = stepEl.querySelector('.source-select').value;

            const severityBtn = stepEl.querySelector('.sev-btn.active');
            const severityRank = severityBtn ? severityBtn.dataset.rank : '';
            if (!severityRank) isValid = false;

            let measures = Array.from(stepEl.querySelectorAll('.check-card[data-type="measure"].active-measure')).map(c => c.querySelector('.check-text').textContent);
            const measureCustom = stepEl.querySelector('.measure-custom-text').value;
            if (measureCustom) measures.push(measureCustom);
            if (measures.length === 0) isValid = false;

            const remark = stepEl.querySelector('.remark-input').value;

            ejsaDataArray.push({
                step_no: index + 1,
                step_name: stepName,
                hazards: hazards,
                hazard_source: hazardSource,
                severity_rank: severityRank,
                measures: measures,
                remark: remark
            });
        });

        if (!isValid) {
            Swal.fire('ข้อมูลไม่ครบถ้วน', 'กรุณาระบุขั้นตอนงาน, เลือกอันตราย, ระดับความรุนแรง และมาตรการป้องกันให้ครบทุกส่วน', 'warning');
            return;
        }

        Swal.fire({ title: 'กำลังบันทึก E-JSA...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            if (!supabaseClient) throw new Error("ไม่สามารถเชื่อมต่อฐานข้อมูลได้");

            const { data: permitData, error: fetchError } = await supabaseClient.from('tb_work_permits').select('specific_data').eq('ptw_id', currentPtwId).single();
            if (fetchError) throw fetchError;

            let specificData = permitData.specific_data || {};
            specificData.ejsa_data = ejsaDataArray; 

            const { error: updateError } = await supabaseClient.from('tb_work_permits').update({ specific_data: specificData }).eq('ptw_id', currentPtwId);
            if (updateError) throw updateError;

            Swal.fire({
                title: 'บันทึก E-JSA สำเร็จ!',
                text: 'ข้อมูลเชื่อมโยงเข้ากับใบอนุญาต ' + currentPtwId + ' เรียบร้อยแล้ว',
                icon: 'success',
                confirmButtonColor: '#B24D29',
                confirmButtonText: 'ปิดหน้าต่าง'
            }).then(() => {
                if (typeof liff !== 'undefined' && liff.isInClient()) { liff.closeWindow(); } 
                else { window.location.href = 'index.html'; }
            });

        } catch (error) {
            console.error('Save E-JSA Error:', error);
            Swal.fire('บันทึกไม่สำเร็จ', 'เกิดข้อผิดพลาด: ' + error.message, 'error');
        }
    }
  </script>
</body>
</html>
