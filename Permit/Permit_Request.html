          <!-- Required PPE -->

  <style>
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>

  <script>
    // ---- Supabase Initialization ----
    const SUPABASE_URL = 'https://ancwqgaaqliandzdzphg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_IVdSBILj_etRSNF48ig1PA_sBAt23NG';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
    
    let lineUserId = null;
    let compressedJsaFile = null;

    // ---- Data ----
    const HIGH_RISK_WORK = [
      { id: 'grinding',    th: 'งานเจียร / ตัด',       icon: 'scissors' },
      { id: 'welding',     th: 'งานเชื่อม / ประกายไฟ',  icon: 'flame' },
      { id: 'confined',    th: 'งานอับอากาศ',         icon: 'wind' },
      { id: 'energy',      th: 'งานแยกพลังงาน',        icon: 'zap' },
      { id: 'painting',    th: 'งานทาสี / สารเคมี',     icon: 'paintbrush' },
      { id: 'scaffolding', th: 'นั่งร้าน / ที่สูง',        icon: 'construction' },
      { id: 'testing',     th: 'งานทดสอบระบบ',        icon: 'gauge' },
      { id: 'crane',       th: 'เครื่องจักรกลหนัก',       icon: 'truck' },
      { id: 'radiography', th: 'งานรังสีถ่ายภาพ',        icon: 'radiation' },
    ];
    const PPE_ITEMS = [
      'หมวกนิรภัย', 'รองเท้าเซฟตี้', 'แว่นตากันสะเก็ด', 'ถุงมือหนัง', 'เข็มขัดกันตกเต็มตัว'
    ];

    // ---- State ----
    const selectedRisk = new Set();
    const selectedPPE = new Set();
    let generalWork = false;
    let declared = false;

    // ---- Build UI ----
    const riskGrid = document.getElementById('riskGrid');
    HIGH_RISK_WORK.forEach((w) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'risk-card relative flex flex-col gap-2 rounded-xl border border-slate-200 bg-white p-3 text-left transition hover:border-slate-300 active:scale-[0.98]';
      btn.dataset.id = w.id;
      btn.innerHTML =
        '<span class="risk-icon flex h-8 w-8 items-center justify-center rounded-lg bg-slate-100 text-navy transition"><i data-lucide="' + w.icon + '" class="h-4 w-4"></i></span>' +
        '<span class="block text-[12px] font-bold leading-tight text-slate-700 mt-1">' + w.th + '</span>' +
        '<span class="risk-check absolute right-2 top-2 flex h-4 w-4 items-center justify-center rounded-full border border-slate-300 bg-white text-transparent transition"><i data-lucide="check" class="h-2.5 w-2.5"></i></span>';
      btn.addEventListener('click', () => toggleRisk(w.id, w.th, btn));
      riskGrid.appendChild(btn);
    });

    const ppeList = document.getElementById('ppeList');
    PPE_ITEMS.forEach((item) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt col-span-1 flex items-center gap-2 rounded-xl border border-slate-200 bg-white p-2.5 text-left transition hover:border-orange/50';
      btn.innerHTML =
        '<span class="opt-check flex h-4 w-4 shrink-0 items-center justify-center rounded border border-slate-300 bg-white text-transparent transition"><i data-lucide="check" class="h-3 w-3"></i></span>' +
        '<span class="text-[11px] sm:text-xs font-semibold text-slate-600">' + item + '</span>';
      btn.addEventListener('click', () => togglePPE(item, btn));
      ppeList.appendChild(btn);
    });

    lucide.createIcons();

    // ---- Logic ----
    const generalBtn = document.getElementById('generalWork');
    const riskAlert = document.getElementById('riskAlert');
    const jsaWrap = document.getElementById('jsaWrap');
    const submitBtn = document.getElementById('submitBtn');
    const declBtn = document.getElementById('declaration');

    function toggleRisk(id, name, btn) {
      if (generalWork) { generalWork = false; generalBtn.classList.remove('active'); }
      if (selectedRisk.has(name)) { selectedRisk.delete(name); btn.classList.remove('active'); }
      else { selectedRisk.add(name); btn.classList.add('active'); }
      refresh();
    }

    function togglePPE(item, btn) {
        if(selectedPPE.has(item)) { selectedPPE.delete(item); btn.classList.remove('active'); }
        else { selectedPPE.add(item); btn.classList.add('active'); }
        refresh();
    }

    generalBtn.addEventListener('click', () => {
      generalWork = !generalWork;
      generalBtn.classList.toggle('active', generalWork);
      selectedRisk.clear();
      riskGrid.querySelectorAll('.risk-card').forEach((c) => c.classList.remove('active'));
      refresh();
    });

    declBtn.addEventListener('click', () => {
      declared = !declared;
      declBtn.classList.toggle('active', declared);
      refresh();
    });

    // ---- Image Compression (JSA) ----
    const jsaInput = document.getElementById('jsaInput');
    jsaInput.addEventListener('change', async (e) => {
        if (!e.target.files || e.target.files.length === 0) return;
        let file = e.target.files[0];
        
        Swal.fire({ title: 'กำลังประมวลผลรูปภาพ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            if (file.type === 'image/heic' || file.name.toLowerCase().endsWith('.heic')) {
                if (typeof heic2any !== 'undefined') {
                    const convertedBlob = await heic2any({ blob: file, toType: 'image/jpeg' });
                    file = new File([Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob], file.name.replace(/\.heic$/i, ".jpg"), { type: 'image/jpeg' });
                }
            }

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    const maxWidth = 1200;
                    if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob(blob => {
                        compressedJsaFile = new File([blob], "JSA_" + Date.now() + ".jpg", { type: 'image/jpeg' });
                        document.getElementById('jsaPreview').src = URL.createObjectURL(blob);
                        document.getElementById('jsaPreviewWrap').classList.remove('hidden');
                        document.getElementById('jsaText').textContent = "เปลี่ยนรูปถ่าย";
                        Swal.close();
                        refresh();
                    }, 'image/jpeg', 0.7);
                };
            };
        } catch (err) {
            console.error('Image processing failed:', err);
            Swal.fire('ข้อผิดพลาด', 'ไม่สามารถประมวลผลรูปภาพได้', 'error');
        }
    });

    function removeJsa() {
        compressedJsaFile = null;
        jsaInput.value = '';
        document.getElementById('jsaPreviewWrap').classList.add('hidden');
        document.getElementById('jsaText').textContent = "กดเพื่อถ่ายรูป หรือเลือกไฟล์";
        refresh();
    }

    function refresh() {
      const hasHighRisk = selectedRisk.size > 0;
      riskAlert.classList.toggle('hidden', !hasHighRisk);
      riskAlert.classList.toggle('flex', hasHighRisk);
      jsaWrap.classList.toggle('hidden', !hasHighRisk);
      
      const hasJsaIfNeeded = hasHighRisk ? (compressedJsaFile !== null) : true;
      const hasBasicInfo = document.getElementById('project-input').value && document.getElementById('wbs-input').value && document.getElementById('location-input').value && document.getElementById('start-time').value && document.getElementById('end-time').value;
      
      submitBtn.disabled = !(declared && (generalWork || hasHighRisk) && hasJsaIfNeeded && selectedPPE.size > 0 && hasBasicInfo);
    }

    function scanAsset() {
        Swal.fire({ title: 'สแกน QR', text: 'ระบบกล้องเพื่อตรวจสอบป้าย E-Tagging พร้อมใช้งานในแอปจริง', icon: 'info', confirmButtonColor: '#2A4365' });
    }

    // ---- LIFF Init ----
    document.addEventListener('DOMContentLoaded', async () => {
        if (typeof liff !== 'undefined') {
            try {
                await liff.init({ liffId: '2010907761-KrJ8PgNN' });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    lineUserId = profile.userId;
                    document.getElementById('profileName').textContent = profile.displayName;
                    document.getElementById('profileAvatar').src = profile.pictureUrl;
                    
                    document.getElementById('profileCompany').textContent = "ผู้รับเหมา/โฟร์แมน";
                } else {
                    document.getElementById('profileName').textContent = "ไม่พบข้อมูล LINE";
                }
            } catch (e) {
                console.error("LIFF Init Error:", e);
                document.getElementById('profileName').textContent = "เปิดผ่านเว็บเบราว์เซอร์";
            }
        }
        
        const now = new Date();
        const start = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0,16);
        const end = new Date(now.getTime() - now.getTimezoneOffset() * 60000 + 8*60*60*1000).toISOString().slice(0,16);
        document.getElementById('start-time').value = start;
        document.getElementById('end-time').value = end;
    });

    // ---- Submit to Supabase ----
    async function submitPermit() {
        if (!supabaseClient) { Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error'); return; }

        Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            let jsaUrl = null;
            if (compressedJsaFile) {
                Swal.update({ title: 'กำลังอัปโหลดเอกสาร JSA...' });
                const filePath = 'jsa-docs/' + Date.now() + '.jpg';
                const { error: uploadError } = await supabaseClient.storage.from('safety-docs').upload(filePath, compressedJsaFile);
                if (uploadError) throw uploadError;
                jsaUrl = supabaseClient.storage.from('safety-docs').getPublicUrl(filePath).data.publicUrl;
            }

            const workTypes = generalWork ? ['งานทั่วไป (General Work)'] : Array.from(selectedRisk);
            const isHighRisk = !generalWork;
            
            // สร้าง Payload ให้ตรงกับฟิลด์ในตาราง tb_work_permits
            const payload = {
                ptw_id: 'PTW-' + Date.now(),
                task_id: document.getElementById('wbs-input').value || 'TSK-UNKNOWN',
                vendor_id: 'VND-UNKNOWN', // ต้องดึงจากตาราง Vendors
                requester_id: lineUserId || 'UNKNOWN_USER', 
                ptw_type: workTypes.join(', '), 
                work_description: document.getElementById('location-input').value,
                risk_area_class: isHighRisk ? 'เขตอันตราย' : 'เขตควบคุม', 
                start_time: document.getElementById('start-time').value,
                end_time: document.getElementById('end-time').value,
                status: 'Pending',
                specific_data: {
                    project_id: document.getElementById('project-input').value,
                    ppe_required: Array.from(selectedPPE),
                    jsa_file_url: jsaUrl,
                    declaration_checked: true
                }
            };

            const { error: dbError } = await supabaseClient.from('tb_work_permits').insert(payload);
            if (dbError) throw dbError;

            Swal.fire({
                title: 'ส่งคำขอใบอนุญาตสำเร็จ!',
                text: 'ข้อมูลของคุณถูกส่งไปยัง จป. เพื่อรอการอนุมัติแล้ว',
                icon: 'success',
                confirmButtonColor: '#2A4365',
                confirmButtonText: 'กลับสู่หน้าหลัก'
            }).then(() => {
                if (typeof liff !== 'undefined' && liff.isInClient()) { liff.closeWindow(); } 
                else { window.history.back(); }
            });

        } catch (error) {
            console.error('Submit Error:', error);
            let errMsg = error.message;
            if (error.code === '23503') {
                errMsg = "รหัสแผนงาน (WBS) หรือ รหัสผู้รับเหมา (Vendor ID) ไม่ถูกต้องและไม่มีอยู่ในระบบฐานข้อมูล (Foreign Key Constraint Failed)";
            }
            Swal.fire('บันทึกไม่สำเร็จ', 'เกิดข้อผิดพลาด: ' + errMsg, 'error');
        }
    }
  </script>
</body>
