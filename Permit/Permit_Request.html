<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ขอเปิดใบอนุญาตทำงาน | FTC First Safety</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Sarabun font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- LIFF, Supabase, SweetAlert2, Heic2Any -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Sarabun', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            navy: { DEFAULT: '#2A4365', 700: '#22364F' },
            orange: { DEFAULT: '#DB5A24', 600: '#C24D1C' },
            surface: '#F4F7F9',
          },
        },
      },
    }
  </script>

  <style>
    body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    /* Risk Cards (Red Theme for High Risk) */
    .risk-card { border-color: #fca5a5; background: #fff; }
    .risk-card.active { border-color: #dc2626; background: #fef2f2; box-shadow: 0 2px 4px rgba(220, 38, 38, 0.1); }
    .risk-card.active .risk-icon { background: #dc2626; color: #fff; }
    .risk-card.active .risk-check { border-color: #dc2626; background: #dc2626; color: #fff; }
    .risk-card.active .risk-title { color: #b91c1c; }

    /* General Work (Green/Safe Theme) */
    #generalWork { border-width: 2px; }
    #generalWork.active { border-color: #059669; background: #f0fdf4; }
    #generalWork.active .opt-check { border-color: #059669; background: #059669; color: #fff; }

    /* PPE Cards */
    .ppe-opt { border-color: #e2e8f0; }
    .ppe-opt.active { border-color: #2A4365; background: #f8fafc; font-weight: 600; color: #2A4365; }
    .ppe-opt.active .opt-check { border-color: #2A4365; background: #2A4365; color: #fff; }

    .decl.active { border-color: #e11d48; background: rgba(225,29,72,.08); }
    .decl.active .decl-check { border-color: #e11d48; background: #e11d48; color: #fff; }

    .input-field { width: 100%; border-radius: 0.75rem; border: 1px solid #e2e8f0; background-color: #fff; padding: 0.75rem 1rem; font-size: 0.875rem; color: #1e293b; outline: none; transition: all 0.2s; }
    .input-field:focus { border-color: #2A4365; box-shadow: 0 0 0 3px rgba(42, 67, 101, 0.1); }
  </style>
</head>

<body class="bg-surface antialiased text-slate-800">
  <div class="min-h-screen pb-28">

    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-navy-700/40 bg-navy text-white shadow-md">
      <div class="mx-auto flex max-w-xl items-center gap-3 px-4 py-3">
        <button type="button" onclick="window.history.back()" aria-label="ย้อนกลับ"
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full transition hover:bg-white/10 active:scale-95">
          <i data-lucide="chevron-left" class="h-5 w-5"></i>
        </button>
        <div class="min-w-0 flex-1">
          <h1 class="truncate text-base font-bold leading-tight">ขอเปิดใบอนุญาตทำงาน</h1>
          <p class="truncate text-xs text-white/70 tracking-widest uppercase">E-Permit Request (PTW)</p>
        </div>
        <span class="shrink-0 rounded-md bg-orange px-2.5 py-1 text-[11px] font-bold tracking-widest text-white shadow-sm">
          FM-SAF-03
        </span>
      </div>

      <!-- Profile Bar -->
      <div class="border-t border-white/10 bg-navy-700/60 backdrop-blur-sm">
        <div class="mx-auto flex max-w-xl items-center gap-3 px-4 py-2.5">
          <img id="profileAvatar" src="https://via.placeholder.com/150?text=U"
            alt="Profile" class="h-10 w-10 shrink-0 rounded-full border-2 border-white/20 object-cover shadow-inner" />
          <div class="min-w-0 flex-1 leading-tight">
            <p class="truncate text-[10px] text-white/60 font-medium">ผู้ขออนุญาต (REQUESTER)</p>
            <p id="profileName" class="truncate text-[13px] font-bold text-white mt-0.5">กำลังเชื่อมต่อ LINE...</p>
          </div>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-xl space-y-5 px-4 py-6">

      <!-- Section 1 (ของเดิมที่ทำงานได้ 100%) -->
      <section class="rounded-2xl border border-slate-200/80 bg-white shadow-sm overflow-hidden">
        <header class="flex items-center gap-3 border-b border-slate-100 px-5 py-4 bg-slate-50/50">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-navy text-sm font-bold text-white shadow-inner">1</span>
          <div class="min-w-0">
            <h2 class="font-bold leading-tight text-navy">ข้อมูลพื้นที่และแผนงาน</h2>
            <p class="text-[11px] text-slate-400 uppercase tracking-widest">Area & Task Info</p>
          </div>
        </header>
        <div class="space-y-4 p-5">
          <div>
            <label class="mb-1.5 block text-sm font-semibold text-slate-700">โครงการ (Project Context) <span class="text-red-500">*</span></label>
            <div class="relative">
              <select id="project-input" class="input-field appearance-none cursor-pointer pr-10">
                <option value="" disabled selected>-- เลือกโครงการ --</option>
                <option value="PRJ-001">โครงการ A — Central Business Tower</option>
                <option value="PRJ-002">โครงการ B — Riverside Residence</option>
              </select>
              <i data-lucide="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400"></i>
            </div>
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-semibold text-slate-700">แผนงาน / ภารกิจ (WBS Task) <span class="text-red-500">*</span></label>
            <div class="relative">
              <select id="wbs-input" class="input-field appearance-none cursor-pointer pr-10">
                <option value="" disabled selected>-- เลือกแผนงาน --</option>
                <option value="TSK-001">งานโครงสร้าง (Structural Work)</option>
                <option value="TSK-002">งานระบบ M&E (MEP Installation)</option>
                <option value="TSK-003">งานสถาปัตยกรรม (Architectural Finishing)</option>
              </select>
              <i data-lucide="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400"></i>
            </div>
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-semibold text-slate-700">โซนปฏิบัติงานโดยละเอียด (Specific Zone) <span class="text-red-500">*</span></label>
            <div class="relative">
              <i data-lucide="map-pin" class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400"></i>
              <input type="text" id="location-input" placeholder="เช่น อาคาร A ชั้น 12 โซนลิฟต์โดยสาร" class="input-field pl-10" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-100">
            <div>
              <label class="mb-1.5 block text-[13px] font-semibold text-slate-700">เวลาเริ่มงาน <span class="text-red-500">*</span></label>
              <input type="datetime-local" id="start-time" class="input-field px-3 text-[13px]" />
            </div>
            <div>
              <label class="mb-1.5 block text-[13px] font-semibold text-slate-700">เวลาสิ้นสุด <span class="text-red-500">*</span></label>
              <input type="datetime-local" id="end-time" class="input-field px-3 text-[13px]" />
            </div>
          </div>
        </div>
      </section>

      <!-- Section 2: ประเภทงาน -->
      <section class="rounded-2xl border border-slate-200/80 bg-white shadow-sm overflow-hidden">
        <header class="flex items-center gap-3 border-b border-slate-100 px-5 py-4 bg-slate-50/50">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-navy text-sm font-bold text-white shadow-inner">2</span>
          <div class="min-w-0">
            <h2 class="font-bold leading-tight text-navy">ประเภทงาน</h2>
            <p class="text-[11px] text-slate-400 uppercase tracking-widest">Type of Work</p>
          </div>
        </header>
        <div class="space-y-4 p-5">
          <div>
            <label class="mb-1 block text-sm font-bold text-red-600">ประเภทงานเสี่ยงสูง <span class="text-[11px] font-normal text-slate-500">(เลือกได้มากกว่า 1 ข้อ)</span> <span class="text-red-500">*</span></label>
            <div id="riskGrid" class="grid grid-cols-2 gap-2 mt-3">
              <!-- risk cards injected by JS -->
            </div>
            <!-- ช่องกรอกงานอื่นๆ ซ่อนไว้เป็นค่าเริ่มต้น -->
            <input type="text" id="otherRiskInput" placeholder="โปรดระบุลักษณะงานเสี่ยงสูง..." class="hidden input-field mt-2 border-red-300 focus:border-red-600" />
          </div>

          <!-- กล่องงานทั่วไป (เน้นขอบหนา สีเขียว) -->
          <button type="button" id="generalWork" data-active="false"
            class="flex w-full items-center gap-3 rounded-xl border border-slate-300 bg-white p-3.5 text-left transition hover:border-slate-400">
            <span class="opt-check flex h-5 w-5 shrink-0 items-center justify-center rounded-md border border-slate-400 bg-white text-transparent transition">
              <i data-lucide="check" class="h-3.5 w-3.5"></i>
            </span>
            <span class="text-[15px] font-extrabold text-slate-700">งานทั่วไป (General Work) — <span class="text-emerald-600">เสี่ยงต่ำ</span></span>
          </button>

          <!-- High-risk alert -->
          <div id="riskAlert" role="alert" class="hidden items-center justify-center gap-2 rounded-xl border border-red-200 bg-red-50 p-3 text-red-700">
            <i data-lucide="alert-triangle" class="h-5 w-5 shrink-0 text-red-600 animate-pulse"></i>
            <p class="text-[13px] font-bold leading-snug">⚠️ งานเสี่ยงสูงจำเป็นต้องแนบรูปเอกสาร JSA</p>
          </div>
        </div>
      </section>

      <!-- Section 3: ความปลอดภัยและอุปกรณ์ PPE -->
      <section class="rounded-2xl border border-slate-200/80 bg-white shadow-sm overflow-hidden">
        <header class="flex items-center gap-3 border-b border-slate-100 px-5 py-4 bg-slate-50/50">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-navy text-sm font-bold text-white shadow-inner">3</span>
          <div class="min-w-0">
            <h2 class="font-bold leading-tight text-navy">ความปลอดภัยและอุปกรณ์</h2>
            <p class="text-[11px] text-slate-400 uppercase tracking-widest">Safety & Equipment</p>
          </div>
        </header>
        <div class="space-y-5 p-5">
          <button type="button" onclick="scanAsset()"
            class="flex w-full items-center justify-center gap-2 rounded-xl border-2 border-navy/20 bg-slate-50 px-4 py-3.5 text-sm font-bold text-navy transition hover:bg-slate-100 active:scale-[0.98]">
            <i data-lucide="qr-code" class="h-5 w-5"></i>
            สแกน QR เครื่องมือช่าง (E-Tagging)
          </button>

          <!-- JSA dropzone -->
          <div id="jsaWrap" class="hidden">
            <label class="mb-2 block text-sm font-bold text-red-600">แนบรูปเอกสาร JSA <span class="text-red-500">*</span></label>
            <label class="flex cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-red-300 bg-red-50/50 p-6 text-center transition hover:bg-red-50">
              <i data-lucide="camera" class="h-8 w-8 text-red-500"></i>
              <span id="jsaText" class="text-sm font-bold text-red-600">กดเพื่อถ่ายรูป หรือเลือกไฟล์</span>
              <span class="text-[11px] font-medium text-red-500/70">ระบบจะทำการบีบอัดรูปภาพอัตโนมัติ</span>
              <input id="jsaInput" type="file" accept="image/*,application/pdf" capture="environment" class="hidden" />
            </label>
            <div id="jsaPreviewWrap" class="hidden mt-3 relative w-full h-32 rounded-xl overflow-hidden border border-slate-200">
               <img id="jsaPreview" src="" class="w-full h-full object-cover" />
               <button type="button" onclick="removeJsa()" class="absolute top-2 right-2 bg-red-600 text-white rounded-full p-1.5 shadow-lg"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
          </div>

          <!-- Required PPE Grid -->
          <div class="border-t border-slate-100 pt-4">
            <label class="mb-3 block text-sm font-bold text-slate-700">อุปกรณ์ PPE ที่บังคับใช้ <span class="text-[11px] font-normal text-slate-500">(เลือกได้มากกว่า 1 ข้อ)</span> <span class="text-red-500">*</span></label>
            <div id="ppeList" class="grid grid-cols-2 gap-2">
              <!-- ppe items injected by JS -->
            </div>
            <!-- ช่องกรอก PPE อื่นๆ ซ่อนไว้เป็นค่าเริ่มต้น -->
            <input type="text" id="otherPPEInput" placeholder="โปรดระบุอุปกรณ์ PPE อื่นๆ..." class="hidden input-field mt-2" />
          </div>
        </div>
      </section>

      <!-- Section 4 -->
      <section class="rounded-2xl border border-red-200/80 bg-red-50 shadow-sm overflow-hidden mb-6">
        <div class="p-4 sm:p-5">
          <button type="button" id="declaration" data-active="false"
            class="decl flex w-full items-start gap-3 rounded-xl border border-red-300 bg-white p-4 text-left shadow-sm transition hover:border-red-400 active:scale-[0.98]">
            <span class="decl-check mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-md border-2 border-red-300 bg-white text-transparent transition">
              <i data-lucide="check" class="h-4 w-4 text-white"></i>
            </span>
            <span class="flex items-start gap-2 text-[13px] sm:text-sm font-semibold leading-relaxed text-red-800">
              <span>ข้าพเจ้ายืนยันว่าได้ตรวจสอบสภาพพื้นที่ เตรียมถังดับเพลิงพร้อมสำหรับภาวะฉุกเฉิน และจะทำการ TBT ก่อนเริ่มงานจริง <span class="text-red-600">*</span></span>
            </span>
          </button>
        </div>
      </section>
    </main>

    <!-- Sticky bottom bar -->
    <div class="fixed inset-x-0 bottom-0 z-50 border-t border-slate-200 bg-white/95 backdrop-blur-md pb-safe shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
      <div class="mx-auto max-w-xl px-4 py-3">
        <button type="button" id="submitBtn" onclick="submitPermit()" disabled
          class="w-full flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-navy to-navy-700 py-4 text-center text-[15px] font-bold text-white shadow-lg shadow-navy/30 transition active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-50 disabled:shadow-none">
          <i data-lucide="send" class="w-5 h-5"></i> ส่งคำขอใบอนุญาต (Submit PTW)
        </button>
      </div>
    </div>
  </div>

  <style>
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>

  <script>
    // ---- Supabase Initialization ----
    const SUPABASE_URL = 'https://ancwqgaaqliandzdzphg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_IVdSBILj_etRSNF48ig1PA_sBAt23NG';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
    
    let lineUserId = null;
    let compressedJsaFile = null;

    // ---- Data ----
    const HIGH_RISK_WORK = [
      { id: 'confined',    th: 'งานที่อับอากาศ',         en: 'Confined Space',     icon: 'wind' },
      { id: 'welding',     th: 'งานเชื่อม/ก่อประกายไฟ',  en: 'Hot Work',           icon: 'flame' },
      { id: 'scaffolding', th: 'งานบนที่สูง',          en: 'Working at Height',  icon: 'arrow-up-to-line' },
      { id: 'excavation',  th: 'งานขุดเจาะดิน',         en: 'Excavation',         icon: 'pickaxe' },
      { id: 'electrical',  th: 'งานเกี่ยวกับไฟฟ้า',       en: 'Electrical Work',    icon: 'zap' },
      { id: 'crane',       th: 'งานยกของหนัก/เครน',     en: 'Lifting / Crane',    icon: 'package-open' },
      { id: 'chemical',    th: 'งานเกี่ยวกับสารเคมี',      en: 'Chemical Work',      icon: 'beaker' },
      { id: 'structure',   th: 'งานรื้อถอน/โครงสร้าง',    en: 'Structural Work',    icon: 'building' },
      { id: 'radiation',   th: 'งานเกี่ยวกับรังสี',        en: 'Radiation Area',     icon: 'radiation' },
      { id: 'other_risk',  th: 'งานอื่นๆ',             en: 'Other High Risk',    icon: 'help-circle' },
    ];
    
    // อ้างอิงจากคู่มือความปลอดภัย โครงการ APTAR
    const PPE_ITEMS = [
      { id: 'helmet',     th: 'หมวกนิรภัย',                en: 'Helmet',            icon: 'hard-hat' },
      { id: 'shoes',      th: 'รองเท้าเซฟตี้',              en: 'Safety Shoes',      icon: 'footprints' },
      { id: 'glasses',    th: 'แว่นตานิรภัย',              en: 'Safety Glasses',    icon: 'glasses' },
      { id: 'shield',     th: 'หน้ากากเชื่อม/กระบังหน้า',     en: 'Face Shield',       icon: 'shield' },
      { id: 'leather',    th: 'ถุงมือหนัง',                en: 'Leather Gloves',    icon: 'hand' },
      { id: 'cotton',     th: 'ถุงมือผ้า/ยาง',             en: 'Cotton / Rubber',   icon: 'hand' },
      { id: 'ear',        th: 'ที่อุดหู/ครอบหู',             en: 'Ear Plugs/Muffs',   icon: 'ear' },
      { id: 'harness',    th: 'เข็มขัดกันตกเต็มตัว',         en: 'Full Body Harness', icon: 'person-standing' },
      { id: 'lifeline',   th: 'สายช่วยชีวิต',              en: 'Life Line',         icon: 'link' },
      { id: 'mask',       th: 'หน้ากากกันสารเคมี/ฝุ่น',       en: 'Respirator/Mask',   icon: 'spray-can' },
      { id: 'other_ppe',  th: 'อื่นๆ (Others)',          en: 'Please specify',    icon: 'more-horizontal' },
    ];

    // ---- State ----
    const selectedRisk = new Set();
    const selectedPPE = new Set();
    let generalWork = false;
    let declared = false;

    // ---- Build UI ----
    const riskGrid = document.getElementById('riskGrid');
    HIGH_RISK_WORK.forEach((w) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'risk-card relative flex flex-col items-start gap-1.5 rounded-xl border p-3 text-left transition active:scale-[0.98]';
      btn.dataset.id = w.id;
      btn.innerHTML =
        '<div class="flex items-center gap-2">' +
        '<span class="risk-icon flex h-6 w-6 shrink-0 items-center justify-center rounded text-red-400 transition"><i data-lucide="' + w.icon + '" class="h-4 w-4"></i></span>' +
        '<span class="risk-title block text-[12px] font-bold leading-tight text-red-600">' + w.th + '</span>' +
        '</div>' +
        '<span class="block text-[10px] leading-tight text-slate-400 mt-0.5">' + w.en + '</span>' +
        '<span class="risk-check absolute right-2 top-2 flex h-4 w-4 items-center justify-center rounded-full border border-slate-200 bg-white text-transparent transition"><i data-lucide="check" class="h-2.5 w-2.5"></i></span>';
      btn.addEventListener('click', () => toggleRisk(w.id, w.th, btn));
      riskGrid.appendChild(btn);
    });

    const ppeList = document.getElementById('ppeList');
    PPE_ITEMS.forEach((item) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      // ถ้าเป็นอันสุดท้าย (อื่นๆ) ให้กว้างเต็ม 2 คอลัมน์
      const colSpan = item.id === 'other_ppe' ? 'col-span-2 bg-slate-50 justify-center' : 'col-span-1 bg-white justify-start';
      btn.className = `ppe-opt flex items-center gap-2.5 rounded-xl border p-2.5 text-left transition active:scale-[0.98] ${colSpan}`;
      btn.innerHTML =
        '<span class="opt-check flex h-4 w-4 shrink-0 items-center justify-center rounded border border-slate-300 bg-white text-transparent transition"><i data-lucide="check" class="h-3 w-3"></i></span>' +
        '<div class="flex flex-col">' +
        '<span class="text-[12px] font-bold text-slate-700">' + item.th + '</span>' +
        '<span class="text-[9px] text-slate-400">' + item.en + '</span>' +
        '</div>';
      btn.addEventListener('click', () => togglePPE(item.id, item.th, btn));
      ppeList.appendChild(btn);
    });

    lucide.createIcons();

    // ---- Logic ----
    const generalBtn = document.getElementById('generalWork');
    const riskAlert = document.getElementById('riskAlert');
    const jsaWrap = document.getElementById('jsaWrap');
    const submitBtn = document.getElementById('submitBtn');
    const declBtn = document.getElementById('declaration');
    
    // Inputs for "Others"
    const otherRiskInput = document.getElementById('otherRiskInput');
    const otherPPEInput = document.getElementById('otherPPEInput');

    function toggleRisk(id, name, btn) {
      if (generalWork) { generalWork = false; generalBtn.classList.remove('active'); }
      
      if (selectedRisk.has(name)) { 
          selectedRisk.delete(name); 
          btn.classList.remove('active'); 
          if(id === 'other_risk') otherRiskInput.classList.add('hidden');
      } else { 
          selectedRisk.add(name); 
          btn.classList.add('active'); 
          if(id === 'other_risk') otherRiskInput.classList.remove('hidden');
      }
      refresh();
    }

    function togglePPE(id, name, btn) {
        if(selectedPPE.has(name)) { 
            selectedPPE.delete(name); 
            btn.classList.remove('active'); 
            if(id === 'other_ppe') otherPPEInput.classList.add('hidden');
        } else { 
            selectedPPE.add(name); 
            btn.classList.add('active'); 
            if(id === 'other_ppe') otherPPEInput.classList.remove('hidden');
        }
        refresh();
    }

    generalBtn.addEventListener('click', () => {
      generalWork = !generalWork;
      generalBtn.classList.toggle('active', generalWork);
      selectedRisk.clear();
      riskGrid.querySelectorAll('.risk-card').forEach((c) => c.classList.remove('active'));
      otherRiskInput.classList.add('hidden');
      refresh();
    });

    declBtn.addEventListener('click', () => {
      declared = !declared;
      declBtn.classList.toggle('active', declared);
      refresh();
    });

    // ---- Image Compression (JSA) ----
    const jsaInput = document.getElementById('jsaInput');
    jsaInput.addEventListener('change', async (e) => {
        if (!e.target.files || e.target.files.length === 0) return;
        let file = e.target.files[0];
        
        compressedJsaFile = null;

        if (!file.type.match('image.*') && !file.name.toLowerCase().endsWith('.heic')) {
            Swal.fire('ชนิดไฟล์ไม่ถูกต้อง', 'ระบบรองรับเฉพาะการถ่ายรูป หรือแนบไฟล์รูปภาพ (JPG, PNG) เท่านั้นครับ', 'warning');
            removeJsa();
            return;
        }

        Swal.fire({ title: 'กำลังประมวลผลรูปภาพ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            if (file.type === 'image/heic' || file.name.toLowerCase().endsWith('.heic')) {
                if (typeof heic2any !== 'undefined') {
                    const convertedBlob = await heic2any({ blob: file, toType: 'image/jpeg' });
                    file = new File([Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob], file.name.replace(/\.heic$/i, ".jpg"), { type: 'image/jpeg' });
                }
            }

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    const maxWidth = 1200;
                    if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob(blob => {
                        compressedJsaFile = new File([blob], "JSA_" + Date.now() + ".jpg", { type: 'image/jpeg' });
                        document.getElementById('jsaPreview').src = URL.createObjectURL(blob);
                        document.getElementById('jsaPreviewWrap').classList.remove('hidden');
                        document.getElementById('jsaText').textContent = "เปลี่ยนรูปถ่าย";
                        Swal.close();
                        refresh();
                    }, 'image/jpeg', 0.7);
                };
                img.onerror = () => {
                    Swal.fire('ข้อผิดพลาด', 'ไฟล์รูปภาพนี้มีปัญหา ไม่สามารถอ่านได้ครับ', 'error');
                    removeJsa();
                };
            };
        } catch (err) {
            console.error('Image processing failed:', err);
            Swal.fire('ข้อผิดพลาด', 'ไม่สามารถประมวลผลรูปภาพได้', 'error');
            removeJsa();
        }
    });

    function removeJsa() {
        compressedJsaFile = null;
        jsaInput.value = '';
        document.getElementById('jsaPreviewWrap').classList.add('hidden');
        document.getElementById('jsaText').textContent = "กดเพื่อถ่ายรูป หรือเลือกไฟล์";
        refresh();
    }

    function refresh() {
      const hasHighRisk = selectedRisk.size > 0;
      riskAlert.classList.toggle('hidden', !hasHighRisk);
      riskAlert.classList.toggle('flex', hasHighRisk);
      jsaWrap.classList.toggle('hidden', !hasHighRisk);
      
      const hasJsaIfNeeded = hasHighRisk ? (compressedJsaFile !== null) : true;
      const hasBasicInfo = document.getElementById('project-input').value && document.getElementById('wbs-input').value && document.getElementById('location-input').value && document.getElementById('start-time').value && document.getElementById('end-time').value;
      
      submitBtn.disabled = !(declared && (generalWork || hasHighRisk) && hasJsaIfNeeded && selectedPPE.size > 0 && hasBasicInfo);
    }

    function scanAsset() {
        Swal.fire({ title: 'สแกน QR', text: 'ระบบกล้องเพื่อตรวจสอบป้าย E-Tagging พร้อมใช้งานในแอปจริง', icon: 'info', confirmButtonColor: '#2A4365' });
    }

    // ---- LIFF Init ----
    document.addEventListener('DOMContentLoaded', async () => {
        if (typeof liff !== 'undefined') {
            try {
                await liff.init({ liffId: '2010907761-KrJ8PgNN' });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    lineUserId = profile.userId;
                    document.getElementById('profileName').textContent = profile.displayName;
                    document.getElementById('profileAvatar').src = profile.pictureUrl;
                } else {
                    document.getElementById('profileName').textContent = "ไม่พบข้อมูล LINE";
                }
            } catch (e) {
                console.error("LIFF Init Error:", e);
                document.getElementById('profileName').textContent = "เปิดผ่านเว็บเบราว์เซอร์";
            }
        }
        
        const now = new Date();
        const start = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0,16);
        const end = new Date(now.getTime() - now.getTimezoneOffset() * 60000 + 8*60*60*1000).toISOString().slice(0,16);
        document.getElementById('start-time').value = start;
        document.getElementById('end-time').value = end;
    });

    // ---- Submit to Supabase ----
    async function submitPermit() {
        if (!supabaseClient) { Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error'); return; }

        Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            let jsaUrl = null;
            if (compressedJsaFile) {
                Swal.update({ title: 'กำลังอัปโหลดเอกสาร JSA...' });
                const filePath = 'jsa-docs/' + Date.now() + '.jpg';
                const { error: uploadError } = await supabaseClient.storage.from('safety-documents').upload(filePath, compressedJsaFile);
                if (uploadError) throw uploadError;
                jsaUrl = supabaseClient.storage.from('safety-documents').getPublicUrl(filePath).data.publicUrl;
            }

            // จัดการข้อมูล "งานอื่นๆ" และ "PPE อื่นๆ"
            let finalWorkTypes = [];
            if (generalWork) {
                finalWorkTypes = ['งานทั่วไป (General Work)'];
            } else {
                selectedRisk.forEach(risk => {
                    if (risk === 'งานอื่นๆ' && otherRiskInput.value.trim() !== '') {
                        finalWorkTypes.push('อื่นๆ: ' + otherRiskInput.value.trim());
                    } else if (risk !== 'งานอื่นๆ') {
                        finalWorkTypes.push(risk);
                    }
                });
            }
            
            let finalPPE = [];
            selectedPPE.forEach(ppe => {
                if (ppe === 'อื่นๆ (Others)' && otherPPEInput.value.trim() !== '') {
                    finalPPE.push('อื่นๆ: ' + otherPPEInput.value.trim());
                } else if (ppe !== 'อื่นๆ (Others)') {
                    finalPPE.push(ppe);
                }
            });

            const isHighRisk = !generalWork;
            
            const payload = {
                ptw_id: 'PTW-' + Date.now(),
                task_id: document.getElementById('wbs-input').value,
                vendor_id: 'C001',
                requester_id: lineUserId || 'UNKNOWN_USER', 
                ptw_type: finalWorkTypes.join(', '), 
                work_description: document.getElementById('location-input').value,
                risk_area_class: isHighRisk ? 'เขตอันตราย' : 'เขตควบคุม', 
                start_time: document.getElementById('start-time').value,
                end_time: document.getElementById('end-time').value,
                status: 'Pending',
                specific_data: {
                    project_id: document.getElementById('project-input').value,
                    ppe_required: finalPPE,
                    jsa_file_url: jsaUrl,
                    declaration_checked: true
                }
            };

            const { error: dbError } = await supabaseClient.from('tb_work_permits').insert(payload);
            if (dbError) throw dbError;

            Swal.fire({
                title: 'ส่งคำขอใบอนุญาตสำเร็จ!',
                text: 'ข้อมูลของคุณถูกส่งไปยัง จป. เพื่อรอการอนุมัติแล้ว',
                icon: 'success',
                confirmButtonColor: '#2A4365',
                confirmButtonText: 'กลับสู่หน้าหลัก'
            }).then(() => {
                if (typeof liff !== 'undefined' && liff.isInClient()) { 
                    liff.closeWindow();
                } else { 
                    window.location.reload(); 
                }
            });

        } catch (error) {
            console.error('Submit Error:', error);
            let errMsg = error.message;
            if (error.code === '23503') {
                errMsg = "รหัสแผนงาน (WBS) ไม่มีอยู่ในระบบฐานข้อมูล หรือ รหัสผู้รับเหมาไม่ถูกต้อง (Foreign Key Error)";
            }
            Swal.fire('บันทึกไม่สำเร็จ', 'เกิดข้อผิดพลาด: ' + errMsg, 'error');
        }
    }
  </script>
</body>
</html>
