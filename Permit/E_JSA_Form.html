<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>จัดทำ E-JSA | FTC First Safety</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Sarabun font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Sarabun', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            navy: { DEFAULT: '#2A4365', 700: '#22364F' },
            orange: { DEFAULT: '#DB5A24', 600: '#C24D1C' },
            surface: '#F4F7F9',
          },
        },
      },
    }
  </script>

  <style>
    body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    .input-field { width: 100%; border-radius: 0.75rem; border: 1px solid #e2e8f0; background-color: #fff; padding: 0.75rem 1rem; font-size: 0.875rem; color: #1e293b; outline: none; transition: all 0.2s; }
    .input-field:focus { border-color: #2A4365; box-shadow: 0 0 0 3px rgba(42, 67, 101, 0.1); }
    
    /* Toggle Chips Style */
    .chip { display: inline-flex; align-items: center; justify-content: center; padding: 0.375rem 0.75rem; border-radius: 9999px; border: 1px solid #e2e8f0; background-color: #f8fafc; font-size: 0.75rem; font-weight: 600; color: #64748b; cursor: pointer; transition: all 0.2s; user-select: none; }
    .chip:active { transform: scale(0.95); }
    
    .chip-hazard.active { background-color: #fef2f2; border-color: #fca5a5; color: #dc2626; }
    .chip-measure.active { background-color: #f0fdf4; border-color: #6ee7b7; color: #059669; }
  </style>
</head>

<body class="bg-surface antialiased text-slate-800">
  <div class="min-h-screen pb-28">

    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-navy-700/40 bg-navy text-white shadow-md">
      <div class="mx-auto flex max-w-xl items-center gap-3 px-4 py-3">
        <button type="button" onclick="window.history.back()" aria-label="ย้อนกลับ"
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full transition hover:bg-white/10 active:scale-95">
          <i data-lucide="chevron-left" class="h-5 w-5"></i>
        </button>
        <div class="min-w-0 flex-1">
          <h1 class="truncate text-base font-bold leading-tight">จัดทำ E-JSA</h1>
          <p class="truncate text-xs text-white/70 tracking-widest uppercase">Job Safety Analysis</p>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-xl space-y-4 px-4 py-6">
      
      <!-- ข้อมูลอ้างอิงใบงาน -->
      <div class="rounded-xl border border-navy/20 bg-navy/5 p-4">
        <p class="text-[11px] font-bold tracking-widest text-navy uppercase mb-1">ข้อมูลอ้างอิงใบอนุญาต</p>
        <div class="flex justify-between items-center">
            <p class="text-sm font-semibold text-slate-700">อ้างอิง: <span class="text-navy">PTW-202608-001</span></p>
            <span class="rounded bg-navy text-white px-2 py-0.5 text-[10px] font-bold">รอการบันทึก</span>
        </div>
        <p class="text-xs text-slate-600 mt-1">งานโครงสร้าง — อาคาร B ชั้น 12</p>
      </div>

      <!-- คอนเทนเนอร์เก็บการ์ดขั้นตอนการทำงาน -->
      <div id="jsa-container" class="space-y-4">
        <!-- Step 1 (Default) -->
        <section class="jsa-step rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden" data-step="1">
            <header class="flex items-center justify-between border-b border-slate-100 bg-slate-50 px-4 py-3">
              <div class="flex items-center gap-2">
                <span class="step-number flex h-6 w-6 items-center justify-center rounded-full bg-navy text-xs font-bold text-white shadow-inner">1</span>
                <h3 class="font-bold text-navy text-sm">ส่วนที่ 1: ขั้นตอนการทำงาน</h3>
              </div>
            </header>
            
            <div class="p-4 space-y-5">
                <!-- 1. ขั้นตอนงาน (Hybrid Dropdown) -->
                <div>
                    <label class="mb-1.5 block text-xs font-bold text-slate-700">1. ขั้นตอนการทำงาน (Job Step) <span class="text-red-500">*</span></label>
                    <div class="relative mb-2">
                        <select class="jsa-step-select input-field appearance-none cursor-pointer pr-10 text-sm font-semibold text-navy border-slate-300 focus:border-navy" onchange="toggleHybridInput(this, 'step-text')">
                            <option value="" disabled selected>-- เลือกขั้นตอนการทำงานมาตรฐาน --</option>
                            <option value="เตรียมพื้นที่และตรวจสอบอุปกรณ์">เตรียมพื้นที่และตรวจสอบเครื่องมือ (Site & Equip Prep)</option>
                            <option value="ขนย้ายและยกวัสดุอุปกรณ์">ขนย้ายและยกวัสดุอุปกรณ์ (Material Handling & Lifting)</option>
                            <option value="ติดตั้ง/รื้อถอนนั่งร้าน">ติดตั้ง/รื้อถอนนั่งร้าน (Scaffold Erection/Dismantling)</option>
                            <option value="ปฏิบัติงานตัด/เชื่อมโลหะ">ปฏิบัติงานตัด/เชื่อมโลหะ (Hot Work / Welding)</option>
                            <option value="ปฏิบัติงานขุดเจาะ/เปิดผิวดิน">งานขุดเจาะ/เปิดผิวดิน (Excavation Work)</option>
                            <option value="ปฏิบัติงานบนที่สูง">ปฏิบัติงานบนที่สูง (Working at Height)</option>
                            <option value="ปฏิบัติงานในที่อับอากาศ">ปฏิบัติงานในที่อับอากาศ (Confined Space Entry)</option>
                            <option value="งานเดินสายและติดตั้งระบบไฟฟ้า">งานเดินสายและติดตั้งระบบไฟฟ้า (Electrical Installation)</option>
                            <option value="งานทาสี/สัมผัสสารเคมี">งานทาสี/สัมผัสสารเคมี (Painting & Chemical Handling)</option>
                            <option value="เก็บกวาดและทำความสะอาดพื้นที่">เก็บกวาดและทำความสะอาดพื้นที่ (Housekeeping)</option>
                            <option value="custom" class="font-bold text-orange-600">✏️ พิมพ์ระบุขั้นตอนการทำงานเอง...</option>
                        </select>
                        <i data-lucide="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
                    </div>
                    <textarea class="step-text hidden input-field text-sm border-orange-300 focus:border-orange" rows="2" placeholder="โปรดระบุขั้นตอนการทำงานโดยละเอียด..."></textarea>
                </div>

                <!-- 2. อันตรายที่เรียงลำดับ ก-ฮ -->
                <div>
                    <label class="mb-1.5 block text-xs font-bold text-red-600">2. อันตรายที่อาจเกิดขึ้น (Hazards) <span class="text-red-500">*</span></label>
                    <div class="flex flex-wrap gap-1.5 mb-2">
                        <!-- ปุ่มมาตรฐานเรียง ก-ฮ -->
                        <button type="button" class="chip chip-hazard" onclick="this.classList.toggle('active')">กระแสไฟฟ้ารั่ว/ช็อต</button>
                        <button type="button" class="chip chip-hazard" onclick="this.classList.toggle('active')">การกระเด็นของวัสดุเข้าตา</button>
                        <button type="button" class="chip chip-hazard" onclick="this.classList.toggle('active')">การชน/กระแทกจากเครื่องจักร</button>
                        <button type="button" class="chip chip-hazard" onclick="this.classList.toggle('active')">การตกหล่นของวัสดุ</button>
                        <button type="button" class="chip chip-hazard" onclick="this.classList.toggle('active')">การพลัดตกจากที่สูง</button>
                        <button type="button" class="chip chip-hazard" onclick="this.classList.toggle('active')">การสัมผัส/สูดดมสารเคมี</button>
                        <button type="button" class="chip chip-hazard" onclick="this.classList.toggle('active')">การสัมผัสรังสี</button>
                        <button type="button" class="chip chip-hazard" onclick="this.classList.toggle('active')">การหนีบ/ดึง/ทับ</button>
                        <button type="button" class="chip chip-hazard" onclick="this.classList.toggle('active')">ของมีคมบาด/ทิ่มแทง</button>
                        <button type="button" class="chip chip-hazard" onclick="this.classList.toggle('active')">ขาดอากาศ/อับอากาศ</button>
                        <button type="button" class="chip chip-hazard" onclick="this.classList.toggle('active')">เพลิงไหม้/ระเบิด</button>
                        <button type="button" class="chip chip-hazard" onclick="this.classList.toggle('active')">เสียงดังระดับอันตราย</button>
                        <button type="button" class="chip chip-hazard font-bold border-red-300 text-red-600" onclick="toggleHybridWrapper(this, 'hazard-others-wrapper')">➕ อื่นๆ (ระบุ)</button>
                    </div>
                    <!-- Hybrid Dropdown สำหรับอันตรายอื่นๆ -->
                    <div class="hazard-others-wrapper hidden flex-col gap-2 mt-2 border border-red-200 p-3 rounded-xl bg-red-50/50">
                        <label class="text-[10px] font-bold text-red-600 uppercase tracking-widest">อันตรายอื่นๆ (Hazards)</label>
                        <div class="relative">
                            <select class="input-field appearance-none cursor-pointer pr-10 border-red-300 focus:border-red-600 text-red-700 text-xs font-semibold" onchange="toggleHybridInput(this, 'hazard-custom-text')">
                                <option value="" disabled selected>-- เลือกอันตรายเพิ่มเติม --</option>
                                <option value="ความร้อน/เย็นจัด">ความร้อน/เย็นจัด (Extreme Temperature)</option>
                                <option value="ท่าทางการทำงานที่ไม่เหมาะสม">ท่าทางการทำงานที่ไม่เหมาะสม (Ergonomics)</option>
                                <option value="แสงสว่างไม่เพียงพอ/จ้าเกินไป">แสงสว่างไม่เพียงพอ/จ้าเกินไป (Poor Lighting)</option>
                                <option value="สัตว์มีพิษ/แมลงกัดต่อย">สัตว์มีพิษ/แมลงกัดต่อย (Biological Hazards)</option>
                                <option value="อันตรายจากแรงดัน">อันตรายจากแรงดัน (Pressure Hazards)</option>
                                <option value="อันตรายจากการสั่นสะเทือน">อันตรายจากการสั่นสะเทือน (Vibration)</option>
                                <option value="custom" class="font-extrabold text-navy">✏️ พิมพ์ระบุอันตรายเอง (วิเคราะห์ 3ME)...</option>
                            </select>
                            <i data-lucide="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-red-400"></i>
                        </div>
                        <input type="text" class="hazard-custom-text hidden input-field text-xs border-red-300 focus:border-red-600 text-red-700" placeholder="โปรดพิมพ์ระบุอันตราย (วิเคราะห์จาก 3ME: คน, เครื่องจักร, วิธีการ)..." />
                    </div>
                </div>

                <!-- 3. มาตรการป้องกันเรียงลำดับ ก-ฮ -->
                <div class="border-t border-slate-100 pt-4">
                    <label class="mb-1.5 block text-xs font-bold text-emerald-600">3. มาตรการป้องกัน (Preventive Measures) <span class="text-red-500">*</span></label>
                    <div class="flex flex-wrap gap-1.5 mb-2">
                        <!-- ปุ่มมาตรฐานเรียง ก-ฮ -->
                        <button type="button" class="chip chip-measure" onclick="this.classList.toggle('active')">กั้นเขตพื้นที่/ติดป้ายเตือน</button>
                        <button type="button" class="chip chip-measure" onclick="this.classList.toggle('active')">ขออนุญาตทำงาน (PTW)</button>
                        <button type="button" class="chip chip-measure" onclick="this.classList.toggle('active')">จัดเตรียมถังดับเพลิง</button>
                        <button type="button" class="chip chip-measure" onclick="this.classList.toggle('active')">ตัดแยกพลังงาน (LOTO)</button>
                        <button type="button" class="chip chip-measure" onclick="this.classList.toggle('active')">ตรวจเช็คสภาพเครื่องมือ</button>
                        <button type="button" class="chip chip-measure" onclick="this.classList.toggle('active')">ตรวจวัดปริมาณก๊าซ</button>
                        <button type="button" class="chip chip-measure" onclick="this.classList.toggle('active')">ทำ Toolbox Talk</button>
                        <button type="button" class="chip chip-measure" onclick="this.classList.toggle('active')">มีผู้เฝ้าระวัง (Standby Man)</button>
                        <button type="button" class="chip chip-measure" onclick="this.classList.toggle('active')">สวมอุปกรณ์ PPE ครบถ้วน</button>
                        <button type="button" class="chip chip-measure font-bold border-emerald-300 text-emerald-600" onclick="toggleHybridWrapper(this, 'measure-others-wrapper')">➕ อื่นๆ (ระบุ)</button>
                    </div>
                    <!-- Hybrid Dropdown สำหรับมาตรการอื่นๆ -->
                    <div class="measure-others-wrapper hidden flex-col gap-2 mt-2 border border-emerald-200 p-3 rounded-xl bg-emerald-50/50">
                        <label class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest">มาตรการป้องกันอื่นๆ (Measures)</label>
                        <div class="relative">
                            <select class="input-field appearance-none cursor-pointer pr-10 border-emerald-300 focus:border-emerald-600 text-emerald-700 text-xs font-semibold" onchange="toggleHybridInput(this, 'measure-custom-text')">
                                <option value="" disabled selected>-- เลือกมาตรการเพิ่มเติม --</option>
                                <option value="จัดทำนั่งร้านที่ได้มาตรฐาน/จุดเกี่ยวสายรัด">จัดทำนั่งร้านที่ได้มาตรฐาน/จุดเกี่ยวสายรัด</option>
                                <option value="ติดตั้งการ์ดป้องกันเครื่องจักร">ติดตั้งการ์ดป้องกันเครื่องจักร (Machine Guard)</option>
                                <option value="ปิดคลุมวัสดุติดไฟ/ท่อระบายน้ำ">ปิดคลุมวัสดุติดไฟ/ท่อระบายน้ำทิ้ง</option>
                                <option value="ระบายอากาศ/ติดตั้งพัดลมดูดอากาศ">ระบายอากาศ/ติดตั้งพัดลมดูดอากาศ</option>
                                <option value="สับเปลี่ยนหมุนเวียนพนักงาน">สับเปลี่ยนหมุนเวียนพนักงาน (Job Rotation)</option>
                                <option value="custom" class="font-extrabold text-navy">✏️ พิมพ์ระบุมาตรการเอง...</option>
                            </select>
                            <i data-lucide="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-emerald-400"></i>
                        </div>
                        <input type="text" class="measure-custom-text hidden input-field text-xs border-emerald-300 focus:border-emerald-600 text-emerald-700" placeholder="โปรดพิมพ์ระบุมาตรการป้องกัน..." />
                    </div>
                </div>

                <!-- 4. หมายเหตุ -->
                <div class="border-t border-slate-100 pt-4 bg-slate-50/50 -mx-4 px-4 pb-1">
                    <label class="mb-1.5 block text-[11px] font-bold text-slate-500 tracking-widest uppercase">4. หมายเหตุ (Remarks)</label>
                    <textarea rows="1" class="input-field text-xs bg-transparent border-slate-200" placeholder="ระบุหมายเหตุ การเตรียมงาน หรือเก็บงาน..."></textarea>
                </div>
            </div>
        </section>
      </div>

      <!-- ปุ่มเพิ่มขั้นตอน -->
      <button type="button" onclick="addJsaStep()" class="flex w-full items-center justify-center gap-2 rounded-xl border-2 border-dashed border-navy/30 bg-navy/5 px-4 py-3.5 text-sm font-bold text-navy transition hover:bg-navy/10 active:scale-[0.98]">
        <i data-lucide="plus-circle" class="h-5 w-5"></i>
        เพิ่มขั้นตอนการทำงาน (Add Step)
      </button>

    </main>

    <!-- Sticky bottom bar -->
    <div class="fixed inset-x-0 bottom-0 z-50 border-t border-slate-200 bg-white/95 backdrop-blur-md pb-safe shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
      <div class="mx-auto max-w-xl px-4 py-3">
        <button type="button" onclick="submitJsa()"
          class="w-full flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-navy to-navy-700 py-4 text-center text-[15px] font-bold text-white shadow-lg shadow-navy/30 transition active:scale-[0.98]">
          <i data-lucide="save" class="w-5 h-5"></i> บันทึกข้อมูล E-JSA
        </button>
      </div>
    </div>
  </div>

  <style>
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>

  <script>
    lucide.createIcons();
    let stepCount = 1;

    // ฟังก์ชันจัดการแสดงผลช่องกรอกเอง (Hybrid Dropdown) สำหรับขั้นตอนงาน
    function toggleHybridInput(selectElement, inputClass) {
        const wrapper = selectElement.parentElement.parentElement;
        const textInput = wrapper.querySelector(`.${inputClass}`);
        if (selectElement.value === 'custom') {
            textInput.classList.remove('hidden');
            textInput.focus();
        } else {
            textInput.classList.add('hidden');
        }
    }

    // ฟังก์ชันเปิด/ปิดกล่องระบุอื่นๆ สำหรับปุ่ม Chips
    function toggleHybridWrapper(buttonElement, wrapperClass) {
        buttonElement.classList.toggle('active');
        const stepContainer = buttonElement.closest('.jsa-step');
        const wrapper = stepContainer.querySelector(`.${wrapperClass}`);
        if (buttonElement.classList.contains('active')) {
            wrapper.classList.remove('hidden');
            wrapper.classList.add('flex');
        } else {
            wrapper.classList.add('hidden');
            wrapper.classList.remove('flex');
            // Reset values when hidden
            wrapper.querySelector('select').value = '';
            const textInput = wrapper.querySelector('input[type="text"]');
            textInput.value = '';
            textInput.classList.add('hidden');
        }
    }

    // ฟังก์ชันเพิ่มขั้นตอนการทำงาน
    function addJsaStep() {
        stepCount++;
        const container = document.getElementById('jsa-container');
        
        // HTML ของ JSA Card ที่รวมระบบ Hybrid Dropdown เข้าไปแล้ว
        const stepHTML = `
        <section class="jsa-step rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden mt-4" data-step="${stepCount}">
            <header class="flex items-center justify-between border-b border-slate-100 bg-slate-50 px-4 py-3">
              <div class="flex items-center gap-2">
                <span class="step-number flex h-6 w-6 items-center justify-center rounded-full bg-navy text-xs font-bold text-white shadow-inner">${stepCount}</span>
                <h3 class="font-bold text-navy text-sm">ส่วนที่ ${stepCount}: ขั้นตอนการทำงาน</h3>
              </div>
              <button type="button" onclick="this.closest('.jsa-step').remove(); renumberSteps();" class="text-red-500 hover:text-red-700 p-1 bg-red-50 rounded-lg">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </header>
            
            <div class="p-4 space-y-5">
                <!-- 1. ขั้นตอนงาน -->
                <div>
                    <label class="mb-1.5 block text-xs font-bold text-slate-700">1. ขั้นตอนการทำงาน (Job Step) <span class="text-red-500">*</span></label>
                    <div class="relative mb-2">
                        <select class="jsa-step-select input-field appearance-none cursor-pointer pr-10 text-sm font-semibold text-navy border-slate-300 focus:border-navy" onchange="toggleHybridInput(this, 'step-text')">
                            <option value="" disabled selected>-- เลือกขั้นตอนการทำงานมาตรฐาน --</option>
                            <option value="เตรียมพื้นที่และตรวจสอบอุปกรณ์">เตรียมพื้นที่และตรวจสอบเครื่องมือ (Site & Equip Prep)</option>

                <!-- 2. อันตราย -->

                    <div class="hazard-others-wrapper hidden flex-col gap-2 mt-2 border border-red-200 p-3 rounded-xl bg-red-50/50">

                                <option value="custom" class="font-extrabold text-navy">✏️ พิมพ์ระบุอันตรายเอง (วิเคราะห์ 3ME)...</option>

                                <option value="สับเปลี่ยนหมุนเวียนพนักงาน">สับเปลี่ยนหมุนเวียนพนักงาน (Job Rotation)</option>
                                <option value="custom" class="font-extrabold text-navy">✏️ พิมพ์ระบุมาตรการเอง...</option>
                            </select>
                            <i data-lucide="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-emerald-400"></i>

                        <input type="text" class="measure-custom-text hidden input-field text-xs border-emerald-300 focus:border-emerald-600 text-emerald-700" placeholder="โปรดพิมพ์ระบุมาตรการป้องกัน..." />

        container.insertAdjacentHTML('beforeend', stepHTML);

    // ฟังก์ชันจัดเรียงเลขขั้นตอนใหม่ กรณีมีคนกดลบทิ้ง
    function renumberSteps() {
        const steps = document.querySelectorAll('.jsa-step');
        stepCount = steps.length;
        steps.forEach((step, index) => {
            const num = index + 1;
            step.dataset.step = num;
            step.querySelector('.step-number').textContent = num;
            step.querySelector('h3').textContent = `ส่วนที่ ${num}: ขั้นตอนการทำงาน`;
        });
    }

    // ฟังก์ชันบันทึกข้อมูล (Mockup)
    function submitJsa() {
        Swal.fire({
            title: 'บันทึก E-JSA สำเร็จ!',
            text: 'ข้อมูลขั้นตอนการทำงานและมาตรการป้องกันถูกแนบเข้ากับใบอนุญาต PTW-202608-001 แล้ว',
            icon: 'success',
            confirmButtonColor: '#2A4365',
            confirmButtonText: 'กลับสู่หน้าขอใบอนุญาต'
        }).then(() => {
            window.history.back();
        });
    }
