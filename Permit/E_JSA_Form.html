<html lang="th">

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Sarabun', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            navy: { DEFAULT: '#2A4365', 700: '#22364F' },
            orange: { DEFAULT: '#DB5A24', 600: '#C24D1C' },
            surface: '#F4F7F9',
          },
        },
      },

  </script>

  <style>
    body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    .input-field { width: 100%; border-radius: 0.75rem; border: 1px solid #e2e8f0; background-color: #fff; padding: 0.75rem 1rem; font-size: 0.875rem; color: #1e293b; outline: none; transition: all 0.2s; }
    .input-field:focus { border-color: #2A4365; box-shadow: 0 0 0 3px rgba(42, 67, 101, 0.1); }
    
    /* Toggle Chips Style */
    .chip { display: inline-flex; align-items: center; justify-content: center; padding: 0.375rem 0.75rem; border-radius: 9999px; border: 1px solid #e2e8f0; background-color: #f8fafc; font-size: 0.75rem; font-weight: 600; color: #64748b; cursor: pointer; transition: all 0.2s; user-select: none; }
    .chip:active { transform: scale(0.95); }
    
    .chip-hazard.active { background-color: #fef2f2; border-color: #fca5a5; color: #dc2626; }
    .chip-measure.active { background-color: #f0fdf4; border-color: #6ee7b7; color: #059669; }
  </style>
</head>

<body class="bg-surface antialiased text-slate-800">
  <div class="min-h-screen pb-28">

    <!-- Header -->

        <button type="button" onclick="window.history.back()" aria-label="ย้อนกลับ"
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full transition hover:bg-white/10 active:scale-95">
          <i data-lucide="chevron-left" class="h-5 w-5"></i>
        </button>
        <div class="min-w-0 flex-1">
          <h1 class="truncate text-base font-bold leading-tight">จัดทำ E-JSA</h1>
          <p class="truncate text-xs text-white/70 tracking-widest uppercase">Smart Job Safety Analysis</p>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-xl space-y-4 px-4 py-6">
      
      <!-- ข้อมูลอ้างอิงใบงาน -->
      <div class="rounded-xl border border-navy/20 bg-navy/5 p-4">
        <p class="text-[11px] font-bold tracking-widest text-navy uppercase mb-1">ข้อมูลอ้างอิงใบอนุญาต</p>
        <div class="flex justify-between items-center">
            <p class="text-sm font-semibold text-slate-700">อ้างอิง: <span id="display-ptw-id" class="text-navy font-mono">กำลังโหลด...</span></p>
            <span class="rounded bg-navy text-white px-2 py-0.5 text-[10px] font-bold">รอการบันทึก</span>
        </div>
        <p class="text-xs text-slate-600 mt-1">อ้างอิงจากแบบฟอร์มขออนุญาตทำงาน (PTW)</p>
      </div>

      <!-- คอนเทนเนอร์เก็บการ์ดขั้นตอนการทำงาน -->
      <div id="jsa-container" class="space-y-4">
        <!-- จะถูกสร้างโดย JavaScript -->
      </div>

      <!-- ปุ่มเพิ่มขั้นตอน -->

        <button type="button" onclick="submitJsa()"

  <script>

    // ==========================================

      'ของมีคมบาด/ทิ่มแทง': ['สวมอุปกรณ์ PPE ครบถ้วน', 'จัดเก็บเครื่องมือให้เป็นระเบียบ'],

      'เพลิงไหม้/ระเบิด': ['จัดเตรียมถังดับเพลิง', 'ปิดคลุมวัสดุติดไฟ/ท่อระบายน้ำ', 'ขออนุญาตทำงาน (PTW)'],
      'เสียงดังระดับอันตราย': ['สวมอุปกรณ์ PPE ครบถ้วน', 'สับเปลี่ยนหมุนเวียนพนักงาน'],
      'ความร้อน/เย็นจัด': ['จัดเตรียมน้ำดื่ม/เกลือแร่', 'สับเปลี่ยนหมุนเวียนพนักงาน', 'จัดเตรียมพื้นที่พักร่มรื่น'],
      'ท่าทางการทำงานที่ไม่เหมาะสม': ['สับเปลี่ยนหมุนเวียนพนักงาน', 'ยืดเหยียดกล้ามเนื้อก่อนทำงาน'],
      'แสงสว่างไม่เพียงพอ/จ้าเกินไป': ['ติดตั้งไฟส่องสว่างชั่วคราว', 'สวมอุปกรณ์ PPE ครบถ้วน'],
      'สัตว์มีพิษ/แมลงกัดต่อย': ['ตรวจสอบพื้นที่ก่อนเริ่มงาน', 'จัดเตรียมกล่องปฐมพยาบาล'],
      'อันตรายจากแรงดัน': ['ตัดแยกพลังงาน (LOTO)', 'ตรวจสอบเกจวัดแรงดัน'],
      'อันตรายจากการสั่นสะเทือน': ['สวมอุปกรณ์ PPE ครบถ้วน', 'สับเปลี่ยนหมุนเวียนพนักงาน']
    };

    const DEFAULT_MEASURES = ['ทำ Toolbox Talk', 'ขออนุญาตทำงาน (PTW)'];
    const HAZARD_KEYS = ['กระแสไฟฟ้ารั่ว/ช็อต', 'การกระเด็นของวัสดุเข้าตา', 'การชน/กระแทกจากเครื่องจักร', 'การตกหล่นของวัสดุ', 'การพลัดตกจากที่สูง', 'การสัมผัส/สูดดมสารเคมี', 'การสัมผัสรังสี', 'การหนีบ/ดึง/ทับ', 'ของมีคมบาด/ทิ่มแทง', 'ขาดอากาศ/อับอากาศ', 'เพลิงไหม้/ระเบิด', 'เสียงดังระดับอันตราย'];

    // ==========================================
    // ⚙️ เริ่มต้นทำงาน (Init)

    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        
        // อ่านรหัส PTW_ID จาก URL Parameter (ที่ส่งมาจากหน้าขอใบอนุญาต)

        currentPtwId = urlParams.get('ptw_id');
        
        if(currentPtwId) {
            document.getElementById('display-ptw-id').textContent = currentPtwId;
        } else {
            document.getElementById('display-ptw-id').textContent = "ไม่ได้อ้างอิงใบงาน";
        }

        addJsaStep(); // โหลดหน้าแรกปุ๊บ สร้างสเต็ป 1
    });

    // ---- Functions จัดการ UI ----
    function handleStepSelection(selectElement) {
        const stepContainer = selectElement.closest('.jsa-step');
        const textInput = stepContainer.querySelector('.step-text');
        
        if (selectElement.value === 'custom') {
            textInput.classList.remove('hidden');
            textInput.focus();
        } else {
            textInput.classList.add('hidden');
        }

        const hazardChips = stepContainer.querySelectorAll('.chip-hazard');
        hazardChips.forEach(chip => chip.classList.remove('active'));

        const selectedStep = selectElement.value;
        if (STEP_HAZARD_MAP[selectedStep]) {
            const hazardsToActivate = STEP_HAZARD_MAP[selectedStep];
            hazardChips.forEach(chip => {
                if (hazardsToActivate.includes(chip.textContent)) {
                    chip.classList.add('active'); 
                }
            });
        }
        updatePreventiveMeasures(stepContainer);
    }

    function toggleHybridWrapper(buttonElement, wrapperClass) {
        buttonElement.classList.toggle('active');
        const stepContainer = buttonElement.closest('.jsa-step');
        const wrapper = stepContainer.querySelector(`.${wrapperClass}`);
        
        if (buttonElement.classList.contains('active')) {
            wrapper.classList.remove('hidden');
            wrapper.classList.add('flex');
        } else {
            wrapper.classList.add('hidden');
            wrapper.classList.remove('flex');
            wrapper.querySelector('select').value = '';
            const textInput = wrapper.querySelector('input[type="text"]');
            textInput.value = '';
            textInput.classList.add('hidden');
            updatePreventiveMeasures(stepContainer);
        }
    }

    function handleHazardDropdown(selectElement) {
        const wrapper = selectElement.closest('div').parentElement;
        const textInput = wrapper.querySelector('.hazard-custom-text');
        if (selectElement.value === 'custom') {
            textInput.classList.remove('hidden');
            textInput.focus();
        } else {
            textInput.classList.add('hidden');
        }
        updatePreventiveMeasures(selectElement.closest('.jsa-step'));
    }

    function handleMeasureDropdown(selectElement) {
        const wrapper = selectElement.closest('div').parentElement;
        const textInput = wrapper.querySelector('.measure-custom-text');
        if (selectElement.value === 'custom') {
            textInput.classList.remove('hidden');
            textInput.focus();
        } else {
            textInput.classList.add('hidden');
        }
    }

    function toggleHazard(buttonElement) {
        buttonElement.classList.toggle('active');
        updatePreventiveMeasures(buttonElement.closest('.jsa-step'));
    }

    function updatePreventiveMeasures(stepContainer) {
        let activeHazards = Array.from(stepContainer.querySelectorAll('.chip-hazard.active'))
            .map(btn => btn.textContent)
            .filter(text => text !== '➕ อื่นๆ (ระบุ)'); 
            
        const hazardDropdown = stepContainer.querySelector('.hazard-others-wrapper select');
        if (hazardDropdown && hazardDropdown.value && hazardDropdown.value !== 'custom') {
            activeHazards.push(hazardDropdown.value);
        }
            
        let recommendedMeasures = new Set([...DEFAULT_MEASURES]); 
        
        activeHazards.forEach(hazard => {
            if(HAZARD_MEASURE_MAP[hazard]) {
                HAZARD_MEASURE_MAP[hazard].forEach(measure => recommendedMeasures.add(measure));
            }
        });

        const measureContainer = stepContainer.querySelector('.measures-container');
        const currentlyActiveMeasures = Array.from(measureContainer.querySelectorAll('.chip-measure.active'))
            .map(btn => btn.textContent);

        let measuresHtml = '';
        recommendedMeasures.forEach(measure => {
            const isActive = currentlyActiveMeasures.includes(measure) ? 'active' : '';
            measuresHtml += `<button type="button" class="chip chip-measure ${isActive}" onclick="this.classList.toggle('active')">${measure}</button>`;
        });
        measuresHtml += `<button type="button" class="chip chip-measure font-bold border-emerald-300 text-emerald-600" onclick="toggleHybridWrapper(this, 'measure-others-wrapper')">➕ อื่นๆ (ระบุ)</button>`;

        measureContainer.innerHTML = measuresHtml;
        
        const othersBtn = stepContainer.querySelector('.measure-others-wrapper').previousElementSibling; 
        const othersWrapper = stepContainer.querySelector('.measure-others-wrapper');
        if(!othersWrapper.classList.contains('hidden')){
             othersBtn.classList.add('active');
        }
    }

    function generateHazardButtons() {
        let html = '';
        HAZARD_KEYS.forEach(hazard => {
            html += `<button type="button" class="chip chip-hazard" onclick="toggleHazard(this)">${hazard}</button>`;
        });
        html += `<button type="button" class="chip chip-hazard font-bold border-red-300 text-red-600" onclick="toggleHybridWrapper(this, 'hazard-others-wrapper')">➕ อื่นๆ (ระบุ)</button>`;
        return html;
    }

    function addJsaStep() {
        stepCount++;
        const container = document.getElementById('jsa-container');
        
        const stepHTML = `
        <section class="jsa-step rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden mt-4" data-step="${stepCount}">
            <header class="flex items-center justify-between border-b border-slate-100 bg-slate-50 px-4 py-3">
              <div class="flex items-center gap-2">
                <span class="step-number flex h-6 w-6 items-center justify-center rounded-full bg-navy text-xs font-bold text-white shadow-inner">${stepCount}</span>
                <h3 class="font-bold text-navy text-sm">ส่วนที่ ${stepCount}: ขั้นตอนการทำงาน</h3>
              </div>
              <button type="button" onclick="this.closest('.jsa-step').remove(); renumberSteps();" class="text-red-500 hover:text-red-700 p-1 bg-red-50 rounded-lg ${stepCount === 1 ? 'hidden' : ''}">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </header>
            
            <div class="p-4 space-y-5">
                <div>
                    <label class="mb-1.5 block text-xs font-bold text-slate-700">1. ขั้นตอนการทำงาน (Job Step) <span class="text-red-500">*</span></label>
                    <div class="relative mb-2">
                        <select class="input-field appearance-none cursor-pointer pr-10 text-sm font-semibold text-navy border-slate-300 focus:border-navy" onchange="handleStepSelection(this)">
                            <option value="" disabled selected>-- เลือกขั้นตอนการทำงานมาตรฐาน --</option>
                            <option value="เตรียมพื้นที่และตรวจสอบอุปกรณ์">เตรียมพื้นที่และตรวจสอบเครื่องมือ (Site & Equip Prep)</option>
                            <option value="ขนย้ายและยกวัสดุอุปกรณ์">ขนย้ายและยกวัสดุอุปกรณ์ (Material Handling & Lifting)</option>
                            <option value="ติดตั้ง/รื้อถอนนั่งร้าน">ติดตั้ง/รื้อถอนนั่งร้าน (Scaffold Erection/Dismantling)</option>
                            <option value="ปฏิบัติงานตัด/เชื่อมโลหะ">ปฏิบัติงานตัด/เชื่อมโลหะ (Hot Work / Welding)</option>
                            <option value="ปฏิบัติงานขุดเจาะ/เปิดผิวดิน">งานขุดเจาะ/เปิดผิวดิน (Excavation Work)</option>
                            <option value="ปฏิบัติงานบนที่สูง">ปฏิบัติงานบนที่สูง (Working at Height)</option>
                            <option value="ปฏิบัติงานในที่อับอากาศ">ปฏิบัติงานในที่อับอากาศ (Confined Space Entry)</option>
                            <option value="งานเดินสายและติดตั้งระบบไฟฟ้า">งานเดินสายและติดตั้งระบบไฟฟ้า (Electrical Installation)</option>
                            <option value="งานทาสี/สัมผัสสารเคมี">งานทาสี/สัมผัสสารเคมี (Painting & Chemical Handling)</option>
                            <option value="เก็บกวาดและทำความสะอาดพื้นที่">เก็บกวาดและทำความสะอาดพื้นที่ (Housekeeping)</option>
                            <option value="custom" class="font-bold text-orange-600">✏️ พิมพ์ระบุขั้นตอนการทำงานเอง...</option>
                        </select>
                        <i data-lucide="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
                    </div>
                    <textarea class="step-text hidden input-field text-sm border-orange-300 focus:border-orange" rows="2" placeholder="โปรดระบุขั้นตอนการทำงานโดยละเอียด..."></textarea>
                </div>

                <div>
                    <label class="mb-1.5 block text-xs font-bold text-red-600">2. อันตรายที่อาจเกิดขึ้น (Hazards) <span class="text-[10px] text-slate-400 font-normal">แตะเพื่อเลือก</span> <span class="text-red-500">*</span></label>
                    <div class="flex flex-wrap gap-1.5 mb-2">
                        ${generateHazardButtons()}
                    </div>
                    <div class="hazard-others-wrapper hidden flex-col gap-2 mt-2 border border-red-200 p-3 rounded-xl bg-red-50/50">
                        <label class="text-[10px] font-bold text-red-600 uppercase tracking-widest">อันตรายอื่นๆ (Hazards)</label>
                        <div class="relative">
                            <select class="input-field appearance-none cursor-pointer pr-10 border-red-300 focus:border-red-600 text-red-700 text-xs font-semibold" onchange="handleHazardDropdown(this)">
                                <option value="" disabled selected>-- เลือกอันตรายเพิ่มเติม --</option>
                                <option value="ความร้อน/เย็นจัด">ความร้อน/เย็นจัด (Extreme Temperature)</option>
                                <option value="ท่าทางการทำงานที่ไม่เหมาะสม">ท่าทางการทำงานที่ไม่เหมาะสม (Ergonomics)</option>
                                <option value="แสงสว่างไม่เพียงพอ/จ้าเกินไป">แสงสว่างไม่เพียงพอ/จ้าเกินไป (Poor Lighting)</option>
                                <option value="สัตว์มีพิษ/แมลงกัดต่อย">สัตว์มีพิษ/แมลงกัดต่อย (Biological Hazards)</option>
                                <option value="อันตรายจากแรงดัน">อันตรายจากแรงดัน (Pressure Hazards)</option>
                                <option value="อันตรายจากการสั่นสะเทือน">อันตรายจากการสั่นสะเทือน (Vibration)</option>
                                <option value="custom" class="font-extrabold text-navy">✏️ พิมพ์ระบุอันตรายเอง (วิเคราะห์ 3ME)...</option>
                            </select>
                            <i data-lucide="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-red-400"></i>
                        </div>
                        <input type="text" class="hazard-custom-text hidden input-field text-xs border-red-300 focus:border-red-600 text-red-700" placeholder="โปรดพิมพ์ระบุอันตราย (วิเคราะห์จาก 3ME: คน, เครื่องจักร, วิธีการ)..." />
                    </div>
                </div>

                <div class="border-t border-slate-100 pt-4 bg-emerald-50/30 -mx-4 px-4 pb-2">
                    <label class="mb-1.5 block text-xs font-bold text-emerald-600 flex items-center gap-1.5"><i data-lucide="sparkles" class="w-3.5 h-3.5 text-emerald-500"></i> 3. มาตรการป้องกัน (Preventive Measures) <span class="text-red-500">*</span></label>
                    <div class="measures-container flex flex-wrap gap-1.5 mb-2">
                        <!-- ระบบจะ Inject ปุ่มมาให้ -->
                    </div>
                    <div class="measure-others-wrapper hidden flex-col gap-2 mt-2 border border-emerald-200 p-3 rounded-xl bg-white">
                        <label class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest">มาตรการป้องกันอื่นๆ (Measures)</label>
                        <div class="relative">
                            <select class="input-field appearance-none cursor-pointer pr-10 border-emerald-300 focus:border-emerald-600 text-emerald-700 text-xs font-semibold" onchange="handleMeasureDropdown(this)">
                                <option value="" disabled selected>-- เลือกมาตรการเพิ่มเติม --</option>
                                <option value="จัดเตรียมน้ำดื่ม/เกลือแร่">จัดเตรียมน้ำดื่ม/เกลือแร่</option>
                                <option value="จัดเตรียมพื้นที่พักร่มรื่น">จัดเตรียมพื้นที่พักร่มรื่น</option>
                                <option value="จัดทำนั่งร้านที่ได้มาตรฐาน/จุดเกี่ยวสายรัด">จัดทำนั่งร้านที่ได้มาตรฐาน/จุดเกี่ยวสายรัด</option>
                                <option value="ติดตั้งไฟส่องสว่างชั่วคราว">ติดตั้งไฟส่องสว่างชั่วคราว</option>
                                <option value="ปิดคลุมวัสดุติดไฟ/ท่อระบายน้ำ">ปิดคลุมวัสดุติดไฟ/ท่อระบายน้ำทิ้ง</option>
                                <option value="ตรวจสอบพื้นที่ก่อนเริ่มงาน">ตรวจสอบพื้นที่ก่อนเริ่มงาน (ตรวจหาสัตว์มีพิษ)</option>
                                <option value="สับเปลี่ยนหมุนเวียนพนักงาน">สับเปลี่ยนหมุนเวียนพนักงาน (Job Rotation)</option>
                                <option value="custom" class="font-extrabold text-navy">✏️ พิมพ์ระบุมาตรการเอง...</option>
                            </select>
                            <i data-lucide="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-emerald-400"></i>
                        </div>
                        <input type="text" class="measure-custom-text hidden input-field text-xs border-emerald-300 focus:border-emerald-600 text-emerald-700" placeholder="โปรดพิมพ์ระบุมาตรการป้องกัน..." />
                    </div>
                </div>

                <div class="border-t border-slate-100 pt-4 bg-slate-50/80 -mx-4 px-4 pb-1">
                    <label class="mb-1.5 block text-[11px] font-bold text-slate-500 tracking-widest uppercase">4. หมายเหตุ (Remarks)</label>
                    <textarea class="remark-input input-field text-xs bg-transparent border-slate-200" rows="1" placeholder="ระบุหมายเหตุ การเตรียมงาน หรือเก็บงาน..."></textarea>
                </div>
            </div>
        </section>
        `;
        
        container.insertAdjacentHTML('beforeend', stepHTML);
        lucide.createIcons();
        const newStep = container.lastElementChild;
        updatePreventiveMeasures(newStep);
    }

    function renumberSteps() {
        const steps = document.querySelectorAll('.jsa-step');
        stepCount = steps.length;
        steps.forEach((step, index) => {
            const num = index + 1;
            step.dataset.step = num;
            step.querySelector('.step-number').textContent = num;
            step.querySelector('h3').textContent = `ส่วนที่ ${num}: ขั้นตอนการทำงาน`;
        });
    }

    // ==========================================
    // 🚀 ระบบบันทึกข้อมูล (ส่งเข้า Supabase)
    // ==========================================
    async function submitJsa() {
        if (!currentPtwId) {
            Swal.fire('ข้อผิดพลาด', 'ไม่พบรหัสอ้างอิงใบงาน (PTW-ID) ไม่สามารถบันทึกข้อมูลได้', 'error');
            return;
        }

        const steps = document.querySelectorAll('.jsa-step');
        let ejsaDataArray = [];
        let isValid = true;

        // 1. กวาดข้อมูลจากทุกการ์ด (Loop through steps)
        steps.forEach((stepEl, index) => {
            // ดึง ขั้นตอนงาน
            const stepSelect = stepEl.querySelector('select.input-field').value;
            const stepCustom = stepEl.querySelector('.step-text').value;
            let stepName = stepSelect === 'custom' ? stepCustom : stepSelect;
            if (!stepName) isValid = false;

            // ดึง อันตราย
            let hazards = Array.from(stepEl.querySelectorAll('.chip-hazard.active')).map(btn => btn.textContent).filter(text => text !== '➕ อื่นๆ (ระบุ)');
            const hazardDropdown = stepEl.querySelector('.hazard-others-wrapper select').value;
            const hazardCustom = stepEl.querySelector('.hazard-custom-text').value;
            if (hazardDropdown && hazardDropdown !== 'custom') hazards.push(hazardDropdown);
            if (hazardDropdown === 'custom' && hazardCustom) hazards.push(hazardCustom);
            if (hazards.length === 0) isValid = false;

            // ดึง มาตรการป้องกัน
            let measures = Array.from(stepEl.querySelectorAll('.chip-measure.active')).map(btn => btn.textContent).filter(text => text !== '➕ อื่นๆ (ระบุ)');
            const measureDropdown = stepEl.querySelector('.measure-others-wrapper select').value;
            const measureCustom = stepEl.querySelector('.measure-custom-text').value;
            if (measureDropdown && measureDropdown !== 'custom') measures.push(measureDropdown);
            if (measureDropdown === 'custom' && measureCustom) measures.push(measureCustom);
            if (measures.length === 0) isValid = false;

            // ดึง หมายเหตุ
            const remark = stepEl.querySelector('.remark-input').value;

            // แพ็กใส่ JSON
            ejsaDataArray.push({
                step_no: index + 1,
                step_name: stepName,
                hazards: hazards,
                measures: measures,
                remark: remark
            });
        });

        if (!isValid) {
            Swal.fire('ข้อมูลไม่ครบถ้วน', 'กรุณาระบุขั้นตอนงาน อันตราย และมาตรการป้องกันให้ครบทุกส่วน', 'warning');
            return;
        }

        Swal.fire({ title: 'กำลังบันทึก E-JSA...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            if (!supabaseClient) throw new Error("ไม่สามารถเชื่อมต่อฐานข้อมูลได้");

            // 2. ดึงข้อมูลเดิมลงมาก่อน (เพื่อไม่ให้ PPE หรือข้อมูลอื่นๆ หายไป)
            const { data: permitData, error: fetchError } = await supabaseClient
                .from('tb_work_permits')
                .select('specific_data')
                .eq('ptw_id', currentPtwId)
                .single();

            if (fetchError) throw fetchError;

            // 3. เอา E-JSA ยัดเพิ่มเข้าไปใน specific_data
            let specificData = permitData.specific_data || {};
            specificData.ejsa_data = ejsaDataArray; 

            // 4. อัปเดตกลับขึ้นคลาวด์
            const { error: updateError } = await supabaseClient
                .from('tb_work_permits')
                .update({ specific_data: specificData })
                .eq('ptw_id', currentPtwId);

            if (updateError) throw updateError;

            Swal.fire({
                title: 'บันทึก E-JSA สำเร็จ!',
                text: 'ข้อมูล JSA ถูกแนบเข้ากับใบอนุญาต ' + currentPtwId + ' เรียบร้อยแล้ว',
                icon: 'success',
                confirmButtonColor: '#2A4365',
                confirmButtonText: 'ปิดหน้าต่าง'
            }).then(() => {
                // ปิดแอป
                if (typeof liff !== 'undefined' && liff.isInClient()) {
                    liff.closeWindow();
                } else {
                    // ถ้าทำบนเบราว์เซอร์ก็วิ่งกลับหน้าหลัก
                    window.location.href = 'index.html'; 
                }
            });

        } catch (error) {
            console.error('Save E-JSA Error:', error);
            Swal.fire('บันทึกไม่สำเร็จ', 'เกิดข้อผิดพลาด: ' + error.message, 'error');
        }
    }
  </script>
