    // 🚀 ฐานข้อมูล 3-Tier Smart Logic 🚀
    const JSA_DATABASE = {

            controls: ["ยกด้วยความระมัดระวัง และให้สัญญาณทุกครั้ง", "ใช้ท่าทางการยกของตามหลักการยศาสตร์", "สวมใส่อุปกรณ์ป้องกัน (หมวก, รองเท้าเซฟตี้, ถุงมือหนัง)"]

        },
        "งานเกี่ยวกับไฟฟ้า": {

        },
        "งานในที่อับอากาศ (Confined Space)": {

            controls: ["ตรวจวัดปริมาณแก๊ส (Gas Test) และออกซิเจนก่อนเข้า", "ติดตั้งระบบพัดลมระบายอากาศอย่างต่อเนื่อง", "ต้องมีผู้เฝ้าระวัง (Hole Watch) ประจำปากทางตลอดเวลา", "ใช้อุปกรณ์ไฟฟ้าแรงดันต่ำไม่เกิน 24 Volt"]
        },
        "งานขุดเจาะดิน": {
            hazards: ["ดินพังทลายทับผู้ปฏิบัติงาน", "เครื่องจักรชนคนงาน", "พลัดตกลงไปในหลุมขุดเจาะ"],
            controls: ["ทำผนังกันดินหรือค้ำยันหากขุดลึกเกิน 1.2 เมตร", "ทำรั้วกั้น (Barricade) รอบปากหลุมพร้อมป้ายเตือน", "ห้ามกองดินใกล้ขอบหลุมน้อยกว่า 0.5 เมตร", "ทำทางขึ้น-ลงที่ปลอดภัย"]
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        
        const urlParams = new URLSearchParams(window.location.search);
        currentPtwId = urlParams.get('ptw_id');
        
        if(currentPtwId) {
            document.getElementById('displayPtwId').textContent = currentPtwId;
        } else {
            document.getElementById('displayPtwId').textContent = "ไม่พบรหัสอ้างอิง";
            Swal.fire('ข้อผิดพลาด', 'ไม่พบรหัสใบงาน (PTW ID) กรุณากลับไปทำรายการใหม่', 'error');
        }

        addJsaStep();
    });

    function addJsaStep() {
        stepCount++;
        const stepId = stepCount;
        const container = document.getElementById('jsaStepsContainer');

        let taskOptions = '<option value="">-- โปรดเลือกขั้นตอนการทำงาน --</option>';
        for (const [task, data] of Object.entries(JSA_DATABASE)) {
            taskOptions += `<option value="${task}">${task}</option>`;
        }
        taskOptions += `<option value="อื่นๆ">พิมพ์ระบุขั้นตอนการทำงานเอง (Custom)</option>`;

        const stepHtml = `
        <div id="step-block-${stepId}" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 relative">
            ${stepId > 1 ? `<button type="button" onclick="removeJsaStep(${stepId})" class="absolute top-4 right-4 text-slate-400 hover:text-red-500"><i data-lucide="trash-2" class="w-5 h-5"></i></button>` : ''}
            
            <div class="flex items-center gap-2 mb-4">
                <div class="w-6 h-6 rounded-full bg-navy text-white flex items-center justify-center text-xs font-bold">${stepId}</div>
                <h3 class="font-bold text-navy text-sm">ลำดับขั้นตอนการทำงาน (Method Statement)</h3>
            </div>

            <!-- Task Selection -->
            <div class="mb-4">
                <select id="task-select-${stepId}" onchange="handleTaskChange(${stepId})" class="input-field cursor-pointer border-navy/30 focus:border-navy text-navy font-semibold">
                    ${taskOptions}
                </select>
                <input type="text" id="task-custom-${stepId}" placeholder="โปรดพิมพ์ระบุขั้นตอนการทำงาน..." class="input-field mt-2 hidden" />
            </div>

            <!-- Photo Upload for this step -->
            <div class="mb-4 bg-slate-50 border border-slate-200 rounded-xl p-3">
                <label class="text-xs font-bold text-slate-700 flex items-center gap-1 mb-2"><i data-lucide="camera" class="w-4 h-4"></i> รูปถ่ายหน้างานจริง/เครื่องมือ (Photo)</label>
                <div class="flex items-center gap-3">
                    <label class="cursor-pointer flex items-center justify-center gap-1.5 bg-white border border-slate-300 text-slate-600 px-3 py-2 rounded-lg text-xs font-semibold shadow-sm hover:bg-slate-100 transition">
                        <i data-lucide="upload" class="w-4 h-4"></i> แนบรูปภาพ
                        <input type="file" id="step-photo-${stepId}" accept="image/*" capture="environment" class="hidden" onchange="handleStepPhoto(${stepId}, this)" />
                    </label>
                    <div id="preview-container-${stepId}" class="hidden relative h-14 w-14 rounded-lg overflow-hidden border border-slate-200 shadow-sm">
                        <img id="step-preview-${stepId}" class="h-full w-full object-cover" />
                        <button type="button" onclick="removeStepPhoto(${stepId})" class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full p-0.5 transform scale-75"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <span id="photo-status-${stepId}" class="text-[10px] text-slate-400">ยังไม่มีรูปภาพ</span>
                </div>
            </div>

            <!-- Hazards & Controls Containers -->
            <div id="logic-container-${stepId}" class="hidden space-y-4 pt-3 border-t border-slate-100">
                <!-- Hazards -->
                <div>
                    <label class="text-xs font-bold text-red-600 uppercase tracking-wide flex items-center gap-1 mb-2"><i data-lucide="alert-triangle" class="w-4 h-4"></i> อันตรายที่อาจเกิดขึ้น (Potential Hazard)</label>
                    <div id="hazards-list-${stepId}" class="flex flex-col gap-1.5"></div>
                    <input type="text" id="hazard-custom-${stepId}" placeholder="+ เพิ่มอันตรายอื่นๆ (ถ้ามี)" class="input-field text-sm mt-2 border-red-200 focus:border-red-500" />
                </div>

                <!-- Controls -->
                <div>
                    <label class="text-xs font-bold text-emerald-600 uppercase tracking-wide flex items-center gap-1 mb-2"><i data-lucide="shield-check" class="w-4 h-4"></i> มาตรการป้องกัน/แก้ไข (Risk Control)</label>
                    <div id="controls-list-${stepId}" class="flex flex-col gap-1.5"></div>
                    <input type="text" id="control-custom-${stepId}" placeholder="+ เพิ่มมาตรการป้องกันอื่นๆ (ถ้ามี)" class="input-field text-sm mt-2 border-emerald-200 focus:border-emerald-500" />
                </div>
            </div>
        </div>
        `;
        container.insertAdjacentHTML('beforeend', stepHtml);
        lucide.createIcons();
    }

    function removeJsaStep(id) {
        const block = document.getElementById(`step-block-${id}`);
        if(block) block.remove();
        delete stepFiles[id];
    }

    // 🚀 จัดการรูปถ่ายและการบีบอัดภาพ 🚀
    async function handleStepPhoto(stepId, inputElement) {
        if (!inputElement.files || inputElement.files.length === 0) return;
        let file = inputElement.files[0];
        
        const statusText = document.getElementById(`photo-status-${stepId}`);
        statusText.textContent = "กำลังประมวลผล...";
        statusText.classList.remove('text-slate-400');
        statusText.classList.add('text-orange');

        try {
            // แปลง HEIC ถ้าเป็น iPhone
            if (file.type === 'image/heic' || file.name.toLowerCase().endsWith('.heic')) {
                if (typeof heic2any !== 'undefined') {
                    const convertedBlob = await heic2any({ blob: file, toType: 'image/jpeg' });
                    file = new File([Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob], file.name.replace(/\.heic$/i, ".jpg"), { type: 'image/jpeg' });
                }
            }

            // บีบอัดภาพผ่าน Canvas
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    const maxWidth = 1000;
                    if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob(blob => {
                        const compressedFile = new File([blob], `step_${stepId}_${Date.now()}.jpg`, { type: 'image/jpeg' });
                        stepFiles[stepId] = compressedFile; // เก็บไฟล์ลง Object
                        
                        // แสดงรูปตัวอย่าง
                        document.getElementById(`step-preview-${stepId}`).src = URL.createObjectURL(blob);
                        document.getElementById(`preview-container-${stepId}`).classList.remove('hidden');
                        
                        statusText.textContent = "รูปภาพพร้อมใช้งาน";
                        statusText.classList.replace('text-orange', 'text-emerald-600');
                    }, 'image/jpeg', 0.7); 
                };
            };
        } catch (err) {
            console.error('Photo processing error:', err);
            statusText.textContent = "เกิดข้อผิดพลาด";
            statusText.classList.replace('text-orange', 'text-red-500');
        }
    }

    function removeStepPhoto(stepId) {
        delete stepFiles[stepId];
        document.getElementById(`step-photo-${stepId}`).value = '';
        document.getElementById(`preview-container-${stepId}`).classList.add('hidden');
        
        const statusText = document.getElementById(`photo-status-${stepId}`);
        statusText.textContent = "ยังไม่มีรูปภาพ";
        statusText.classList.remove('text-emerald-600', 'text-red-500', 'text-orange');
        statusText.classList.add('text-slate-400');
    }

    // 🚀 3-Tier Logic 🚀
    function handleTaskChange(stepId) {
        const selectEl = document.getElementById(`task-select-${stepId}`);
        const customTaskInput = document.getElementById(`task-custom-${stepId}`);
        const logicContainer = document.getElementById(`logic-container-${stepId}`);
        const hazardsList = document.getElementById(`hazards-list-${stepId}`);
        const controlsList = document.getElementById(`controls-list-${stepId}`);
        
        const selectedTask = selectEl.value;

        hazardsList.innerHTML = '';
        controlsList.innerHTML = '';

        if (!selectedTask) {
            logicContainer.classList.add('hidden');
            customTaskInput.classList.add('hidden');
            return;
        }

        logicContainer.classList.remove('hidden');

        if (selectedTask === 'อื่นๆ') {
            customTaskInput.classList.remove('hidden');
            return;
        } else {
            customTaskInput.classList.add('hidden');
        }

        const dbData = JSA_DATABASE[selectedTask];
        if (dbData) {
            dbData.hazards.forEach((hazard) => {
                hazardsList.innerHTML += `
                    <label class="check-item active" onclick="toggleActive(this)">
                        <input type="checkbox" checked value="${hazard}" class="hazard-check-${stepId}">
                        <span class="check-text">${hazard}</span>
                    </label>`;
            });

            dbData.controls.forEach((control) => {
                controlsList.innerHTML += `
                    <label class="check-item active" onclick="toggleActive(this)">
                        <input type="checkbox" checked value="${control}" class="control-check-${stepId}">
                        <span class="check-text">${control}</span>
                    </label>`;
            });
        }
    }

    function toggleActive(labelElement) {
        const checkbox = labelElement.querySelector('input[type="checkbox"]');
        setTimeout(() => {
            if(checkbox.checked) {
                labelElement.classList.add('active');
            } else {
                labelElement.classList.remove('active');
            }
        }, 10);
    }

    // ---- Submit Data ----
    async function submitEJsa() {
        if(!currentPtwId) {
            Swal.fire('ข้อผิดพลาด', 'ไม่พบรหัสใบงาน (PTW ID)', 'error');
            return;
        }

        let eJsaDataArray = [];
        let hasError = false;

        const stepBlocks = document.querySelectorAll('[id^="step-block-"]');
        for (let block of stepBlocks) {
            const stepId = block.id.replace('step-block-', '');
            
            let task = document.getElementById(`task-select-${stepId}`).value;
            if (task === 'อื่นๆ') task = document.getElementById(`task-custom-${stepId}`).value;

            if (!task || task.trim() === '') {
                hasError = true;
                break;
            }

            let hazards = [];
            document.querySelectorAll(`.hazard-check-${stepId}:checked`).forEach(chk => hazards.push(chk.value));
            const customHazard = document.getElementById(`hazard-custom-${stepId}`).value.trim();
            if (customHazard) hazards.push(customHazard);

            let controls = [];
            document.querySelectorAll(`.control-check-${stepId}:checked`).forEach(chk => controls.push(chk.value));
            const customControl = document.getElementById(`control-custom-${stepId}`).value.trim();
            if (customControl) controls.push(customControl);

            eJsaDataArray.push({
                step_no: parseInt(stepId),
                step_id: stepId, // Use as reference for photo mapping
                task_description: task,
                potential_hazards: hazards,
                preventive_controls: controls,
                step_photo_url: null // จะอัปเดตหลังจากอัปโหลดรูป
            });
        }

        if (hasError || eJsaDataArray.length === 0) {
            Swal.fire('ข้อมูลไม่ครบถ้วน', 'กรุณาระบุขั้นตอนการทำงานให้ครบถ้วนก่อนบันทึกครับ', 'warning');
            return;
        }

        Swal.fire({ title: 'กำลังบันทึก E-JSA และอัปโหลดรูป...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            // 1. อัปโหลดรูปภาพของแต่ละขั้นตอน (ถ้ามี)
            for (let data of eJsaDataArray) {
                const file = stepFiles[data.step_id];
                if (file) {
                    const filePath = `jsa-steps-docs/${currentPtwId}_step${data.step_no}_${Date.now()}.jpg`;
                    const { error: uploadError } = await supabaseClient.storage.from('safety-documents').upload(filePath, file);
                    if (uploadError) throw uploadError;
                    
                    data.step_photo_url = supabaseClient.storage.from('safety-documents').getPublicUrl(filePath).data.publicUrl;
                }
                // ลบตัวแปร step_id ออกก่อนอัปเดตลง JSON เพื่อความสะอาดของข้อมูล
                delete data.step_id;
            }

            // 2. ดึงข้อมูล specific_data เดิมมาก่อน เพื่อไม่ให้ข้อมูล PPE ทับหายไป
            const { data: existingData, error: fetchErr } = await supabaseClient
                .from('tb_work_permits')
                .select('specific_data')
                .eq('ptw_id', currentPtwId)
                .single();
            
            if (fetchErr) throw fetchErr;

            // 3. ผสมข้อมูล ejsa_data เข้าไปใน specific_data เดิม
            let updatedSpecificData = existingData.specific_data || {};
            updatedSpecificData.ejsa_data = eJsaDataArray;

            // 4. อัปเดตกลับไปที่ฐานข้อมูล
            const { error: updateErr } = await supabaseClient
                .from('tb_work_permits')
                .update({ specific_data: updatedSpecificData })
                .eq('ptw_id', currentPtwId);

            if (updateErr) throw updateErr;

            Swal.fire({
                title: 'สำเร็จ!',
                text: 'บันทึกแผนประเมินความเสี่ยง E-JSA พร้อมรูปถ่ายเรียบร้อย ข้อมูลถูกส่งให้ จป. อนุมัติแล้ว',
                icon: 'success',
                confirmButtonColor: '#2A4365',
                confirmButtonText: 'กลับสู่หน้าหลัก'
            }).then(() => {
                if (typeof liff !== 'undefined' && liff.isInClient()) { 
                    liff.closeWindow();
                } else { 
                    window.location.href = '../index.html'; 
                }
            });

        } catch (err) {
            console.error('Update E-JSA Error:', err);
            Swal.fire('บันทึกไม่สำเร็จ', 'เกิดข้อผิดพลาด: ' + err.message, 'error');
        }
    }
  </script>

  <style>
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>
</body>
</html>
