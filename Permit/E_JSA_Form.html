<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Smart E-JSA | FTC First Safety</title>

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Sarabun font -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- LIFF, Supabase, SweetAlert2 -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Sarabun', 'sans-serif'] },
          colors: {
            navy: { DEFAULT: '#2A4365', 700: '#22364F' },
            orange: { DEFAULT: '#DB5A24', 600: '#C24D1C' },
            surface: '#F4F7F9',
          },
        },
      },
    }
  </script>

  <style>
    body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
    .input-field { width: 100%; border-radius: 0.5rem; border: 1px solid #e2e8f0; background-color: #fff; padding: 0.6rem 0.75rem; font-size: 0.875rem; color: #1e293b; outline: none; transition: all 0.2s; }
    .input-field:focus { border-color: #2A4365; box-shadow: 0 0 0 3px rgba(42, 67, 101, 0.1); }
    
    .check-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px; border-radius: 8px; background: #f8fafc; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s; }
    .check-item:hover { background: #f1f5f9; }
    .check-item.active { background: #eff6ff; border-color: #93c5fd; }
    .check-item input[type="checkbox"] { margin-top: 3px; accent-color: #2A4365; cursor: pointer; }
    .check-text { font-size: 0.85rem; color: #334155; line-height: 1.4; }
  </style>
</head>

<body class="bg-surface antialiased text-slate-800">

  <!-- Header -->
  <header class="sticky top-0 z-40 border-b border-navy-700/40 bg-navy text-white shadow-md">
    <div class="mx-auto flex max-w-xl items-center gap-3 px-4 py-3">
      <div class="min-w-0 flex-1">
        <h1 class="truncate text-base font-bold leading-tight flex items-center gap-2">
            <i data-lucide="sparkles" class="w-5 h-5 text-yellow-300"></i> Smart E-JSA
        </h1>
        <p class="truncate text-xs text-white/70 uppercase">การวิเคราะห์ความปลอดภัยในการทำงาน</p>
      </div>
      <div class="text-right">
        <p class="text-[10px] text-white/60">เลขที่อ้างอิงใบงาน</p>
        <p id="displayPtwId" class="text-xs font-bold text-orange tracking-widest">กำลังดึงข้อมูล...</p>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-xl px-4 py-6 pb-28">
    <div class="mb-4 bg-blue-50 border border-blue-200 rounded-xl p-4 flex gap-3 shadow-sm">
        <i data-lucide="info" class="w-6 h-6 text-blue-600 shrink-0"></i>
        <div class="text-sm text-blue-900 leading-relaxed">
            <b>ระบบอัจฉริยะ (3-Tier Logic)</b> <br>
            เพียงเลือก "ขั้นตอนการทำงาน" ระบบจะทำการประเมินอันตรายและระบุมาตรการป้องกันให้อัตโนมัติ (ท่านสามารถแก้ไขหรือพิมพ์เพิ่มเติมได้)
        </div>
    </div>

    <!-- Container สำหรับใส่ขั้นตอน JSA -->
    <div id="jsaStepsContainer" class="space-y-6"></div>

    <button type="button" onclick="addJsaStep()" class="mt-6 w-full flex items-center justify-center gap-2 py-4 border-2 border-dashed border-navy/40 text-navy rounded-xl font-bold text-sm hover:bg-navy/5 transition-colors">
        <i data-lucide="plus-circle" class="w-5 h-5"></i> เพิ่มขั้นตอนการทำงานต่อไป
    </button>
  </main>

  <!-- Sticky bottom bar -->
  <div class="fixed inset-x-0 bottom-0 z-50 border-t border-slate-200 bg-white/95 backdrop-blur-md pb-safe shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
    <div class="mx-auto max-w-xl px-4 py-3">
      <button type="button" id="submitBtn" onclick="submitEJsa()"
        class="w-full flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-orange to-orange-600 py-4 text-center text-[15px] font-bold text-white shadow-lg shadow-orange/30 transition active:scale-[0.98]">
        <i data-lucide="save" class="w-5 h-5"></i> บันทึกข้อมูล E-JSA และดำเนินการต่อ
      </button>
    </div>
  </div>

  <script>
    // ---- Supabase Setup ----
    const SUPABASE_URL = 'https://ancwqgaaqliandzdzphg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_IVdSBILj_etRSNF48ig1PA_sBAt23NG';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let currentPtwId = null;
    let stepCount = 0;

    // 🚀 ฐานข้อมูล 3-Tier Smart Logic (อ้างอิงจากคู่มือความปลอดภัยหน้า 68-79) 🚀
    const JSA_DATABASE = {
        "งานขนย้ายวัสดุอุปกรณ์": {
            hazards: ["ชน กระแทก ทับ", "ลื่น ล้ม สะดุด", "วัสดุหล่นใส่ / หนีบมือ", "ฝุ่นละอองฟุ้งกระจาย"],
            controls: ["ตรวจสอบเส้นทางและอุปกรณ์ก่อนขนย้าย", "สวมใส่อุปกรณ์ป้องกัน (หมวก, รองเท้าเซฟตี้, ถุงมือ)", "จัดวางวัสดุให้เป็นระเบียบ", "หากของหนักต้องใช้เครื่องทุ่นแรงหรือยก 2 คนขึ้นไป"]
        },
        "งานบนที่สูง (นั่งร้าน/บันได)": {
            hazards: ["พลัดตกจากที่สูง", "สิ่งของ/เครื่องมือตกหล่นใส่ผู้อื่น", "นั่งร้านหรือบันไดพังทลาย"],
            controls: ["ตรวจสอบโครงสร้างนั่งร้าน/บันไดให้มั่นคงก่อนใช้งาน", "สวมใส่เข็มขัดกันตกเต็มตัว (Full Body Harness) และเกี่ยวสายช่วยชีวิต", "ห้ามโยนสิ่งของขึ้น-ลง ให้ใช้เชือกผูกดึง", "กั้นพื้นที่ด้านล่าง (Barricade) ป้องกันของตก"]
        },
        "งานที่ก่อให้เกิดประกายไฟ (Hot Work)": {
            hazards: ["เพลิงไหม้ / อัคคีภัย", "สะเก็ดไฟกระเด็นเข้าตาหรือลวกผิวหนัง", "ก๊าซรั่วไหลหรือถังความดันระเบิด", "ควันพิษจากฟูมการเชื่อม"],
            controls: ["ตรวจสอบพื้นที่ เคลียร์วัตถุไวไฟออกห่างอย่างน้อย 20 เมตร", "สวมหน้ากากเชื่อม แว่นตา และถุงมือหนัง", "เตรียมถังดับเพลิงประจำจุดอย่างน้อย 1 ถัง", "ปูผ้าใบกันไฟ / ถาดรองสะเก็ดไฟ", "ติดตั้งอุปกรณ์ป้องกันไฟย้อนกลับ (Flash back arrestor)"]
        },
        "งานเกี่ยวกับไฟฟ้า": {
            hazards: ["ไฟฟ้าดูด / ไฟฟ้าช็อต", "ไฟฟ้าลัดวงจร (Short Circuit)", "อุปกรณ์หรือตู้คอนโทรลระเบิด"],
            controls: ["ตรวจสอบสายไฟและอุปกรณ์ ต้องไม่มีรอยฉีกขาด", "ติดตั้งระบบสายดิน (Ground) และ Earth Leakage", "สวมถุงมือและรองเท้าที่เป็นฉนวนกันไฟฟ้า", "ต้องแขวนป้ายเตือน (Tag Out) และตัดกระแสไฟก่อนซ่อมบำรุง"]
        },
        "งานในที่อับอากาศ (Confined Space)": {
            hazards: ["ขาดออกซิเจน / เป็นลมหมดสติ", "สูดดมแก๊สพิษหรือฝุ่นละออง", "อันตรายจากสารระเบิดได้"],
            controls: ["ตรวจวัดปริมาณแก๊ส (Gas Test) และออกซิเจนก่อนเข้า", "ติดตั้งระบบพัดลมระบายอากาศอย่างต่อเนื่อง", "ต้องมีผู้เฝ้าระวัง (Hole Watch) ประจำปากทางตลอดเวลา", "ใช้อุปกรณ์ไฟฟ้าแรงดันต่ำไม่เกิน 24 Volt"]
        },
        "งานขุดเจาะดิน": {
            hazards: ["ดินพังทลายทับผู้ปฏิบัติงาน", "เครื่องจักรชนคนงาน", "พลัดตกลงไปในหลุมขุดเจาะ"],
            controls: ["ทำผนังกันดินหรือค้ำยันหากขุดลึกเกิน 1.2 เมตร", "ทำรั้วกั้น (Barricade) รอบปากหลุมพร้อมป้ายเตือน", "ห้ามกองดินใกล้ขอบหลุมน้อยกว่า 0.5 เมตร", "ทำทางขึ้น-ลงที่ปลอดภัย"]
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        
        // ดึง ptw_id จาก URL
        const urlParams = new URLSearchParams(window.location.search);
        currentPtwId = urlParams.get('ptw_id');
        
        if(currentPtwId) {
            document.getElementById('displayPtwId').textContent = currentPtwId;
        } else {
            document.getElementById('displayPtwId').textContent = "ไม่พบรหัสอ้างอิง";
            Swal.fire('ข้อผิดพลาด', 'ไม่พบรหัสใบงาน (PTW ID) กรุณากลับไปทำรายการใหม่', 'error');
        }

        // สร้าง Step แรกอัตโนมัติ
        addJsaStep();
    });

    function addJsaStep() {
        stepCount++;
        const stepId = stepCount;
        const container = document.getElementById('jsaStepsContainer');

        let taskOptions = '<option value="">-- โปรดเลือกขั้นตอนการทำงาน --</option>';
        for (const [task, data] of Object.entries(JSA_DATABASE)) {
            taskOptions += `<option value="${task}">${task}</option>`;
        }
        taskOptions += `<option value="อื่นๆ">พิมพ์ระบุขั้นตอนการทำงานเอง (Custom)</option>`;

        const stepHtml = `
        <div id="step-block-${stepId}" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 relative">
            ${stepId > 1 ? `<button type="button" onclick="removeJsaStep(${stepId})" class="absolute top-4 right-4 text-slate-400 hover:text-red-500"><i data-lucide="trash-2" class="w-5 h-5"></i></button>` : ''}
            
            <div class="flex items-center gap-2 mb-4">
                <div class="w-6 h-6 rounded-full bg-navy text-white flex items-center justify-center text-xs font-bold">${stepId}</div>
                <h3 class="font-bold text-navy text-sm">ลำดับขั้นตอนการทำงาน</h3>
            </div>

            <!-- Task Selection -->
            <div class="mb-4">
                <select id="task-select-${stepId}" onchange="handleTaskChange(${stepId})" class="input-field cursor-pointer border-navy/30 focus:border-navy text-navy font-semibold">
                    ${taskOptions}
                </select>
                <input type="text" id="task-custom-${stepId}" placeholder="โปรดพิมพ์ระบุขั้นตอนการทำงาน..." class="input-field mt-2 hidden" />
            </div>

            <!-- Hazards & Controls Containers (Hidden initially) -->
            <div id="logic-container-${stepId}" class="hidden space-y-4 pt-3 border-t border-slate-100">
                
                <!-- Hazards -->
                <div>
                    <label class="text-xs font-bold text-red-600 uppercase tracking-wide flex items-center gap-1 mb-2"><i data-lucide="alert-triangle" class="w-4 h-4"></i> อันตรายที่อาจเกิดขึ้น</label>
                    <div id="hazards-list-${stepId}" class="flex flex-col gap-1.5"></div>
                    <input type="text" id="hazard-custom-${stepId}" placeholder="+ เพิ่มอันตรายอื่นๆ (ถ้ามี)" class="input-field text-sm mt-2 border-red-200 focus:border-red-500" />
                </div>

                <!-- Controls -->
                <div>
                    <label class="text-xs font-bold text-emerald-600 uppercase tracking-wide flex items-center gap-1 mb-2"><i data-lucide="shield-check" class="w-4 h-4"></i> มาตรการป้องกัน/แก้ไข</label>
                    <div id="controls-list-${stepId}" class="flex flex-col gap-1.5"></div>
                    <input type="text" id="control-custom-${stepId}" placeholder="+ เพิ่มมาตรการป้องกันอื่นๆ (ถ้ามี)" class="input-field text-sm mt-2 border-emerald-200 focus:border-emerald-500" />
                </div>
            </div>
        </div>
        `;
        container.insertAdjacentHTML('beforeend', stepHtml);
        lucide.createIcons();
    }

    function removeJsaStep(id) {
        const block = document.getElementById(`step-block-${id}`);
        if(block) block.remove();
    }

    // 🚀 ฟังก์ชันหัวใจหลัก: 3-Tier Logic 🚀
    function handleTaskChange(stepId) {
        const selectEl = document.getElementById(`task-select-${stepId}`);
        const customTaskInput = document.getElementById(`task-custom-${stepId}`);
        const logicContainer = document.getElementById(`logic-container-${stepId}`);
        const hazardsList = document.getElementById(`hazards-list-${stepId}`);
        const controlsList = document.getElementById(`controls-list-${stepId}`);
        
        const selectedTask = selectEl.value;

        // Reset
        hazardsList.innerHTML = '';
        controlsList.innerHTML = '';

        if (!selectedTask) {
            logicContainer.classList.add('hidden');
            customTaskInput.classList.add('hidden');
            return;
        }

        logicContainer.classList.remove('hidden');

        if (selectedTask === 'อื่นๆ') {
            customTaskInput.classList.remove('hidden');
            // กรณีเลือกอื่นๆ จะไม่มี Auto-suggest โชว์ช่องให้พิมพ์อย่างเดียว
            return;
        } else {
            customTaskInput.classList.add('hidden');
        }

        // ดึงข้อมูลจาก Database
        const dbData = JSA_DATABASE[selectedTask];
        if (dbData) {
            // Render Hazards
            dbData.hazards.forEach((hazard, idx) => {
                hazardsList.innerHTML += `
                    <label class="check-item active" onclick="toggleActive(this)">
                        <input type="checkbox" checked value="${hazard}" class="hazard-check-${stepId}">
                        <span class="check-text">${hazard}</span>
                    </label>
                `;
            });

            // Render Controls
            dbData.controls.forEach((control, idx) => {
                controlsList.innerHTML += `
                    <label class="check-item active" onclick="toggleActive(this)">
                        <input type="checkbox" checked value="${control}" class="control-check-${stepId}">
                        <span class="check-text">${control}</span>
                    </label>
                `;
            });
        }
    }

    function toggleActive(labelElement) {
        const checkbox = labelElement.querySelector('input[type="checkbox"]');
        // setTimeout เพื่อให้ click event ของ checkbox ทำงานก่อนแล้วค่อยอัปเดต UI
        setTimeout(() => {
            if(checkbox.checked) {
                labelElement.classList.add('active');
            } else {
                labelElement.classList.remove('active');
            }
        }, 10);
    }

    // ---- Submit Data ----
    async function submitEJsa() {
        if(!currentPtwId) {
            Swal.fire('ข้อผิดพลาด', 'ไม่พบรหัสใบงาน (PTW ID)', 'error');
            return;
        }

        let eJsaDataArray = [];
        let hasError = false;

        // วนลูปเก็บข้อมูลทุก Step
        const stepBlocks = document.querySelectorAll('[id^="step-block-"]');
        stepBlocks.forEach(block => {
            const stepId = block.id.replace('step-block-', '');
            
            let task = document.getElementById(`task-select-${stepId}`).value;
            if (task === 'อื่นๆ') task = document.getElementById(`task-custom-${stepId}`).value;

            if (!task || task.trim() === '') {
                hasError = true;
                return; // หยุดการดึงของบล็อกนี้
            }

            // รวบรวม Hazards ที่ติ๊กเลือก
            let hazards = [];
            const hazardChecks = document.querySelectorAll(`.hazard-check-${stepId}:checked`);
            hazardChecks.forEach(chk => hazards.push(chk.value));
            const customHazard = document.getElementById(`hazard-custom-${stepId}`).value.trim();
            if (customHazard) hazards.push(customHazard);

            // รวบรวม Controls ที่ติ๊กเลือก
            let controls = [];
            const controlChecks = document.querySelectorAll(`.control-check-${stepId}:checked`);
            controlChecks.forEach(chk => controls.push(chk.value));
            const customControl = document.getElementById(`control-custom-${stepId}`).value.trim();
            if (customControl) controls.push(customControl);

            eJsaDataArray.push({
                step_no: parseInt(stepId),
                task_description: task,
                potential_hazards: hazards,
                preventive_controls: controls
            });
        });

        if (hasError || eJsaDataArray.length === 0) {
            Swal.fire('ข้อมูลไม่ครบถ้วน', 'กรุณาระบุขั้นตอนการทำงานให้ครบถ้วนก่อนบันทึกครับ', 'warning');
            return;
        }

        Swal.fire({ title: 'กำลังบันทึก E-JSA...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            // 1. ดึงข้อมูล specific_data เดิมมาก่อน เพื่อไม่ให้ข้อมูล PPE หรือรูปทับหายไป
            const { data: existingData, error: fetchErr } = await supabaseClient
                .from('tb_work_permits')
                .select('specific_data')
                .eq('ptw_id', currentPtwId)
                .single();
            
            if (fetchErr) throw fetchErr;

            // 2. ผสมข้อมูล ejsa_data เข้าไปใน specific_data เดิม
            let updatedSpecificData = existingData.specific_data || {};
            updatedSpecificData.ejsa_data = eJsaDataArray;

            // 3. อัปเดตกลับไปที่ฐานข้อมูล
            const { error: updateErr } = await supabaseClient
                .from('tb_work_permits')
                .update({ specific_data: updatedSpecificData })
                .eq('ptw_id', currentPtwId);

            if (updateErr) throw updateErr;

            Swal.fire({
                title: 'สำเร็จ!',
                text: 'บันทึกแผนประเมินความเสี่ยง E-JSA เรียบร้อย ข้อมูลถูกส่งให้ จป. อนุมัติแล้ว',
                icon: 'success',
                confirmButtonColor: '#2A4365',
                confirmButtonText: 'กลับสู่หน้าหลัก'
            }).then(() => {
                if (typeof liff !== 'undefined' && liff.isInClient()) { 
                    liff.closeWindow();
                } else { 
                    window.location.href = '../index.html'; 
                }
            });

        } catch (err) {
            console.error('Update E-JSA Error:', err);
            Swal.fire('บันทึกไม่สำเร็จ', 'เกิดข้อผิดพลาด: ' + err.message, 'error');
        }
    }
  </script>

  <style>
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>
</body>
</html>
