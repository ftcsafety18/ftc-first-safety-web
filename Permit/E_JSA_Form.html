                <!-- 2. เลือกระดับความเสี่ยง (Rank of Hazard Severity) -->
                <div class="border-t border-slate-100 pt-3">
                    <label class="mb-2 block text-xs font-bold text-slate-700">ระดับความรุนแรง (Severity Rank) <span class="text-red-500">*</span></label>
                    <div class="flex gap-2">
                        <label class="cursor-pointer flex-1">
                            <input type="radio" name="risk-${stepId}" value="A" class="peer hidden" onchange="updateRiskDesc(${stepId}, 'A')" />
                            <div class="h-10 rounded-lg flex items-center justify-center font-bold text-sm border-2 border-slate-200 text-slate-400 peer-checked:bg-riskA peer-checked:text-white peer-checked:border-riskA transition-colors">A</div>
                        </label>
                        <label class="cursor-pointer flex-1">
                            <input type="radio" name="risk-${stepId}" value="B" class="peer hidden" onchange="updateRiskDesc(${stepId}, 'B')" />
                            <div class="h-10 rounded-lg flex items-center justify-center font-bold text-sm border-2 border-slate-200 text-slate-400 peer-checked:bg-riskB peer-checked:text-white peer-checked:border-riskB transition-colors">B</div>
                        </label>
                        <label class="cursor-pointer flex-1">
                            <input type="radio" name="risk-${stepId}" value="C" class="peer hidden" onchange="updateRiskDesc(${stepId}, 'C')" />
                            <div class="h-10 rounded-lg flex items-center justify-center font-bold text-sm border-2 border-slate-200 text-slate-400 peer-checked:bg-riskC peer-checked:text-white peer-checked:border-riskC transition-colors">C</div>
                        </label>
                        <label class="cursor-pointer flex-1">
                            <input type="radio" name="risk-${stepId}" value="D" class="peer hidden" onchange="updateRiskDesc(${stepId}, 'D')" />
                            <div class="h-10 rounded-lg flex items-center justify-center font-bold text-sm border-2 border-slate-200 text-slate-400 peer-checked:bg-riskD peer-checked:text-white peer-checked:border-riskD transition-colors">D</div>
                        </label>
                    </div>
                    <p id="risk-desc-${stepId}" class="text-[10px] font-semibold text-slate-500 mt-1.5 bg-slate-50 p-2 rounded border border-slate-100">แตะเพื่อดูคำอธิบายระดับความเสี่ยง</p>
                </div>

                <!-- 3. อันตรายและมาตรการ -->
                <div class="border-t border-slate-100 pt-3">
                    <label class="mb-1.5 block text-xs font-bold text-red-600 flex items-center gap-1"><i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> อันตรายที่อาจเกิดขึ้น (Hazards)</label>
                    <div class="flex flex-wrap gap-1.5 mb-2">
                        ${generateHazardButtons()}
                    </div>
                    <div class="hazard-others-wrapper hidden flex-col gap-2 mt-2 border border-red-200 p-3 rounded-xl bg-red-50/50">
                        <select class="input-field appearance-none cursor-pointer pr-10 border-red-300 focus:border-red-600 text-red-700 text-xs font-semibold" onchange="handleHazardDropdown(this)">
                            <option value="" disabled selected>-- เลือกอันตรายเพิ่มเติม --</option>
                            <option value="ความร้อน/เย็นจัด">ความร้อน/เย็นจัด (Extreme Temperature)</option>
                            <option value="ท่าทางการทำงานที่ไม่เหมาะสม">ท่าทางการทำงานที่ไม่เหมาะสม (Ergonomics)</option>
                            <option value="แสงสว่างไม่เพียงพอ/จ้าเกินไป">แสงสว่างไม่เพียงพอ/จ้าเกินไป (Poor Lighting)</option>
                            <option value="สัตว์มีพิษ/แมลงกัดต่อย">สัตว์มีพิษ/แมลงกัดต่อย (Biological Hazards)</option>
                            <option value="อันตรายจากแรงดัน">อันตรายจากแรงดัน (Pressure Hazards)</option>
                            <option value="อันตรายจากการสั่นสะเทือน">อันตรายจากการสั่นสะเทือน (Vibration)</option>
                            <option value="custom" class="font-extrabold text-navy">✏️ พิมพ์ระบุอันตรายเอง...</option>
                        </select>
                        <input type="text" class="hazard-custom-text hidden input-field text-xs border-red-300 focus:border-red-600 text-red-700" placeholder="โปรดพิมพ์ระบุอันตราย..." />
                    </div>
                </div>

                <div class="border-t border-slate-100 pt-3 bg-emerald-50/30 -mx-4 px-4 pb-2">
                    <label class="mb-1.5 block text-xs font-bold text-emerald-600 flex items-center gap-1"><i data-lucide="shield-check" class="w-3.5 h-3.5"></i> มาตรการป้องกัน (Risk Controls)</label>
                    <div class="measures-container flex flex-wrap gap-1.5 mb-2"></div>
                    <div class="measure-others-wrapper hidden flex-col gap-2 mt-2 border border-emerald-200 p-3 rounded-xl bg-white">
                        <select class="input-field appearance-none cursor-pointer pr-10 border-emerald-300 focus:border-emerald-600 text-emerald-700 text-xs font-semibold" onchange="handleMeasureDropdown(this)">
                            <option value="" disabled selected>-- เลือกมาตรการเพิ่มเติม --</option>
                            <option value="จัดเตรียมน้ำดื่ม/เกลือแร่">จัดเตรียมน้ำดื่ม/เกลือแร่</option>
                            <option value="จัดเตรียมพื้นที่พักร่มรื่น">จัดเตรียมพื้นที่พักร่มรื่น</option>
                            <option value="จัดทำนั่งร้านที่ได้มาตรฐาน/จุดเกี่ยวสายรัด">จัดทำนั่งร้านที่ได้มาตรฐาน/จุดเกี่ยวสายรัด</option>
                            <option value="ติดตั้งไฟส่องสว่างชั่วคราว">ติดตั้งไฟส่องสว่างชั่วคราว</option>
                            <option value="ปิดคลุมวัสดุติดไฟ/ท่อระบายน้ำ">ปิดคลุมวัสดุติดไฟ/ท่อระบายน้ำทิ้ง</option>
                            <option value="ตรวจสอบพื้นที่ก่อนเริ่มงาน">ตรวจสอบพื้นที่ก่อนเริ่มงาน (ตรวจหาสัตว์มีพิษ)</option>
                            <option value="สับเปลี่ยนหมุนเวียนพนักงาน">สับเปลี่ยนหมุนเวียนพนักงาน (Job Rotation)</option>
                            <option value="custom" class="font-extrabold text-navy">✏️ พิมพ์ระบุมาตรการเอง...</option>
                        </select>
                        <input type="text" class="measure-custom-text hidden input-field text-xs border-emerald-300 focus:border-emerald-600 text-emerald-700" placeholder="โปรดพิมพ์ระบุมาตรการป้องกัน..." />
                    </div>
                </div>
            </div>
        </section>
        `;
        
        container.insertAdjacentHTML('beforeend', stepHTML);
        lucide.createIcons();
        updatePreventiveMeasures(container.lastElementChild);
    }

    // ---- Event Handlers ----
    function removeJsaStep(id) {
        document.querySelector(`.jsa-step[data-step="${id}"]`).remove();
        delete stepFiles[id];
        renumberSteps();
    }

    function renumberSteps() {
        const steps = document.querySelectorAll('.jsa-step');
        stepCount = steps.length;
        steps.forEach((step, index) => {
            const num = index + 1;
            step.dataset.step = num;
            step.querySelector('.step-number').textContent = num;
        });
    }

    function updateRiskDesc(stepId, val) {
        document.getElementById(`risk-desc-${stepId}`).textContent = RISK_DESC[val];
    }

    function handleStepSelection(selectElement) {
        const stepContainer = selectElement.closest('.jsa-step');
        const textInput = stepContainer.querySelector('.step-text');
        
        if (selectElement.value === 'custom') {
            textInput.classList.remove('hidden');
            textInput.focus();
        } else {
            textInput.classList.add('hidden');
        }

        const hazardChips = stepContainer.querySelectorAll('.chip-hazard');
        hazardChips.forEach(chip => chip.classList.remove('active'));

        const selectedStep = selectElement.value;
        if (STEP_HAZARD_MAP[selectedStep]) {
            const hazardsToActivate = STEP_HAZARD_MAP[selectedStep];
            hazardChips.forEach(chip => {
                if (hazardsToActivate.includes(chip.textContent)) {
                    chip.classList.add('active'); 
                }
            });
        }
        updatePreventiveMeasures(stepContainer);
    }

    function toggleHybridWrapper(buttonElement, wrapperClass) {
        buttonElement.classList.toggle('active');
        const stepContainer = buttonElement.closest('.jsa-step');
        const wrapper = stepContainer.querySelector(`.${wrapperClass}`);
        
        if (buttonElement.classList.contains('active')) {
            wrapper.classList.remove('hidden');
            wrapper.classList.add('flex');
        } else {
            wrapper.classList.add('hidden');
            wrapper.classList.remove('flex');
            wrapper.querySelector('select').value = '';
            wrapper.querySelector('input[type="text"]').value = '';
            wrapper.querySelector('input[type="text"]').classList.add('hidden');
            updatePreventiveMeasures(stepContainer);
        }
    }

    function handleHazardDropdown(selectElement) {
        const wrapper = selectElement.closest('div').parentElement;
        const textInput = wrapper.querySelector('.hazard-custom-text');
        if (selectElement.value === 'custom') {
            textInput.classList.remove('hidden');
            textInput.focus();
        } else {
            textInput.classList.add('hidden');
        }
        updatePreventiveMeasures(selectElement.closest('.jsa-step'));
    }

    function handleMeasureDropdown(selectElement) {
        const wrapper = selectElement.closest('div').parentElement;
        const textInput = wrapper.querySelector('.measure-custom-text');
        if (selectElement.value === 'custom') {
            textInput.classList.remove('hidden');
            textInput.focus();
        } else {
            textInput.classList.add('hidden');
        }
    }

    function toggleHazard(buttonElement) {
        buttonElement.classList.toggle('active');
        updatePreventiveMeasures(buttonElement.closest('.jsa-step'));
    }

    function generateHazardButtons() {
        let html = '';
        HAZARD_KEYS.forEach(hazard => {
            html += `<button type="button" class="chip chip-hazard" onclick="toggleHazard(this)">${hazard}</button>`;
        });
        html += `<button type="button" class="chip chip-hazard font-bold border-red-300 text-red-600" onclick="toggleHybridWrapper(this, 'hazard-others-wrapper')">➕ อื่นๆ</button>`;
        return html;
    }

    function updatePreventiveMeasures(stepContainer) {
        let activeHazards = Array.from(stepContainer.querySelectorAll('.chip-hazard.active'))
            .map(btn => btn.textContent)
            .filter(text => text !== '➕ อื่นๆ'); 
            
        const hazardDropdown = stepContainer.querySelector('.hazard-others-wrapper select');
        if (hazardDropdown && hazardDropdown.value && hazardDropdown.value !== 'custom') {
            activeHazards.push(hazardDropdown.value);
        }
            
        let recommendedMeasures = new Set([...DEFAULT_MEASURES]); 
        
        activeHazards.forEach(hazard => {
            if(HAZARD_MEASURE_MAP[hazard]) {
                HAZARD_MEASURE_MAP[hazard].forEach(measure => recommendedMeasures.add(measure));
            }
        });

        const measureContainer = stepContainer.querySelector('.measures-container');
        const currentlyActiveMeasures = Array.from(measureContainer.querySelectorAll('.chip-measure.active'))
            .map(btn => btn.textContent);

        let measuresHtml = '';
        recommendedMeasures.forEach(measure => {
            const isActive = currentlyActiveMeasures.includes(measure) ? 'active' : '';
            measuresHtml += `<button type="button" class="chip chip-measure ${isActive}" onclick="this.classList.toggle('active')">${measure}</button>`;
        });
        measuresHtml += `<button type="button" class="chip chip-measure font-bold border-emerald-300 text-emerald-600" onclick="toggleHybridWrapper(this, 'measure-others-wrapper')">➕ อื่นๆ</button>`;

        measureContainer.innerHTML = measuresHtml;
        
        const othersBtn = stepContainer.querySelector('.measure-others-wrapper').previousElementSibling; 
        const othersWrapper = stepContainer.querySelector('.measure-others-wrapper');
        if(!othersWrapper.classList.contains('hidden')){
             othersBtn.classList.add('active');
        }
    }

    // ---- 📸 จัดการรูปถ่ายและการบีบอัดภาพ ----
    async function handleStepPhoto(stepId, inputElement) {
        if (!inputElement.files || inputElement.files.length === 0) return;
        let file = inputElement.files[0];
        
        const statusText = document.getElementById(`photo-status-${stepId}`);
        statusText.textContent = "กำลังประมวลผล...";
        statusText.classList.remove('text-slate-400');
        statusText.classList.add('text-orange');

        try {
            if (file.type === 'image/heic' || file.name.toLowerCase().endsWith('.heic')) {
                if (typeof heic2any !== 'undefined') {
                    const convertedBlob = await heic2any({ blob: file, toType: 'image/jpeg' });
                    file = new File([Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob], file.name.replace(/\.heic$/i, ".jpg"), { type: 'image/jpeg' });
                }
            }

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    const maxWidth = 1000;
                    if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob(blob => {
                        const compressedFile = new File([blob], `step_${stepId}_${Date.now()}.jpg`, { type: 'image/jpeg' });
                        stepFiles[stepId] = compressedFile; 
                        
                        document.getElementById(`step-preview-${stepId}`).src = URL.createObjectURL(blob);
                        document.getElementById(`preview-container-${stepId}`).classList.remove('hidden');
                        
                        statusText.textContent = "รูปภาพพร้อมใช้งาน";
                        statusText.classList.replace('text-orange', 'text-emerald-600');
                    }, 'image/jpeg', 0.7); 
                };
            };
        } catch (err) {
            console.error('Photo processing error:', err);
            statusText.textContent = "เกิดข้อผิดพลาด";
            statusText.classList.replace('text-orange', 'text-red-500');
        }
    }

    function removeStepPhoto(stepId) {
        delete stepFiles[stepId];
        document.getElementById(`photo-${stepId}`).value = '';
        document.getElementById(`preview-container-${stepId}`).classList.add('hidden');
        
        const statusText = document.getElementById(`photo-status-${stepId}`);
        statusText.innerHTML = "ถ่ายรูปหน้างานหรือเครื่องมือ<br>ที่ใช้ในขั้นตอนนี้";
        statusText.classList.remove('text-emerald-600', 'text-red-500', 'text-orange');
        statusText.classList.add('text-slate-400');
    }

    // ==========================================
    // 🚀 ระบบบันทึกข้อมูล (ส่งเข้า Supabase)
    // ==========================================
    async function submitJsa() {
        if(!currentPtwId) {
            Swal.fire('ข้อผิดพลาด', 'ไม่พบรหัสใบงาน (PTW ID)', 'error');
            return;
        }

        let eJsaDataArray = [];
        let hasError = false;

        const stepBlocks = document.querySelectorAll('.jsa-step');
        for (let block of stepBlocks) {
            const stepId = block.dataset.step;
            
            // Validate Task
            let task = block.querySelector('select.input-field').value;
            if (task === 'custom') task = block.querySelector('.step-text').value;

            // Validate Risk Rank
            let riskInput = block.querySelector(`input[name="risk-${stepId}"]:checked`);
            let riskVal = riskInput ? riskInput.value : null;

            if (!task || task.trim() === '' || !riskVal) {
                hasError = true;
                break;
            }

            // Hazards
            let hazards = [];
            block.querySelectorAll(`.chip-hazard.active`).forEach(chk => { if(chk.textContent !== '➕ อื่นๆ') hazards.push(chk.textContent); });
            const hazardDropdown = block.querySelector('.hazard-others-wrapper select').value;
            const hazardCustom = block.querySelector('.hazard-custom-text').value;
            if (hazardDropdown && hazardDropdown !== 'custom') hazards.push(hazardDropdown);
            if (hazardDropdown === 'custom' && hazardCustom) hazards.push(hazardCustom);

            // Controls
            let controls = [];
            block.querySelectorAll(`.chip-measure.active`).forEach(chk => { if(chk.textContent !== '➕ อื่นๆ') controls.push(chk.textContent); });
            const measureDropdown = block.querySelector('.measure-others-wrapper select').value;
            const measureCustom = block.querySelector('.measure-custom-text').value;
            if (measureDropdown && measureDropdown !== 'custom') controls.push(measureDropdown);
            if (measureDropdown === 'custom' && measureCustom) controls.push(measureCustom);

            if (hazards.length === 0 || controls.length === 0) {
                hasError = true;
                break;
            }

            eJsaDataArray.push({
                step_no: parseInt(stepId),
                step_name: task,
                risk_level: riskVal,
                hazards: hazards,
                measures: controls,
                step_photo_url: null 
            });
        }

        if (hasError || eJsaDataArray.length === 0) {
            Swal.fire('ข้อมูลไม่ครบถ้วน', 'กรุณาระบุขั้นตอนการทำงาน ประเมินความเสี่ยง(A-D) อันตราย และมาตรการป้องกันให้ครบทุกส่วนครับ', 'warning');
            return;
        }

        Swal.fire({ title: 'กำลังบันทึก E-JSA และอัปโหลดรูป...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            if (!supabaseClient) throw new Error("ไม่สามารถเชื่อมต่อฐานข้อมูลได้");

            // 1. อัปโหลดรูปภาพ
            for (let data of eJsaDataArray) {
                const file = stepFiles[data.step_no];
                if (file) {
                    const filePath = `jsa-steps-docs/${currentPtwId}_step${data.step_no}_${Date.now()}.jpg`;
                    const { error: uploadError } = await supabaseClient.storage.from('safety-documents').upload(filePath, file);
                    if (uploadError) throw uploadError;
                    data.step_photo_url = supabaseClient.storage.from('safety-documents').getPublicUrl(filePath).data.publicUrl;
                }
            }

            // 2. ดึง specific_data เดิม
            const { data: permitData, error: fetchErr } = await supabaseClient
                .from('tb_work_permits')
                .select('specific_data')
                .eq('ptw_id', currentPtwId)
                .single();
            
            if (fetchErr) throw fetchErr;

            // 3. ผสมข้อมูล
            let specificData = permitData.specific_data || {};
            specificData.ejsa_data = eJsaDataArray; 

            // 4. อัปเดตกลับขึ้นคลาวด์
            const { error: updateError } = await supabaseClient
                .from('tb_work_permits')
                .update({ specific_data: specificData })
                .eq('ptw_id', currentPtwId);

            if (updateError) throw updateError;

            Swal.fire({
                title: 'บันทึก E-JSA สำเร็จ!',
                text: 'ข้อมูล JSA แบบภาพถ่าย ถูกส่งไปให้ จป. ตรวจสอบแล้วครับ',
                icon: 'success',
                confirmButtonColor: '#2A4365',
                confirmButtonText: 'ปิดหน้าต่าง'
            }).then(() => {
                if (typeof liff !== 'undefined' && liff.isInClient()) {
                    liff.closeWindow();
                } else {
                    window.location.href = '../index.html'; 
                }
            });

        } catch (error) {
            console.error('Save E-JSA Error:', error);
            Swal.fire('บันทึกไม่สำเร็จ', 'เกิดข้อผิดพลาด: ' + error.message, 'error');
        }
    }
  </script>
