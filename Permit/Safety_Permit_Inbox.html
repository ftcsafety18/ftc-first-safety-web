<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>อนุมัติใบอนุญาตทำงาน | FTC First Safety</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Sarabun font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- LIFF, Supabase, SweetAlert2 -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Sarabun", "ui-sans-serif", "system-ui", "sans-serif"] },
          colors: {
            background: "#f4f7f9", foreground: "#1a2733", card: "#ffffff",
            primary: "#2a4365", "primary-foreground": "#ffffff",
            secondary: "#eef2f6", muted: "#eef2f6", "muted-foreground": "#64748b",
            accent: "#db5a24", border: "#e2e8f0", success: "#16a34a", danger: "#dc2626",
          },
        },
      },
    };
  </script>

  <style>
    body { font-family: "Sarabun", ui-sans-serif, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .loader-spin { border: 3px solid #f3f3f3; border-top: 3px solid #2a4365; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>

<body class="bg-background text-foreground antialiased">
  <main class="min-h-dvh bg-background pb-10">
    <!-- Header -->
    <header class="sticky top-0 z-30 bg-primary text-primary-foreground shadow-md">
      <div class="mx-auto flex max-w-2xl items-center gap-3 px-4 py-3">
        <button type="button" onclick="window.history.back()" aria-label="ย้อนกลับ" class="-ml-1 flex size-9 shrink-0 items-center justify-center rounded-full transition-colors hover:bg-white/10 active:bg-white/20">
          <i data-lucide="chevron-left" class="size-6"></i>
        </button>

        <div class="min-w-0 flex-1">
          <h1 class="truncate text-lg font-bold leading-tight">อนุมัติใบอนุญาตทำงาน</h1>
          <p class="truncate text-[11px] font-medium tracking-widest text-primary-foreground/70 uppercase">PTW Approval Inbox</p>
        </div>

        <span class="inline-flex shrink-0 items-center gap-1.5 rounded-full bg-white/15 px-3 py-1.5 text-xs font-bold ring-1 ring-inset ring-white/30 shadow-sm">
          <i data-lucide="shield-check" class="size-3.5 text-accent"></i> จป. วิชาชีพ
        </span>
      </div>
    </header>

    <!-- Tab Bar -->
    <div class="sticky top-[60px] z-20 bg-background/95 px-4 pb-2 pt-3 backdrop-blur shadow-sm">
      <div role="tablist" class="mx-auto flex max-w-2xl gap-1 rounded-xl bg-secondary p-1">
        <!-- Pending (active) -->
        <button role="tab" data-tab="pending" class="tab-btn flex flex-1 items-center justify-center gap-1.5 rounded-lg px-2 py-2 text-xs font-bold transition-all bg-card text-primary shadow-sm border border-border/50">
          <span class="truncate">รอรับรอง</span>
          <span id="count-pending" class="flex min-w-5 items-center justify-center rounded-full px-1.5 py-0.5 text-[10px] font-semibold leading-none bg-primary text-primary-foreground">0</span>
        </button>
        <!-- Endorsed (approved by JPO, waiting for Eng) -->
        <button role="tab" data-tab="endorsed" class="tab-btn flex flex-1 items-center justify-center gap-1.5 rounded-lg px-2 py-2 text-xs font-bold transition-all text-muted-foreground hover:text-foreground">
          <span class="truncate">รับรองแล้ว</span>
          <span id="count-endorsed" class="flex min-w-5 items-center justify-center rounded-full px-1.5 py-0.5 text-[10px] font-semibold leading-none bg-muted-foreground/15 text-muted-foreground">0</span>
        </button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="mx-auto max-w-2xl px-4 pt-3">
      <!-- Loading Indicator -->
      <div id="loading-indicator" class="py-10 text-center">
        <div class="loader-spin mb-3"></div>
        <p class="text-sm text-muted-foreground font-medium">กำลังโหลดข้อมูลใบงาน...</p>
      </div>

      <!-- Pending panel -->
      <div id="panel-pending" class="space-y-3.5 hidden">
        <!-- Cards will be injected here by JS -->
      </div>

      <!-- Endorsed panel -->
      <div id="panel-endorsed" class="space-y-3.5 hidden">
         <!-- Cards will be injected here by JS -->
      </div>
      
      <!-- Empty State -->
      <div id="empty-state" class="hidden flex-col items-center justify-center gap-3 py-20 text-center">
        <div class="flex size-16 items-center justify-center rounded-full bg-secondary/50 border border-border text-muted-foreground shadow-inner">
          <i data-lucide="inbox" class="size-8 opacity-50"></i>
        </div>
        <p class="text-sm font-semibold text-muted-foreground">ไม่พบรายการใบอนุญาตในสถานะนี้</p>
      </div>
    </div>
  </main>

  <script>
    // ---- Supabase Initialization ----
    const SUPABASE_URL = 'https://ancwqgaaqliandzdzphg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_IVdSBILj_etRSNF48ig1PA_sBAt23NG';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let currentTab = 'pending';
    let allPermits = [];

    // ---- DOM Elements ----
    const tabButtons = document.querySelectorAll(".tab-btn");
    const panelPending = document.getElementById("panel-pending");
    const panelEndorsed = document.getElementById("panel-endorsed");
    const emptyState = document.getElementById("empty-state");
    const loadingIndicator = document.getElementById("loading-indicator");

    document.addEventListener('DOMContentLoaded', async () => {
        lucide.createIcons();
        setupTabs();
        await fetchPermits();
    });

    // ---- Fetch Data ----
    async function fetchPermits() {
        if (!supabaseClient) { 
            Swal.fire('Error', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error'); 
            return; 
        }

        loadingIndicator.classList.remove('hidden');
        panelPending.classList.add('hidden');
        panelEndorsed.classList.add('hidden');
        emptyState.classList.add('hidden');

        try {
            // ดึงข้อมูลจาก tb_work_permits (สกีมาจริง)
            const { data, error } = await supabaseClient
                .from('tb_work_permits')
                .select('*')
                .in('status', ['Pending', 'Endorsed'])
                .order('created_at', { ascending: false });

            if (error) throw error;
            allPermits = data || [];
            renderCards();

        } catch (error) {
            console.error('Fetch error:', error);
            Swal.fire('ข้อผิดพลาด', 'ไม่สามารถดึงข้อมูลได้: ' + error.message, 'error');
        } finally {
            loadingIndicator.classList.add('hidden');
        }
    }

    // ---- Render Cards ----
    function renderCards() {
        const pendingPermits = allPermits.filter(p => p.status === 'Pending');
        const endorsedPermits = allPermits.filter(p => p.status === 'Endorsed');

        document.getElementById('count-pending').textContent = pendingPermits.length;
        document.getElementById('count-endorsed').textContent = endorsedPermits.length;

        panelPending.innerHTML = pendingPermits.map(p => createCardHTML(p)).join('');
        panelEndorsed.innerHTML = endorsedPermits.map(p => createCardHTML(p)).join('');

        lucide.createIcons();
        showCurrentPanel();
    }

    function createCardHTML(permit) {
        const sTime = new Date(permit.start_time);
        const eTime = new Date(permit.end_time);
        const dateStr = sTime.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
        const timeStr = `${sTime.getHours().toString().padStart(2,'0')}:${sTime.getMinutes().toString().padStart(2,'0')} - ${eTime.getHours().toString().padStart(2,'0')}:${eTime.getMinutes().toString().padStart(2,'0')}`;

        const workTypesStr = permit.ptw_type || '';
        const isGeneralOnly = workTypesStr.includes('งานทั่วไป');
        const isHighRisk = !isGeneralOnly;
        
        // เข้าถึงข้อมูลที่ซ่อนใน specific_data
        const specificData = permit.specific_data || {};
        const hasJsa = !!specificData.jsa_file_url;
        const projectId = specificData.project_id || '-';
        const locationZone = permit.work_description || '-';
        
        let tagHtml = '';
        if (isGeneralOnly) {
            tagHtml = `<span class="rounded-md border px-2 py-1 text-xs font-semibold border-teal-500/30 bg-teal-500/5 text-teal-600">งานทั่วไป (General Work)</span>`;
        } else {
            const typesArray = workTypesStr.split(',').map(t => t.trim()).filter(t => t);
            tagHtml = typesArray.map(w => `<span class="rounded-md border px-2 py-1 text-[10px] sm:text-xs font-semibold border-danger/30 bg-danger/5 text-danger">${w}</span>`).join('');
        }

        const urgentBadge = isHighRisk && permit.status === 'Pending' ? `
            <span class="inline-flex items-center gap-1.5 rounded-full bg-danger px-2.5 py-1 text-[10px] font-bold text-white shadow-sm">
              <span class="relative flex size-1.5"><span class="absolute inline-flex size-full animate-ping rounded-full bg-white opacity-75"></span><span class="relative inline-flex size-1.5 rounded-full bg-white"></span></span>
              ด่วน (High Risk)
            </span>` : `<span class="rounded-full bg-secondary border border-border px-2.5 py-1 text-[10px] font-bold text-muted-foreground">${permit.status}</span>`;

        const actionButtons = permit.status === 'Pending' ? `
            <div class="grid grid-cols-2 gap-2 border-t border-border/70 bg-secondary/30 px-4 py-3">
              <button onclick="viewDetails('${permit.ptw_id}')" class="inline-flex items-center justify-center gap-1.5 rounded-lg border-2 border-primary/20 bg-white px-3 py-2.5 text-sm font-bold text-primary transition-colors hover:bg-primary/5 active:scale-95 shadow-sm">
                <i data-lucide="eye" class="size-4"></i> ข้อมูล & JSA
              </button>
              <button onclick="endorsePermit('${permit.ptw_id}')" class="inline-flex items-center justify-center gap-1.5 rounded-lg bg-success px-3 py-2.5 text-sm font-bold text-white shadow-md shadow-success/20 transition-colors hover:bg-success/90 active:scale-95">
                <i data-lucide="check-circle-2" class="size-4"></i> รับรอง (Endorse)
              </button>
            </div>` : `
            <div class="border-t border-border/70 bg-success/5 px-4 py-3 text-center">
                <span class="text-sm font-bold text-success flex items-center justify-center gap-2"><i data-lucide="shield-check" class="size-5"></i> จป. รับรองความปลอดภัยแล้ว</span>
            </div>`;

        return `
        <article class="overflow-hidden rounded-2xl border border-border bg-card shadow-sm transition-shadow hover:shadow-md mb-3.5">
          <div class="flex items-center justify-between gap-2 border-b border-border/70 bg-slate-50/50 px-4 py-3">
            <span class="font-mono text-[13px] font-bold tracking-tight text-primary">${permit.ptw_id}</span>
            ${urgentBadge}
          </div>

          <div class="space-y-3 px-4 py-4">
            <div class="flex flex-wrap gap-1.5 mb-1">${tagHtml}</div>

            <dl class="space-y-2.5 text-sm">
              <div class="flex items-start gap-3">
                <span class="mt-0.5 shrink-0 text-slate-400"><i data-lucide="user" class="size-4"></i></span>
                <div class="min-w-0 flex-1 leading-snug">
                  <span class="font-bold text-foreground">รอเชื่อมชื่อพนักงานจาก LINE</span>
                </div>
              </div>
              <div class="flex items-start gap-3">
                <span class="mt-0.5 shrink-0 text-slate-400"><i data-lucide="map-pin" class="size-4"></i></span>
                <div class="min-w-0 flex-1 leading-snug"><span class="font-semibold text-slate-700">${projectId} — ${locationZone}</span></div>
              </div>
              <div class="flex items-start gap-3">
                <span class="mt-0.5 shrink-0 text-slate-400"><i data-lucide="calendar-clock" class="size-4"></i></span>
                <div class="min-w-0 flex-1 leading-snug">
                  <span class="font-semibold text-slate-700">${dateStr}</span> <span class="text-muted-foreground font-medium ml-1">(${timeStr})</span>
                </div>
              </div>
              <div class="flex items-start gap-3 pt-1">
                <span class="mt-0.5 shrink-0 ${hasJsa ? 'text-success' : 'text-slate-400'}"><i data-lucide="${hasJsa ? 'image' : 'file-x-2'}" class="size-4"></i></span>
                <div class="min-w-0 flex-1 leading-snug">
                    <span class="font-bold ${hasJsa ? 'text-success' : 'text-slate-500'}">${hasJsa ? 'แนบรูป JSA แล้ว' : 'ไม่มีเอกสาร JSA'}</span>
                </div>
              </div>
            </dl>
          </div>
          ${actionButtons}
        </article>`;
    }

    // ---- Actions ----
    function viewDetails(ptwId) {
        const permit = allPermits.find(p => p.ptw_id === ptwId);
        if(!permit) return;

        const specificData = permit.specific_data || {};
        const ppeArray = Array.isArray(specificData.ppe_required) ? specificData.ppe_required : [];
        const ppeHtml = ppeArray.map(item => `<span class="inline-block bg-slate-100 border border-slate-200 rounded px-2 py-1 text-xs font-semibold text-slate-600 m-1">${item}</span>`).join('');
        
        let jsaHtml = '';
        if(specificData.jsa_file_url) {
            jsaHtml = `<div class="mt-4"><p class="text-sm font-bold text-left mb-2 text-primary">รูปถ่าย JSA:</p><img src="${specificData.jsa_file_url}" class="w-full rounded-lg border border-slate-200 shadow-sm" style="max-height: 300px; object-fit: contain;"></div>`;
        }

        Swal.fire({
            title: '<span class="text-lg font-bold text-primary">รายละเอียดความปลอดภัย</span>',
            html: `
                <div class="text-left mt-2 border-t border-slate-100 pt-3">
                    <p class="text-sm font-bold text-slate-700 mb-1">อุปกรณ์ PPE ที่ต้องใช้:</p>
                    <div class="mb-3">${ppeHtml || '<span class="text-xs text-slate-400">ไม่มีข้อมูล</span>'}</div>
                    <p class="text-sm font-bold text-danger mb-1 flex items-center gap-1"><i data-lucide="shield-alert" class="w-4 h-4"></i> การตรวจสอบสภาพ:</p>
                    <p class="text-xs text-slate-600 bg-red-50 p-2 rounded border border-red-100">${specificData.declaration_checked ? 'ยืนยันการเตรียมถังดับเพลิงและ TBT แล้ว' : 'ไม่ได้ยืนยัน'}</p>
                    ${jsaHtml}
                </div>
            `,
            confirmButtonText: 'ปิด',
            confirmButtonColor: '#2A4365',
            didOpen: () => { lucide.createIcons(); }
        });
    }

    async function endorsePermit(ptwId) {
        Swal.fire({
            title: 'ยืนยันการรับรอง?',
            text: "คุณได้ตรวจสอบ JSA และ PPE เรียบร้อยแล้วใช่หรือไม่?",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#16a34a',
            cancelButtonColor: '#64748b',
            confirmButtonText: 'ใช่, รับรองความปลอดภัย',
            cancelButtonText: 'ยกเลิก'
        }).then(async (result) => {
            if (result.isConfirmed) {
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                try {
                    // อัปเดตสถานะในตาราง tb_work_permits
                    const { error } = await supabaseClient
                        .from('tb_work_permits')
                        .update({ status: 'Endorsed' })
                        .eq('ptw_id', ptwId);
                    if (error) throw error;
                    
                    Swal.fire('รับรองสำเร็จ!', 'ส่งต่อให้วิศวกรอนุมัติขั้นตอนสุดท้ายแล้ว', 'success');
                    await fetchPermits(); // โหลดข้อมูลใหม่
                } catch (error) {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                }
            }
        });
    }

    // ---- Tabs Logic ----
    function setupTabs() {
        tabButtons.forEach((btn) => {
            btn.addEventListener("click", () => {
                currentTab = btn.dataset.tab;
                
                tabButtons.forEach((b) => {
                    const isActive = b === btn;
                    const count = b.querySelector("span[id^='count-']");
                    b.setAttribute("aria-selected", isActive ? "true" : "false");

                    if (isActive) {
                        b.classList.add("bg-card", "text-primary", "shadow-sm", "border-border/50");
                        b.classList.remove("text-muted-foreground", "hover:text-foreground", "border-transparent");
                        count.classList.add("bg-primary", "text-primary-foreground");
                        count.classList.remove("bg-muted-foreground/15", "text-muted-foreground");
                    } else {
                        b.classList.remove("bg-card", "text-primary", "shadow-sm", "border-border/50");
                        b.classList.add("text-muted-foreground", "hover:text-foreground", "border-transparent");
                        count.classList.remove("bg-primary", "text-primary-foreground");
                        count.classList.add("bg-muted-foreground/15", "text-muted-foreground");
                    }
                });
                showCurrentPanel();
            });
        });
    }

    function showCurrentPanel() {
        if(allPermits.length === 0) return;
        
        const count = currentTab === 'pending' ? parseInt(document.getElementById('count-pending').textContent) : parseInt(document.getElementById('count-endorsed').textContent);

        panelPending.classList.add('hidden');
        panelEndorsed.classList.add('hidden');
        emptyState.classList.add('hidden');

        if (count === 0) {
            emptyState.classList.remove('hidden');
            emptyState.classList.add('flex');
        } else {
            if (currentTab === 'pending') panelPending.classList.remove('hidden');
            if (currentTab === 'endorsed') panelEndorsed.classList.remove('hidden');
        }
    }
  </script>
</body>
</html>
