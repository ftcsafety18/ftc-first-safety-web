<!DOCTYPE html>
<html lang="th" class="bg-[#F4F7F9]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2A4365" />
  <title>FTC First Safety — Vendor Admin Portal</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Sarabun font (เปลี่ยนมาใช้ Sarabun เพื่อให้เหมือนหน้าอื่นๆ) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Sarabun', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            background: "#F4F7F9",
            foreground: "#1A365D", // Navy Dark
            card: "#ffffff",
            "card-foreground": "#1A365D",
            muted: "#eef2f6",
            "muted-foreground": "#64748b",
            border: "#e2e8f0",
            destructive: "#dc2626",
            info: "#3182CE", // Navy Light
            success: "#16a34a",
            warning: "#d97706",
            "brand-navy": "#2A4365",
            "brand-navy-fg": "#ffffff",
            "brand-orange": "#DB5A24",
            "brand-orange-fg": "#ffffff",
          },
        },
      },
    };
  </script>

  <style>
    body { font-family: "Sarabun", ui-sans-serif, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>

<body class="bg-background text-foreground antialiased">
  <div class="relative mx-auto min-h-screen max-w-md bg-background pb-28">

    <!-- ============ HEADER ============ -->
    <header class="relative overflow-hidden bg-brand-navy px-5 pb-8 pt-8 text-brand-navy-fg rounded-b-[2rem] shadow-md z-10">
      <div aria-hidden="true"
        class="pointer-events-none absolute -right-16 -top-20 h-56 w-56 rounded-full bg-brand-orange/20 blur-3xl"></div>

      <!-- ปุ่มกลับหน้าหลัก (Back Button) -->
      <button onclick="window.history.back()" class="absolute top-6 right-5 flex h-8 w-8 items-center justify-center rounded-full bg-white/10 ring-1 ring-white/20 transition-colors hover:bg-white/20">
        <i data-lucide="x" class="h-4 w-4 text-white"></i>
      </button>

      <div class="relative flex items-start justify-between gap-3 pr-10">
        <div class="flex items-center gap-3">
          <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-white/10 ring-1 ring-white/20 shadow-inner">
            <i data-lucide="shield-check" class="h-6 w-6 text-brand-orange"></i>
          </div>
          <div class="leading-tight">
            <h1 class="text-xl font-bold tracking-wide">ศูนย์บริหารงานผู้รับเหมา</h1>
            <p class="mt-0.5 text-[11px] font-medium text-white/70 uppercase tracking-widest">Vendor Admin Portal</p>
          </div>
        </div>
      </div>

      <!-- company context -->
      <div class="relative mt-6 flex w-full items-center gap-3 rounded-xl bg-white/10 px-4 py-3 text-left ring-1 ring-white/20 shadow-sm backdrop-blur-sm">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-black/20">
          <i data-lucide="building-2" class="h-5 w-5 text-white/90"></i>
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-[10px] font-bold uppercase tracking-widest text-brand-orange">บริษัทต้นสังกัด (VENDOR)</p>
          <p id="vendor-name" class="truncate text-[15px] font-bold mt-0.5">กำลังโหลดข้อมูล...</p>
        </div>
      </div>
    </header>

    <!-- ============ QUICK STATS ============ -->
    <section aria-label="สรุปภาพรวม" class="-mt-6 px-5 relative z-20">
      <div class="grid grid-cols-3 gap-3">
        <div class="flex flex-col items-center rounded-2xl bg-white p-3 shadow-md border border-slate-200">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-info/10">
            <i data-lucide="clipboard-list" class="h-5 w-5 text-info"></i>
          </div>
          <p class="mt-2 text-2xl font-bold leading-none text-foreground">3</p>
          <p class="mt-1 text-[10px] font-semibold text-slate-500 text-center">งานรอ<br>ดำเนินการ</p>
        </div>

        <div class="flex flex-col items-center rounded-2xl bg-white p-3 shadow-md border border-slate-200">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-destructive/10">
            <i data-lucide="alert-triangle" class="h-5 w-5 text-destructive"></i>
          </div>
          <p class="mt-2 text-2xl font-bold leading-none text-destructive">1</p>
          <p class="mt-1 text-[10px] font-semibold text-slate-500 text-center">ใบสั่งแก้ไข<br>(Defect)</p>
        </div>

        <div class="flex flex-col items-center rounded-2xl bg-white p-3 shadow-md border border-slate-200">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-success/10">
            <i data-lucide="users" class="h-5 w-5 text-success"></i>
          </div>
          <p class="mt-2 text-2xl font-bold leading-none text-foreground">15</p>
          <p class="mt-1 text-[10px] font-semibold text-slate-500 text-center">กำลังคน<br>วันนี้</p>
        </div>
      </div>
    </section>

    <!-- ============ TASK SECTIONS ============ -->
    <div class="space-y-6 px-5 pt-8">

      <!-- Module: งานที่ต้องดำเนินการ -->
      <section aria-label="งานที่ต้องดำเนินการ">
        <div class="flex items-center gap-2 mb-3 border-l-4 border-brand-orange pl-3">
          <h2 class="text-[15px] font-bold text-foreground">งานที่ต้องดำเนินการ (My Tasks)</h2>
        </div>
        <ul class="space-y-3">
          <li>
            <button type="button" onclick="showComingSoon()"
              class="group flex w-full items-center gap-4 rounded-2xl bg-white p-4 text-left shadow-md border border-slate-200 transition-all duration-200 hover:-translate-y-1 hover:border-info/40 hover:shadow-lg active:translate-y-0 active:scale-[0.98]">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-slate-50 border border-slate-100 group-hover:bg-info/10 group-hover:border-info/20 transition-colors">
                <i data-lucide="user-check" class="h-6 w-6 text-brand-navy group-hover:text-info transition-colors"></i>
              </div>
              <div class="min-w-0 flex-1">
                <p class="truncate text-[14px] font-bold text-foreground">ยืนยันทะเบียนพนักงาน</p>
                <p class="truncate text-[11px] font-medium text-slate-400 mt-0.5">Worker Verification</p>
              </div>
              <span class="shrink-0 rounded-full px-2.5 py-1 text-[10px] font-bold bg-info/10 text-info ring-1 ring-info/20 shadow-sm">2 รายการ</span>
            </button>
          </li>
          <li>
            <!-- ปุ่มเชื่อมไปหน้า E-Permit Request -->
            <button type="button" onclick="openModule('Permit_Request.html')"
              class="group flex w-full items-center gap-4 rounded-2xl bg-white p-4 text-left shadow-md border border-slate-200 transition-all duration-200 hover:-translate-y-1 hover:border-info/40 hover:shadow-lg active:translate-y-0 active:scale-[0.98]">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-slate-50 border border-slate-100 group-hover:bg-info/10 group-hover:border-info/20 transition-colors">
                <i data-lucide="file-signature" class="h-6 w-6 text-brand-navy group-hover:text-info transition-colors"></i>
              </div>
              <div class="min-w-0 flex-1">
                <p class="truncate text-[14px] font-bold text-foreground">จัดการคำขอใบอนุญาตทำงาน</p>
                <p class="truncate text-[11px] font-medium text-slate-400 mt-0.5">PTW Request Management</p>
              </div>
              <span class="shrink-0 rounded-full px-2.5 py-1 text-[10px] font-bold bg-info/10 text-info ring-1 ring-info/20 shadow-sm">1 รายการ</span>
            </button>
          </li>
        </ul>
      </section>

      <!-- Module: งานที่ถูกสั่งแก้ไข -->
      <section aria-label="งานที่ถูกสั่งแก้ไข">
        <div class="flex items-center justify-between mb-3 border-l-4 border-destructive pl-3">
          <h2 class="text-[15px] font-bold text-foreground">งานที่ถูกสั่งแก้ไข</h2>
          <span class="text-[10px] font-bold text-destructive animate-pulse">ACTION REQUIRED</span>
        </div>
        <ul class="space-y-3">
          <li>
            <button type="button" onclick="showComingSoon()"
              class="group flex w-full items-center gap-4 rounded-2xl bg-white p-4 text-left shadow-md border border-destructive/30 transition-all duration-200 hover:-translate-y-1 hover:border-destructive/60 hover:shadow-lg hover:shadow-destructive/10 active:translate-y-0 active:scale-[0.98]">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-destructive/10 border border-destructive/20 group-hover:bg-destructive group-hover:text-white transition-colors">
                <i data-lucide="shield-alert" class="h-6 w-6 text-destructive group-hover:text-white transition-colors"></i>
              </div>
              <div class="min-w-0 flex-1">
                <p class="truncate text-[14px] font-bold text-foreground">ตรวจสอบและส่งผลการแก้ไข</p>
                <p class="truncate text-[11px] font-medium text-slate-400 mt-0.5">Safety Defect & Warning</p>
              </div>
              <span class="shrink-0 rounded-full px-3 py-1 text-[10px] font-bold bg-destructive text-white shadow-sm shadow-destructive/40">ด่วนมาก</span>
            </button>
          </li>
        </ul>
      </section>

      <!-- Module: สรุปผลและส่งมอบงาน -->
      <section aria-label="สรุปผลและส่งมอบงาน">
        <div class="flex items-center gap-2 mb-3 border-l-4 border-success pl-3">
          <h2 class="text-[15px] font-bold text-foreground">สรุปผลและส่งมอบงาน</h2>
        </div>
        <ul class="space-y-3">
          <li>
            <button type="button" onclick="showComingSoon()"
              class="group flex w-full items-center gap-4 rounded-2xl bg-white p-4 text-left shadow-md border border-slate-200 transition-all duration-200 hover:-translate-y-1 hover:border-success/40 hover:shadow-lg active:translate-y-0 active:scale-[0.98]">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-slate-50 border border-slate-100 group-hover:bg-success/10 group-hover:border-success/20 transition-colors">
                <i data-lucide="trending-up" class="h-6 w-6 text-brand-navy group-hover:text-success transition-colors"></i>
              </div>
              <div class="min-w-0 flex-1">
                <p class="truncate text-[14px] font-bold text-foreground">อัปเดตความก้าวหน้าโครงการ</p>
                <p class="truncate text-[11px] font-medium text-slate-400 mt-0.5">Progress & POC Update</p>
              </div>
              <i data-lucide="chevron-right" class="h-5 w-5 shrink-0 text-slate-300 transition-transform group-hover:translate-x-1 group-hover:text-success"></i>
            </button>
          </li>
        </ul>
      </section>

    </div>

    <!-- ============ BOTTOM NAV ============ -->
    <nav aria-label="เมนูหลัก" class="fixed inset-x-0 bottom-0 z-40 mx-auto max-w-md border-t border-slate-200 bg-white/95 backdrop-blur-md shadow-[0_-4px_20px_rgba(0,0,0,0.05)] rounded-t-3xl">
      <div class="relative flex h-[72px] items-center justify-around px-2">

        <button type="button" onclick="window.history.back()"
          class="relative flex w-16 flex-col items-center gap-1.5 py-2 text-brand-orange transition-colors">
          <span class="relative"><i data-lucide="layout-grid" class="h-6 w-6"></i></span>
          <span class="text-[10px] font-bold">เมนูหลัก</span>
        </button>

        <button type="button" onclick="showComingSoon()"
          class="relative flex w-16 flex-col items-center gap-1.5 py-2 text-slate-400 hover:text-brand-navy transition-colors">
          <span class="relative">
            <i data-lucide="bell" class="h-6 w-6"></i>
            <span class="absolute -right-1 -top-0.5 h-2.5 w-2.5 rounded-full bg-destructive ring-2 ring-white"></span>
          </span>
          <span class="text-[10px] font-bold">แจ้งเตือน</span>
        </button>

        <!-- Center FAB — Scan -->
        <div class="flex w-20 justify-center">
          <button type="button" aria-label="สแกน" onclick="showComingSoon()"
            class="absolute -top-6 flex h-16 w-16 flex-col items-center justify-center rounded-full bg-brand-orange text-white shadow-lg shadow-brand-orange/40 ring-4 ring-white transition-transform active:scale-95 hover:bg-orange-600">
            <i data-lucide="qr-code" class="h-7 w-7"></i>
          </button>
        </div>

        <button type="button" onclick="showComingSoon()"
          class="relative flex w-16 flex-col items-center gap-1.5 py-2 text-slate-400 hover:text-brand-navy transition-colors">
          <span class="relative"><i data-lucide="file-text" class="h-6 w-6"></i></span>
          <span class="text-[10px] font-bold">เอกสาร</span>
        </button>

        <button type="button" onclick="showComingSoon()"
          class="relative flex w-16 flex-col items-center gap-1.5 py-2 text-slate-400 hover:text-brand-navy transition-colors">
          <span class="relative"><i data-lucide="user-round" class="h-6 w-6"></i></span>
          <span class="text-[10px] font-bold">โปรไฟล์</span>
        </button>

      </div>
    </nav>

  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Mockup Data (สามารถนำไปผูกกับ Database จริงได้)
    document.addEventListener('DOMContentLoaded', function() {
        // จำลองการดึงชื่อบริษัท
        setTimeout(() => {
            document.getElementById('vendor-name').innerText = "บจก. พัฒนเวช การช่าง";
        }, 500);
    });

    // LIFF Functions
    var LIFF_ID = '2010907761-KrJ8PgNN';

    if (typeof liff !== 'undefined') {
        liff.init({ liffId: LIFF_ID }).catch(function(err) {
            console.error('LIFF Error:', err);
        });
    }

    function openModule(targetUrl) {
        var targetFullUrl;
        try { targetFullUrl = new URL(targetUrl, window.location.href).href; } 
        catch (error) { targetFullUrl = targetUrl; }

        if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient() === true) {
            liff.openWindow({ url: targetFullUrl, external: true });
        } else { window.location.href = targetFullUrl; }
    }

    function showComingSoon() {
        alert('ฟังก์ชันนี้กำลังเชื่อมต่อกับระบบฐานข้อมูล จะเปิดให้ใช้งานเร็วๆ นี้ครับ');
    }
  </script>
</body>
</html>
