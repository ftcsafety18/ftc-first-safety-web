<!-- ส่วนที่ 3: แบบฟอร์มเพิ่มรายบุคคล (Manual Input) พร้อม Dropdown ตำแหน่งแบบจัดกลุ่ม -->
<div class="section-box">
    <div class="section-title">เพิ่มรายชื่อพนักงาน FTC (Manual Input)</div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group">
            <label for="emp_id">รหัสพนักงาน *</label>
            <input type="text" id="emp_id" placeholder="ระบุรหัสพนักงาน" required>
        </div>

        <div class="form-group">
            <label for="emp_position">ตำแหน่งในโครงการ *</label>
            <select id="emp_position" onchange="toggleOtherPosition(this)" required>
                <option value="">-- กรุณาเลือกตำแหน่ง --</option>
                
                <optgroup label="1. ฝ่ายบริหารและควบคุมโครงการ">
                    <option value="Project Manager">ผู้จัดการโครงการ (PM)</option>
                    <option value="Project Engineer">วิศวกรโครงการ / วิศวกรหน่วยงาน</option>
                    <option value="Foreman">ผู้ควบคุมงาน / โฟร์แมน</option>
                    <option value="Admin">เจ้าหน้าที่ธุรการ / ฝ่ายโครงการ</option>
                </optgroup>

                <optgroup label="2. ฝ่ายความปลอดภัย (SHE)">
                    <option value="Safety Professional">เจ้าหน้าที่ความปลอดภัยระดับวิชาชีพ</option>
                    <option value="Safety Management">เจ้าหน้าที่ความปลอดภัยระดับบริหาร</option>
                    <option value="Safety Committee">คณะกรรมการความปลอดภัยฯ (คปอ.)</option>
                </optgroup>

                <optgroup label="3. ระบบใบอนุญาตทำงาน (E-Permit)">
                    <option value="Permit Requester">ผู้ขอใบอนุญาต</option>
                    <option value="Permit Issuer">ผู้ออกใบอนุญาต</option>
                    <option value="Permit Approver">ผู้อนุมัติ</option>
                    <option value="Permit Holder">ผู้ถือใบอนุญาต</option>
                </optgroup>

                <optgroup label="4. ผู้ปฏิบัติงานเฉพาะทางและเฝ้าระวัง">
                    <option value="Hole Watch">ผู้เฝ้าระวังพื้นที่อับอากาศ</option>
                    <option value="Fire Watch">ผู้เฝ้าระวังเหตุเพลิงไหม้</option>
                    <option value="Crane Operator">ผู้บังคับปั้นจั่น</option>
                    <option value="Signal Man">ผู้ให้สัญญาณ</option>
                    <option value="Rigger">ผู้ผูกยึดวัสดุ</option>
                </optgroup>

                <optgroup label="5. ฝ่ายรักษาความปลอดภัยและสนับสนุน">
                    <option value="Security Guard">เจ้าหน้าที่รักษาความปลอดภัย</option>
                    <option value="Medic">แพทย์ / พยาบาล</option>
                </optgroup>

                <!-- ตัวเลือกสำหรับเพิ่มตำแหน่งใหม่ -->
                <option value="อื่นๆ" style="font-weight: bold; color: #3182ce;">+ อื่นๆ (โปรดระบุตำแหน่งใหม่)</option>
            </select>
        </div>
    </div>

    <!-- ช่องสำหรับพิมพ์ตำแหน่งใหม่ จะแสดงเมื่อเลือก "อื่นๆ" -->
    <div class="form-group" id="other_position_div" style="display: none; margin-top: 15px;">
        <label for="other_position_input" style="color: #3182ce;">ระบุตำแหน่งใหม่ (ระบบจะบันทึกเป็นตำแหน่งเพิ่มเติม) *</label>
        <input type="text" id="other_position_input" placeholder="พิมพ์ชื่อตำแหน่งหน้าที่ที่ต้องการเพิ่ม">
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
        <div class="form-group">
            <label for="emp_firstname">ชื่อจริง *</label>
            <input type="text" id="emp_firstname" placeholder="ชื่อจริง" required>
        </div>
        <div class="form-group">
            <label for="emp_lastname">นามสกุล *</label>
            <input type="text" id="emp_lastname" placeholder="นามสกุล" required>
        </div>
    </div>

    <button class="btn btn-primary" style="margin-top: 20px; width: 100%;">บันทึกข้อมูลพนักงานเข้าโครงการ</button>
</div>

<script>
    // ฟังก์ชันตรวจสอบการเลือก Dropdown เพื่อซ่อน/แสดง ช่อง "อื่นๆ"
    function toggleOtherPosition(selectElement) {
        const otherDiv = document.getElementById('other_position_div');
        const otherInput = document.getElementById('other_position_input');
        
        if (selectElement.value === 'อื่นๆ') {
            otherDiv.style.display = 'block';
            otherInput.setAttribute('required', 'true'); // บังคับให้ต้องพิมพ์
            otherInput.focus(); // เลื่อนเคอร์เซอร์ไปรอให้พิมพ์ทันที
        } else {
            otherDiv.style.display = 'none';
            otherInput.removeAttribute('required');
            otherInput.value = ''; // เคลียร์ค่าทิ้งกรณีเปลี่ยนใจกลับไปเลือกตัวเลือกปกติ
        }
    }
</script>
