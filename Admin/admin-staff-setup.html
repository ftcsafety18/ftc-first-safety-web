<!-- ส่วนที่ 1: เลือกโครงการที่เป็นแกนหลัก -->
<div class="section-box">
    <div class="section-title">1. เลือกรหัส / ชื่อโครงการ</div>
    
    <div class="form-group">
        <label for="project_select">โครงการที่ต้องการขึ้นทะเบียนพนักงาน *</label>
        <select id="project_select" onchange="toggleNewProject(this)" required>
            <option value="">-- กรุณาเลือกโครงการ --</option>
            
            <!-- รายชื่อโครงการที่ดึงมาจากฐานข้อมูลเดิม (อ้างอิงจากไฟล์ Excel) -->
            <optgroup label="รายชื่อโครงการปัจจุบัน">
                <option value="PRJ-AMC">โครงการ AMC</option>
                <option value="PRJ-LUF">โครงการ LUF</option>
                <option value="PRJ-PCK">โครงการ PCK</option>
                <option value="PRJ-PHT">โครงการ PHT</option>
                <option value="PRJ-VEJTHANI">โครงการ เวชธานี</option>
                <option value="PRJ-CENTRAL-BANGNA">โครงการ เซ็นทรัลบางนา</option>
            </optgroup>

            <!-- ตัวเลือกสำหรับเพิ่มโครงการใหม่ นอกเหนือจากลิสต์ -->
            <option value="อื่นๆ" style="font-weight: bold; color: #38a169;">+ อื่นๆ (สร้างโครงการใหม่)</option>
        </select>
    </div>

    <!-- ช่องสำหรับพิมพ์ชื่อโครงการใหม่ จะแสดงเมื่อเลือก "อื่นๆ" -->
    <div class="form-group" id="new_project_div" style="display: none; margin-top: 15px; padding: 15px; border-left: 4px solid #38a169; background-color: #f0fff4;">
        <label for="new_project_input" style="color: #276749;">ระบุชื่อโครงการใหม่เพื่อบันทึกลงระบบ *</label>
        <input type="text" id="new_project_input" placeholder="ตัวอย่าง: โครงการ ก่อสร้าง Plant B (ระยอง)">
        <p style="font-size: 13px; color: #718096; margin-top: 5px;">* โครงการใหม่ที่ถูกสร้าง จะถูกผูกกับบุคลากรและพร้อมใช้สำหรับจัดสรรงบประมาณทันที</p>
    </div>
</div>

<script>
    // ฟังก์ชันตรวจสอบการเลือก Dropdown เพื่อซ่อน/แสดง ช่อง "เพิ่มโครงการใหม่"
    function toggleNewProject(selectElement) {
        const newProjectDiv = document.getElementById('new_project_div');
        const newProjectInput = document.getElementById('new_project_input');
        
        if (selectElement.value === 'อื่นๆ') {
            // แสดงกล่องข้อความ และบังคับให้ต้องพิมพ์ข้อมูล
            newProjectDiv.style.display = 'block';
            newProjectInput.setAttribute('required', 'true');
            newProjectInput.focus();
        } else {
            // ซ่อนกล่องข้อความ และล้างค่าทิ้งเพื่อไม่ให้ส่งข้อมูลขยะเข้า Database
            newProjectDiv.style.display = 'none';
            newProjectInput.removeAttribute('required');
            newProjectInput.value = ''; 
        }
    }
</script>
