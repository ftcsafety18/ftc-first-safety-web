<!DOCTYPE html>
<html lang="th" class="bg-[#f7fafc]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ศูนย์บัญชาการองค์กร | FTC Master Admin Portal</title>
  <meta name="description" content="FTC First Safety Enterprise — Master Admin command center portal." />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Noto Sans Thai font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans Thai"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            navy: '#2a4365',
            'navy-dark': '#1a365d',
            orange: '#db5a24',
            background: '#f7fafc',
            card: '#ffffff',
            border: '#e2e8f0',
            secondary: '#edf2f7',
            'muted-foreground': '#64748b',
            destructive: '#dc2626',
          },
        },
      },
    };
  </script>

  <style>
    body { font-family: '"Noto Sans Thai"', ui-sans-serif, system-ui, sans-serif; }
    /* accordion animation */
    .panel { display: none; }
    .panel.open { display: block; }
  </style>
</head>

<body class="bg-background text-navy-dark antialiased">
  <div class="mx-auto min-h-screen max-w-md bg-background pb-28 shadow-sm">

    <!-- ===== Header ===== -->
    <header class="relative overflow-hidden bg-navy-dark px-5 pb-16 pt-6 text-white">
      <div aria-hidden="true" class="pointer-events-none absolute inset-0 opacity-[0.06]"
        style="background-image: linear-gradient(to right, white 1px, transparent 1px), linear-gradient(to bottom, white 1px, transparent 1px); background-size: 28px 28px;"></div>

      <div class="relative flex items-start justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-orange shadow-lg shadow-black/30">
            <i data-lucide="shield-check" class="h-6 w-6 text-white"></i>
          </div>
          <div>
            <h1 class="text-pretty text-xl font-bold leading-tight tracking-tight">ศูนย์บัญชาการองค์กร</h1>
            <p class="mt-0.5 text-sm font-medium text-white/60">FTC Master Admin Portal</p>
          </div>
        </div>

        <button type="button" aria-label="ตั้งค่า"
          class="flex h-10 w-10 items-center justify-center rounded-full border border-white/15 bg-white/5 text-white/80 transition-colors hover:bg-white/10">
          <i data-lucide="settings" class="h-5 w-5"></i>
        </button>
      </div>

      <div class="relative mt-4 flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 rounded-full bg-gradient-to-r from-amber-400 to-amber-500 px-3 py-1 text-xs font-bold uppercase tracking-wider text-navy-dark shadow-sm">
          <span class="h-1.5 w-1.5 rounded-full bg-navy-dark"></span>
          Super Admin
        </span>
        <span class="text-xs font-medium text-white/50">FTC First Safety · Enterprise</span>
      </div>
    </header>

    <!-- ===== Executive Summary ===== -->
    <section aria-label="สรุปภาพรวมผู้บริหาร" class="relative z-10 -mt-10 px-5">
      <div class="grid grid-cols-3 divide-x divide-border rounded-2xl border border-border bg-card p-1 shadow-xl shadow-navy/10">
        <div class="flex flex-col items-center px-2 py-4 text-center">
          <i data-lucide="clock" class="mb-2 h-5 w-5 text-navy"></i>
          <span class="text-2xl font-bold leading-none tracking-tight text-navy-dark">1.2M</span>
          <span class="mt-1.5 text-[11px] font-medium leading-tight text-muted-foreground">Safe Man-Hours</span>
        </div>
        <div class="flex flex-col items-center px-2 py-4 text-center">
          <i data-lucide="file-check-2" class="mb-2 h-5 w-5 text-navy"></i>
          <span class="text-2xl font-bold leading-none tracking-tight text-navy-dark">12</span>
          <span class="mt-1.5 text-[11px] font-medium leading-tight text-muted-foreground">Active Permits</span>
        </div>
        <div class="flex flex-col items-center px-2 py-4 text-center">
          <i data-lucide="bell-ring" class="mb-2 h-5 w-5 text-orange"></i>
          <span class="text-2xl font-bold leading-none tracking-tight text-orange">8</span>
          <span class="mt-1.5 text-[11px] font-medium leading-tight text-muted-foreground">Pending Approvals</span>
        </div>
      </div>
    </section>

    <!-- ===== Module Accordion ===== -->
    <section aria-label="โมดูลการบริหารจัดการ" class="mt-6 space-y-3 px-5" id="modules"></section>
  </div>

  <!-- ===== Bottom Nav ===== -->
  <nav aria-label="เมนูหลัก" class="fixed inset-x-0 bottom-0 z-30 mx-auto max-w-md border-t border-border bg-card/95 backdrop-blur">
    <div class="relative grid grid-cols-5 items-end px-2 pt-2" style="padding-bottom: max(0.5rem, env(safe-area-inset-bottom));">
      <button type="button" data-nav="home" class="nav-btn flex flex-col items-center gap-1 rounded-lg py-1 text-[11px] font-medium">
        <i data-lucide="home" class="h-[22px] w-[22px]"></i>หน้าหลัก
      </button>
      <button type="button" data-nav="map" class="nav-btn flex flex-col items-center gap-1 rounded-lg py-1 text-[11px] font-medium">
        <i data-lucide="map" class="h-[22px] w-[22px]"></i>แผนที่
      </button>

      <div class="flex justify-center">
        <button type="button" data-nav="scan" aria-label="สแกน"
          class="-mt-7 flex h-14 w-14 flex-col items-center justify-center rounded-full bg-orange text-white shadow-lg shadow-orange/40 ring-4 ring-card transition-transform active:scale-95">
          <i data-lucide="qr-code" class="h-6 w-6"></i>
        </button>
      </div>

      <button type="button" data-nav="alerts" class="nav-btn flex flex-col items-center gap-1 rounded-lg py-1 text-[11px] font-medium">
        <i data-lucide="bell" class="h-[22px] w-[22px]"></i>แจ้งเตือน
      </button>
      <button type="button" data-nav="profile" class="nav-btn flex flex-col items-center gap-1 rounded-lg py-1 text-[11px] font-medium">
        <i data-lucide="user" class="h-[22px] w-[22px]"></i>โปรไฟล์
      </button>
    </div>
  </nav>

  <script>
    // ---- Data ----
    const badgeTone = {
      orange: 'bg-orange/10 text-orange',
      red: 'bg-destructive/10 text-destructive',
      muted: 'bg-secondary text-navy',
    };

    const moduleSections = [
      { id: 'setup', th: 'ศูนย์ตั้งค่าและวิศวกรรม', en: 'Project Setup & Engineering', icon: 'folder-kanban', open: true, items: [
        { th: 'ข้อมูลหลักโครงการ', en: 'Project Master Data', icon: 'database' },
        { th: 'โครงสร้างแผนงาน', en: 'WBS & Task Control', icon: 'list-tree' },
        { th: 'กำหนดพื้นที่และโซน', en: 'Area & Zone', icon: 'map-pinned' },
      ]},
      { id: 'vendor', th: 'ศูนย์บริหารผู้รับเหมาและการเงิน', en: 'Vendor & Finance Hub', icon: 'building-2', open: true, items: [
        { th: 'ทะเบียนนิติบุคคล', en: 'Vendor Master', icon: 'badge-check' },
        { th: 'อนุมัติการเบิกจ่าย', en: 'Billing & Progress Approval', icon: 'receipt-text', badge: { label: 'รอ 8', tone: 'orange' } },
      ]},
      { id: 'workforce', th: 'ศูนย์กำลังคนและสิทธิ์', en: 'Workforce & Compliance', icon: 'users', items: [
        { th: 'จัดการเจ้าหน้าที่ FTC', en: 'Internal Staff', icon: 'user-cog' },
        { th: 'อนุมัติและแบล็กลิสต์', en: 'Worker Approval', icon: 'user-check' },
      ]},
      { id: 'safety', th: 'ศูนย์ปฏิบัติการความปลอดภัย', en: 'Safety Operations', icon: 'shield-check', items: [
        { th: 'อนุมัติใบอนุญาตทำงาน', en: 'E-Permit Approval', icon: 'file-check-2', badge: { label: 'ใช้งาน 12', tone: 'muted' } },
        { th: 'ตรวจสอบหน้างานและออกใบเตือน', en: 'Field Audit & NCR', icon: 'clipboard-check' },
        { th: 'ตรวจสอบทรัพย์สินเครื่องจักร', en: 'Asset & E-Tagging', icon: 'qr-code' },
      ]},
      { id: 'emergency', th: 'ศูนย์ภาวะฉุกเฉินและสอบสวน', en: 'Emergency & Incident Control', icon: 'siren', items: [
        { th: 'สอบสวนอุบัติการณ์', en: 'Incident Report', icon: 'file-search' },
        { th: 'ระบบติดตามอพยพ', en: 'Evacuation Tracking', icon: 'route' },
      ]},
      { id: 'command', th: 'ศูนย์บัญชาการระดับสูง', en: "The God's Eye View", icon: 'line-chart', items: [
        { th: 'แดชบอร์ดผู้บริหาร', en: 'Executive Dashboard', icon: 'line-chart' },
      ]},
    ];

    // ---- Render accordion ----
    const container = document.getElementById('modules');
    container.innerHTML = moduleSections.map((section, index) => {
      const num = String(index + 1).padStart(2, '0');
      const isOpen = !!section.open;
      const items = section.items.map((item) => `
        <li>
          <button type="button" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left transition-colors hover:bg-secondary">
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-secondary text-navy">
              <i data-lucide="${item.icon}" class="h-[18px] w-[18px]"></i>
            </span>
            <span class="min-w-0 flex-1">
              <span class="block truncate text-sm font-medium text-navy-dark">${item.th}</span>
              <span class="block truncate text-xs text-muted-foreground">${item.en}</span>
            </span>
            ${item.badge ? `<span class="shrink-0 rounded-full px-2 py-0.5 text-[10px] font-bold ${badgeTone[item.badge.tone]}">${item.badge.label}</span>` : ''}
            <i data-lucide="chevron-right" class="h-4 w-4 shrink-0 text-muted-foreground/60"></i>
          </button>
        </li>`).join('');

      return `
        <div class="overflow-hidden rounded-2xl border border-border bg-card shadow-sm">
          <button type="button" data-accordion="${section.id}" aria-expanded="${isOpen}" aria-controls="panel-${section.id}"
            class="flex w-full items-center gap-3 px-4 py-3.5 text-left transition-colors hover:bg-secondary/60">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-navy text-white">
              <i data-lucide="${section.icon}" class="h-5 w-5"></i>
            </span>
            <span class="min-w-0 flex-1">
              <span class="flex items-center gap-2">
                <span class="text-[10px] font-bold tabular-nums text-orange">${num}</span>
                <span class="truncate text-[15px] font-semibold text-navy-dark">${section.th}</span>
              </span>
              <span class="mt-0.5 block truncate text-xs text-muted-foreground">${section.en}</span>
            </span>
            <i data-lucide="chevron-down" class="chevron h-5 w-5 shrink-0 text-muted-foreground transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}"></i>
          </button>
          <ul id="panel-${section.id}" class="panel ${isOpen ? 'open' : ''} border-t border-border px-2 pb-2 pt-1">${items}</ul>
        </div>`;
    }).join('');

    // ---- Accordion toggle ----
    container.querySelectorAll('[data-accordion]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const panel = document.getElementById('panel-' + btn.dataset.accordion);
        const chevron = btn.querySelector('.chevron');
        const willOpen = !panel.classList.contains('open');
        panel.classList.toggle('open', willOpen);
        btn.setAttribute('aria-expanded', String(willOpen));
        chevron.classList.toggle('rotate-180', willOpen);
      });
    });

    // ---- Bottom nav active state ----
    const navButtons = document.querySelectorAll('.nav-btn');
    function setActive(id) {
      navButtons.forEach((b) => {
        const on = b.dataset.nav === id;
        b.classList.toggle('text-navy', on);
        b.classList.toggle('text-muted-foreground', !on);
        if (on) b.setAttribute('aria-current', 'page');
        else b.removeAttribute('aria-current');
      });
    }
    navButtons.forEach((b) => b.addEventListener('click', () => setActive(b.dataset.nav)));
    setActive('home');

    // ---- Render Lucide icons ----
    lucide.createIcons();
  </script>
</body>
</html>
