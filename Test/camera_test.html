<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC Camera Debugger V.2</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; background: #F4F6F8; color: #333; }
        .header { text-align: center; margin-bottom: 20px; }
        .test-box { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h3 { margin-top: 0; color: #19335A; font-size: 16px; }
        p.desc { font-size: 12px; color: #666; font-family: monospace; background: #f1f5f9; padding: 5px; border-radius: 4px; }
        
        label.btn, button.btn { display: block; width: 100%; padding: 15px 0; color: white; text-align: center; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; border: none; box-sizing: border-box; }
        label.btn:active, button.btn:active { transform: scale(0.98); }
        input[type="file"] { display: none; }
        
        #logArea { background: #1e293b; color: #4ade80; padding: 12px; border-radius: 8px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.5; }
        
        /* สัดส่วนจอวิดีโอสำหรับ WebRTC */
        #video-container { display: none; margin-top: 15px; border-radius: 8px; overflow: hidden; border: 2px solid #DB5A24; }
        video { width: 100%; background: black; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="color: #19335A; margin-bottom: 5px;">FTC Camera Test V.2</h2>
        <p style="font-size: 14px; margin-top: 0; color: #666;">ทดสอบกล้องคอมพิวเตอร์และมือถือ</p>
    </div>

    <!-- 💻 Test 4: WebRTC สำหรับคอมพิวเตอร์และมือถือ -->
    <div class="test-box">
        <h3>Test 4: ระบบ WebRTC (กล้องสดหน้าเว็บ)</h3>
        <p class="desc">navigator.mediaDevices.getUserMedia<br>*(รองรับกล้องคอมพิวเตอร์ Webcam และมือถือ)*</p>
        <button class="btn" style="background: #DB5A24;" onclick="startWebRTC()">
            🎥 เปิดกล้อง (WebRTC)
        </button>
        
        <div id="video-container">
            <video id="live-video" autoplay playsinline></video>
            <button class="btn" style="background: #19335A; margin-top: 0; border-radius: 0 0 8px 8px;" onclick="stopWebRTC()">
                ⏹️ ปิดกล้อง
            </button>
        </div>
    </div>

    <!-- 📱 Test 5: คำสั่งดั้งเดิมที่สุด -->
    <div class="test-box">
        <h3>Test 5: HTML พื้นฐาน (Basic Capture)</h3>
        <p class="desc">accept="image/*" capture</p>
        <label class="btn" style="background: #475569;">
            📸 กดทดสอบที่ 5
            <input type="file" accept="image/*" capture onchange="handleFile(this, 5)">
        </label>
    </div>

    <div class="test-box" style="background: #f8fafc;">
        <h3>💻 Console Log</h3>
        <div id="logArea">▶ ระบบพร้อมทำงาน...<br></div>
    </div>

    <script>
        function logMsg(msg) {
            var logBox = document.getElementById('logArea');
            var time = new Date().toLocaleTimeString('th-TH');
            logBox.innerHTML += '<span style="color:#94a3b8">[' + time + ']</span> ' + msg + '<br>';
            logBox.scrollTop = logBox.scrollHeight; 
        }

        function handleFile(input, testNum) {
            if (input.files && input.files.length > 0) {
                logMsg('🟢 Test ' + testNum + ': สำเร็จ! ได้รับไฟล์ ' + input.files[0].name);
            } else {
                logMsg('🔴 Test ' + testNum + ': ยกเลิกการเลือกไฟล์');
            }
        }

        // ระบบควบคุม WebRTC (กล้องคอมพิวเตอร์/มือถือ)
        let currentStream = null;

        async function startWebRTC() {
            logMsg('🟡 กำลังร้องขอสิทธิ์เข้าถึงกล้อง (Permission)...');
            var videoContainer = document.getElementById('video-container');
            var video = document.getElementById('live-video');

            try {
                // ขออนุญาตเปิดกล้อง
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                
                currentStream = stream;
                video.srcObject = stream;
                videoContainer.style.display = 'block';
                logMsg('🟢 เข้าถึงกล้องสำเร็จ! (สตรีมมิ่งเริ่มทำงาน)');

            } catch (err) {
                console.error(err);
                if (err.name === 'NotAllowedError') {
                    logMsg('🔴 ผู้ใช้หรือเบราว์เซอร์ "ปฏิเสธ" การเข้าถึงกล้อง');
                } else if (err.name === 'NotFoundError') {
                    logMsg('🔴 ไม่พบอุปกรณ์กล้องบนเครื่องนี้');
                } else {
                    logMsg('🔴 เกิดข้อผิดพลาด: ' + err.message);
                }
            }
        }

        function stopWebRTC() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            document.getElementById('video-container').style.display = 'none';
            logMsg('⏹️ ปิดกล้อง WebRTC เรียบร้อย');
        }
    </script>

</body>
</html>
