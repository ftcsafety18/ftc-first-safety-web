<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | FTC First Safety Paperless</title>
    <!-- โหลดชุดตกแต่งหน้าตา (Tailwind CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-200 h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full mx-4">
        <!-- โลโก้และชื่อระบบ -->
        <div class="text-center mb-8">
            <div class="bg-emerald-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-md">
                <i class="fa-solid fa-shield-halved text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">FTC First Safety</h1>
            <p class="text-gray-500 mt-1">ยินดีต้อนรับสู่ระบบความปลอดภัยบริษัท First Safety Construction</p>
        </div>

        <!-- ฟอร์มล็อกอิน -->
        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">อีเมลผู้ใช้งาน</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-envelope text-gray-400"></i>
                    </div>
                    <input type="email" id="email" class="pl-10 block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm" placeholder="name@company.com" required>
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">รหัสผ่าน</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" id="password" class="pl-10 block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm" placeholder="••••••••" required>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-emerald-600 focus:ring-emerald-500">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-900">จดจำฉันไว้ในระบบ</label>
                </div>
                <div class="text-sm">
                    <a href="#" class="font-medium text-emerald-600 hover:text-emerald-500">ลืมรหัสผ่าน?</a>
                </div>
            </div>

            <!-- เปลี่ยนปุ่มเป็น type submit เพื่อส่งข้อมูล -->
            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors duration-200">
                เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <!-- สคริปต์เชื่อมต่อกับ Supabase -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // ⚠️ พี่ณัฐธัญนำ URL และ Key จาก Supabase มาใส่ในเครื่องหมายคำพูดด้านล่างนี้นะคะ
        const supabaseUrl = 'https://ancwqgaaqliandzdzphg.supabase.co';
        const supabaseKey = 'sb_publishable_IVdSBILj_etRSNF48ig1PA_sBAt23NG';
        const supabase = createClient(supabaseUrl, supabaseKey);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // ป้องกันไม่ให้เว็บโหลดหน้าใหม่
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');
            
            // เปลี่ยนข้อความปุ่มระหว่างรอ
            btn.innerText = 'กำลังตรวจสอบข้อมูล...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            // ส่งข้อมูลไปถาม Supabase
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง');
                btn.innerText = 'เข้าสู่ระบบ';
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            } else {
                alert('ยินดีต้อนรับเข้าสู่ระบบค่ะ!');
                btn.innerText = 'เข้าสู่ระบบสำเร็จ';
                // เมื่อเรามีหน้า Dashboard แล้ว จะใส่คำสั่งเปลี่ยนหน้าตรงนี้ค่ะ
            }
        });
    </script>
</body>
</html>
