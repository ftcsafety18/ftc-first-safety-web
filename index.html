<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC Safety - Main Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #F8F9FA; }
        .menu-card { transition: all 0.2s ease-in-out; }
        .menu-card:active { transform: scale(0.96); }
    </style>
</head>
<body class="text-gray-800 min-h-screen relative pb-10">

    <!-- Header & Logo -->
    <div class="bg-[#1a237e] text-white py-4 px-6 flex items-center shadow-md rounded-b-2xl">
        <div class="bg-white text-blue-900 font-bold px-3 py-1 rounded-md text-sm border-2 border-blue-400 flex items-center">
            <span class="bg-blue-900 text-white rounded-full w-5 h-5 flex items-center justify-center mr-1 text-xs">1</span>
            1 First
        </div>
        <div class="flex-grow text-center font-bold text-lg pr-10">
            เมนูที่ 0 Main Menu
        </div>
    </div>

    <div class="px-4 mt-6 max-w-md mx-auto space-y-4">
        
        <!-- Welcome Card -->
        <div class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-yellow-300 text-center">
            <h2 class="text-[#1a237e] font-bold">ยินดีต้อนรับสู่ระบบความปลอดภัย</h2>
            <p class="text-sm text-gray-600 mt-1">บริษัท เฟิร์ส เทคโนโลยี คอนสตรัคชั่น</p>
            <p class="text-xs text-orange-600 font-medium mt-1">"เพราะความปลอดภัยเป็นหน้าที่ของทุกคน"</p>
        </div>

        <!-- User Profile Card -->
        <div class="bg-gradient-to-r from-[#283593] to-[#3f51b5] rounded-2xl p-4 shadow-md flex items-center text-white">
            <div class="bg-pink-100 rounded-full p-2 mr-4 shadow-inner border-2 border-white">
                <!-- Avatar Emoji -->
                <div class="w-12 h-12 flex items-center justify-center text-3xl">👨‍🦳</div>
            </div>
            <div>
                <h3 class="font-bold text-lg">ณัฐธัญ ละอองทอง</h3>
                <p class="text-sm text-blue-100">ผู้บริหาร (Admin / PM)</p>
            </div>
        </div>

        <!-- Menu Section -->
        <div class="mt-6">
            <h3 class="text-gray-500 font-bold mb-3 text-sm px-1">เมนูการปฏิบัติงาน (OPERATIONS)</h3>
            
            <!-- Grid Menu Container -->
            <div id="menuGrid" class="grid grid-cols-2 gap-3">
                <!-- JavaScript will generate menu buttons here -->
            </div>

            <!-- SOS Button -->
            <button class="w-full mt-4 bg-[#c62828] hover:bg-red-800 text-white rounded-2xl py-4 shadow-lg flex flex-col items-center justify-center menu-card">
                <span class="text-2xl mb-1">🚨</span>
                <span class="font-bold">7. แจ้งเหตุฉุกเฉินด่วน (SOS)</span>
            </button>
        </div>
    </div>

    <!-- ---------------------------------------------------- -->
    <!-- Modal (Pop-up) สำหรับ Sub-menu -->
    <!-- ---------------------------------------------------- -->
    <div id="submenuModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-10/12 max-w-sm overflow-hidden shadow-2xl transform transition-all">
            
            <!-- Modal Header -->
            <div class="bg-[#1a237e] px-5 py-4 flex justify-between items-center">
                <h3 id="modalTitle" class="text-white font-bold text-lg">เลือกรายการ</h3>
                <button onclick="closeModal()" class="text-white hover:text-gray-300 text-2xl font-bold leading-none">&times;</button>
            </div>
            
            <!-- Modal Body (List of Submenus) -->
            <div id="modalContent" class="p-5 space-y-3 bg-gray-50">
                <!-- JavaScript will inject Submenus here -->
            </div>
            
        </div>
    </div>

    <!-- Script สำหรับควบคุมการทำงาน -->
    <script>
        // ข้อมูลเมนูทั้งหมด
        const menuData = [
            {
                id: '1',
                title: 'ลงทะเบียน & อบรม',
                subtitle: 'Onboarding',
                icon: '📝', 
                // เมนูที่มี Submenu ให้ใช้ Array แบบนี้ครับ
                submenus: [
                    { id: '1.1', title: 'ลงทะเบียนเข้าปฏิบัติงาน', link: 'Worker/Worker_Registration_ToSystem.html' },
                    { id: '1.2', title: 'อบรมความปลอดภัย (Orientation)', link: '#' }
                ]
            },
            { id: '2', title: 'ขอใบอนุญาตทำงาน', subtitle: 'PTW (Permit To Work)', icon: '🦺', link: '#' },
            { id: '3', title: 'ประชุมหน้างาน & จุดเสี่ยง', subtitle: 'TBT & Near Miss', icon: '👷', link: '#' },
            { id: '4', title: 'ปิดใบงาน 5ส', subtitle: 'Secure Close-out', icon: '🏁', link: '#' },
            { id: '5', title: 'บัตรดิจิทัลของฉัน', subtitle: 'My E-Badge', icon: '🪪', link: '#' },
            { id: '6', title: 'ทรัพย์สิน & ตรวจเครื่องมือ', subtitle: 'Asset & E-Tagging', icon: '🛠️', link: '#' }
        ];

        // ฟังก์ชันสร้างปุ่มเมนูลงในหน้าจอ
        const grid = document.getElementById('menuGrid');
        menuData.forEach(menu => {
            const btn = document.createElement('button');
            btn.className = 'bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center menu-card';
            btn.onclick = () => handleMenuClick(menu);
            
            btn.innerHTML = `
                <div class="text-3xl mb-2">${menu.icon}</div>
                <h4 class="font-bold text-gray-800 text-sm leading-tight">${menu.id}. ${menu.title}</h4>
                <p class="text-[10px] text-gray-400 mt-1">${menu.subtitle}</p>
            `;
            grid.appendChild(btn);
        });

        // ฟังก์ชันจัดการตอนกดปุ่มเมนู
        function handleMenuClick(menu) {
            // ถ้ามีเมนูย่อย (Submenu) ให้เปิด Pop-up
            if (menu.submenus && menu.submenus.length > 0) {
                openModal(menu);
            } 
            // ถ้าไม่มีเมนูย่อย และมี Link ให้วิ่งไปหน้าต่างใหม่เลย
            else if (menu.link && menu.link !== '#') {
                window.location.href = menu.link;
            }
        }

        // ฟังก์ชันเปิด Pop-up
        function openModal(menu) {
            document.getElementById('modalTitle').textContent = `${menu.id}. ${menu.title}`;
            const content = document.getElementById('modalContent');
            content.innerHTML = ''; // ล้างข้อมูลเก่า

            // วนลูปสร้างปุ่ม Submenu
            menu.submenus.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-4 py-4 bg-white hover:bg-blue-50 border border-gray-200 rounded-xl shadow-sm text-gray-700 font-medium flex justify-between items-center transition-colors';
                btn.onclick = () => {
                    if(sub.link !== '#') window.location.href = sub.link;
                };
                
                btn.innerHTML = `
                    <span class="text-sm"><span class="font-bold text-blue-800 mr-1">${sub.id}</span> ${sub.title}</span>
                    <span class="text-blue-400 text-lg">›</span>
                `;
                content.appendChild(btn);
            });

            // แสดง Modal
            document.getElementById('submenuModal').classList.remove('hidden');
        }

        // ฟังก์ชันปิด Pop-up
        function closeModal() {
            document.getElementById('submenuModal').classList.add('hidden');
        }
    </script>
</body>
</html>
