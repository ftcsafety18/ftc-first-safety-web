<!-- Header Menu พร้อมโลโก้ CSS/SVG -->
        <div class="header">
            <!-- โซนโลโก้ 1First Technology -->
            <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 15px;">
                <!-- SVG Logo Icon -->
                <svg width="45" height="45" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100" height="100" rx="22" fill="white" box-shadow="0 4px 6px rgba(0,0,0,0.1)"/>
                    <!-- ตัวอักษร F ผสม T สไตล์โมเดิร์น -->
                    <path d="M 28 35 L 72 35 M 40 35 L 40 75 M 28 52 L 55 52" stroke="#2b4c8c" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- จุดสีส้มสื่อถึงเทคโนโลยี/ความปลอดภัย -->
                    <circle cx="72" cy="70" r="9" fill="#ed8936"/>
                </svg>
                <!-- Text Logo -->
                <div style="text-align: left; line-height: 1;">
                    <div style="font-size: 22px; font-weight: 800; color: white; letter-spacing: 0.5px; margin-bottom: 2px;">
                        <span style="color: #ed8936;">1</span>FIRST
                    </div>
                    <div style="font-size: 11px; font-weight: 600; color: #e2e8f0; letter-spacing: 2px;">
                        TECHNOLOGY
                    </div>
                </div>
            </div>

            <!-- โซน User Profile (ของเดิม) -->
            <div class="user-profile">
                <img id="profile-img" src="https://via.placeholder.com/40" alt="Profile">
                <div>
                    <strong id="profile-name">กำลังตรวจสอบตัวตน...</strong>
                    <span id="profile-vendor">แผนกความปลอดภัย</span>
                </div>
            </div>
        </div>
