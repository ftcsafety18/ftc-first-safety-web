<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC Safety - Main Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #F8F9FA; }
        .menu-card { transition: all 0.2s ease-in-out; }
        .menu-card:active { transform: scale(0.96); }
        
        /* Animation สำหรับ Modal ให้เด้งขึ้นมาจากด้านล่างแบบมือถือ */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-animate { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="text-gray-800 min-h-screen relative pb-10">

    <!-- Header & Logo ตามภาพ image_fcb854.png -->
    <div class="bg-[#1a237e] text-white py-3 px-4 flex items-center justify-between shadow-md relative">
        <div class="flex items-center gap-2 z-10">
            <div class="bg-white rounded p-1 flex items-center justify-center">
                <!-- 💡 พี่ณัฐธัญสามารถเปลี่ยนชื่อไฟล์ src="logo.png" ให้ตรงกับไฟล์รูปโลโก้ First ของพี่ได้เลยครับ -->
                <img src="logo.png" alt="First Logo" class="h-7 w-auto object-contain" onerror="this.src='https://via.placeholder.com/80x28?text=FIRST'">
            </div>
        </div>
        <div class="text-center font-bold text-lg absolute left-1/2 transform -translate-x-1/2 w-full">
            เมนูที่ 0 Main Menu
        </div>
        <div class="w-10 z-10"></div> <!-- Spacer ให้อักษรตรงกลางสมดุล -->
    </div>

    <!-- Main Content ตามภาพ image_fcbb5a.jpg -->
    <div class="px-4 mt-6 max-w-md mx-auto space-y-4">
        
        <!-- Welcome Card -->
        <div class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-yellow-400 text-center">
            <h2 class="text-[#1a237e] font-bold text-lg">ยินดีต้อนรับสู่ระบบความปลอดภัย</h2>
            <p class="text-sm text-gray-600 mt-1">บริษัท เฟิร์ส เทคโนโลยี คอนสตรัคชั่น</p>
            <p class="text-xs text-orange-500 font-medium mt-1">"เพราะความปลอดภัยเป็นหน้าที่ของทุกคน"</p>
        </div>

        <!-- User Profile Card -->
        <div class="bg-[#3949ab] rounded-2xl p-4 shadow-md flex items-center text-white">
            <div class="mr-4">
                <div class="w-14 h-14 bg-pink-100 rounded-full flex items-center justify-center overflow-hidden border-2 border-white">
                    <span class="text-3xl">👨‍🦳</span>
                </div>
            </div>
            <div>
                <h3 class="font-bold text-lg">ณัฐธัญ ละอองทอง</h3>
                <p class="text-sm text-blue-100">ผู้บริหาร (Admin / PM)</p>
            </div>
        </div>

        <!-- Menu Section -->
        <div class="mt-6">
            <h3 class="text-gray-500 font-bold mb-3 text-sm px-1">เมนูการปฏิบัติงาน (OPERATIONS)</h3>
            
            <div id="menuGrid" class="grid grid-cols-2 gap-4">
                <!-- JavaScript จะดึงข้อมูลเมนูมาสร้างปุ่มตรงนี้ -->
            </div>
            
            <!-- SOS Button -->
            <button class="w-full mt-4 bg-[#c62828] hover:bg-red-800 text-white rounded-xl py-4 shadow-md flex flex-col items-center justify-center transition-transform active:scale-95">
                <span class="text-3xl mb-1">🚨</span>
                <span class="font-bold">7. แจ้งเหตุฉุกเฉินด่วน (SOS)</span>
            </button>
        </div>
    </div>

    <!-- Modal (Pop-up) สำหรับ Sub-menu ดีไซน์ใหม่ -->
    <div id="submenuModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 z-50 flex items-end sm:items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-md overflow-hidden shadow-2xl modal-animate pb-6">
            <div class="flex justify-center pt-3 pb-2">
                <div class="w-10 h-1.5 bg-gray-300 rounded-full"></div>
            </div>
            <div class="px-6 py-2 flex justify-between items-start">
                <h3 id="modalTitle" class="text-[#1a237e] font-bold text-lg leading-tight pr-2"></h3>
                <button onclick="closeModal()" class="bg-gray-100 text-gray-500 hover:bg-gray-300 rounded-full w-8 h-8 flex items-center justify-center font-bold text-xl flex-shrink-0">&times;</button>
            </div>
            <div id="modalContent" class="px-5 py-4"></div>
        </div>
    </div>

    <script>
        const menuData = [
            {
                id: '1',
                title: 'ลงทะเบียน & อบรม',
                subtitle: 'Onboarding',
                icon: '📝', 
                modalTitle: '1. ลงทะเบียนและอบรมความปลอดภัย <br>& อนุมัติยืนยันพนักงานของ Vendor',
               submenus: [
                    { 
                        id: '1.1', 
                        title: 'ลงทะเบียนพนักงานใหม่', 
                        subtitle: 'ยืนยันตัวตนผ่านบัตรประชาชน (KYC) และยอมรับข้อตกลง PDPA ภาคบังคับ',
                        icon: '👤',
                        // เปลี่ยนลิงก์เป็นแบบ Relative Path ชี้ไปหาโฟลเดอร์ในบ้านเดียวกัน
                        link: './Worker/Worker_Registration_ToSystem.html', 
                        style: 'normal'
                    },
                    { 
                        id: '1.2', 
                        title: 'อบรมความปลอดภัยและเข้าใจความเสี่ยง', 
                        subtitle: 'ทดสอบความรู้และถ่าย Live Selfie ป้องกันการสวมรอย เฉพาะผู้ผ่านเกณฑ์จึงจะได้รับ E-Badge',
                        icon: '🎓',
                        link: '#',
                        style: 'normal'
                    },
                    { 
                        id: '1.3', 
                        title: 'อนุมัติและยืนยันพนักงาน (Vendor/PM)', 
                        subtitle: 'สำหรับเถ้าแก่ตรวจสอบผลสอบลูกน้อง และกดยืนยันยอดคนงานที่ได้รับอนุญาตเข้าไซต์งานจริง',
                        icon: '✅',
                        link: '#',
                        style: 'highlight'
                    }
                ]
            },
            { id: '2', title: 'ขอใบอนุญาตทำงาน', subtitle: 'PTW (Permit To Work)', icon: '🦺', link: 'https://ftcsafety18.github.io/ftc-first-safety-web/permit_form.html' },
            { id: '3', title: 'ประชุมหน้างาน & จุดเสี่ยง', subtitle: 'TBT & Near Miss', icon: '👷', link: '#' },
            { id: '4', title: 'ปิดใบงาน 5ส', subtitle: 'Secure Close-out', icon: '🏁', link: '#' },
            { id: '5', title: 'บัตรดิจิทัลของฉัน', subtitle: 'My E-Badge', icon: '🪪', link: '#' },
            { id: '6', title: 'ทรัพย์สิน & ตรวจเครื่องมือ', subtitle: 'Asset & E-Tagging', icon: '🛠️', link: '#' }
        ];

        const grid = document.getElementById('menuGrid');
        menuData.forEach(menu => {
            const btn = document.createElement('button');
            btn.className = 'bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center menu-card';
            btn.onclick = () => handleMenuClick(menu);
            btn.innerHTML = `
                <div class="text-4xl mb-2">${menu.icon}</div>
                <h4 class="font-bold text-gray-800 text-[13px] leading-tight">${menu.id}. ${menu.title}</h4>
                <p class="text-[10px] text-gray-400 mt-1">${menu.subtitle}</p>
            `;
            grid.appendChild(btn);
        });

        function handleMenuClick(menu) {
            if (menu.submenus && menu.submenus.length > 0) {
                openModal(menu);
            } else if (menu.link && menu.link !== '#') {
                window.location.href = menu.link;
            }
        }

        function openModal(menu) {
            document.getElementById('modalTitle').innerHTML = menu.modalTitle ? menu.modalTitle : `${menu.id}. ${menu.title}`;
            const content = document.getElementById('modalContent');
            content.innerHTML = ''; 

            menu.submenus.forEach(sub => {
                const isHighlight = sub.style === 'highlight';
                const bgClass = isHighlight ? 'bg-[#fffae8] border-[#fcefc7]' : 'bg-white border-gray-100 hover:bg-gray-50';
                const titleColor = isHighlight ? 'text-[#b7791f]' : 'text-[#1a237e]';

                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 mb-3 border rounded-xl shadow-sm flex items-start transition-colors ${bgClass}`;
                btn.onclick = () => {
                    if(sub.link !== '#') window.location.href = sub.link;
                };
                
                btn.innerHTML = `
                    <div class="text-3xl mr-4 mt-1 opacity-90">${sub.icon}</div>
                    <div class="flex-1">
                        <h4 class="font-bold text-[15px] ${titleColor} mb-1">${sub.id} ${sub.title}</h4>
                        <p class="text-[11px] text-gray-500 leading-snug">${sub.subtitle}</p>
                    </div>
                `;
                content.appendChild(btn);
            });
            
            document.getElementById('submenuModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('submenuModal').classList.add('hidden');
        }
    </script>
</body>
</html>
