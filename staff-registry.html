<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขึ้นทะเบียนบุคลากรและเอกสารความปลอดภัย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen p-6">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
        <div class="bg-teal-700 text-white px-6 py-4">
            <h2 class="text-2xl font-semibold">ระบบขึ้นทะเบียนบุคลากร และเอกสารความปลอดภัย</h2>
            <p class="text-teal-200 text-sm mt-1">FTC Digital Safety Transformation</p>
        </div>

        <form id="staffForm" class="p-6 space-y-8">
            
            <!-- ส่วนที่ 1: ข้อมูลบุคคล -->
            <div>
                <h3 class="text-lg font-medium text-gray-900 border-b pb-2 mb-4">1. ข้อมูลส่วนตัว (Personal Info)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">รหัสพนักงาน / เลขบัตร ปชช. *</label>
                        <!-- นายณัฐธัญแก้ไขเพิ่มตัวกรองตัวเลข 13 หลักตรงนี้ครับ -->
                        <input type="text" id="id_card" required maxlength="13" oninput="this.value = this.value.replace(/[^0-9]/g, '');" placeholder="กรอกตัวเลขเท่านั้น (สูงสุด 13 หลัก)" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 border p-2 bg-gray-50 font-medium">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">ชื่อ-นามสกุล *</label>
                        <input type="text" id="full_name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">ตำแหน่ง</label>
                        <input type="text" id="position" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">สังกัด / บริษัทผู้รับเหมา</label>
                        <input type="text" id="company" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 border p-2">
                    </div>
                </div>
            </div>

            <!-- ส่วนที่ 2: เอกสารใบรับรองแพทย์ -->
            <div class="bg-blue-50 p-5 rounded-lg border border-blue-200">
                <h3 class="text-lg font-medium text-blue-900 border-b border-blue-300 pb-2 mb-4">2. เอกสารประเมินสุขภาพ (Fit to Work)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">อัปโหลดไฟล์ (PDF / รูปภาพ)</label>
                        <input type="file" id="fit_to_work_file" accept=".pdf, image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">วันหมดอายุใบรับรองแพทย์</label>
                        <input type="date" id="fit_to_work_expiry" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 border p-2">
                    </div>
                </div>
            </div>

            <!-- ส่วนที่ 3: ใบเซอร์ / อบรมความปลอดภัย -->
            <div class="bg-orange-50 p-5 rounded-lg border border-orange-200">
                <h3 class="text-lg font-medium text-orange-900 border-b border-orange-300 pb-2 mb-4">3. เอกสารอบรมความปลอดภัย (Training Certificate)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">อัปโหลดไฟล์ (เช่น ทีม 4 ผู้, ที่อับอากาศ)</label>
                        <input type="file" id="training_cert_file" accept=".pdf, image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-orange-600 file:text-white hover:file:bg-orange-700">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">วันหมดอายุใบเซอร์</label>
                        <input type="date" id="training_cert_expiry" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 border p-2">
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-4 border-t">
                <button type="submit" id="submitBtn" class="bg-teal-700 text-white px-6 py-2 rounded-md shadow-sm hover:bg-teal-800 transition font-medium text-lg flex items-center">
                    บันทึกข้อมูลและอัปโหลดเอกสาร
                </button>
            </div>
        </form>
    </div>

    <!-- โหลด Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            const SUPABASE_URL = 'https://ancwqgaaqliandzdzphg.supabase.co'; 
            const SUPABASE_ANON_KEY = 'sb_publishable_IVdSBILj_etRSNF48ig1PA_sBAt23NG';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            document.getElementById('staffForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.innerHTML = 'กำลังบันทึกและอัปโหลด...⏳';

                try {
                    const idCard = document.getElementById('id_card').value;
                    let fitToWorkUrl = null;
                    let trainingCertUrl = null;

                    // 1. ฟังก์ชันอัปโหลดไฟล์ไปที่ Supabase Storage
                    async function uploadFile(fileInputId, folderName) {
                        const fileInput = document.getElementById(fileInputId);
                        if (fileInput.files.length > 0) {
                            const file = fileInput.files[0];
                            const fileExt = file.name.split('.').pop();
                            const fileName = `${idCard}_${Date.now()}.${fileExt}`;
                            const filePath = `${folderName}/${fileName}`;

                            const { data, error } = await supabase.storage
                                .from('safety-documents')
                                .upload(filePath, file);

                            if (error) throw error;

                            const { data: publicUrlData } = supabase.storage
                                .from('safety-documents')
                                .getPublicUrl(filePath);
                            
                            return publicUrlData.publicUrl;
                        }
                        return null;
                    }

                    // อัปโหลดไฟล์ Fit to Work (ถ้ามีแนบมา)
                    fitToWorkUrl = await uploadFile('fit_to_work_file', 'fit-to-work');
                    
                    // อัปโหลดไฟล์ Training Cert (ถ้ามีแนบมา)
                    trainingCertUrl = await uploadFile('training_cert_file', 'training-certs');

                    // 2. นำข้อมูลและ URL ของไฟล์ ไปบันทึกในตาราง
                    const payload = {
                        id_card_or_employee_id: idCard,
                        full_name: document.getElementById('full_name').value,
                        position: document.getElementById('position').value,
                        company: document.getElementById('company').value,
                        fit_to_work_url: fitToWorkUrl,
                        fit_to_work_expiry: document.getElementById('fit_to_work_expiry').value || null,
                        training_cert_url: trainingCertUrl,
                        training_cert_expiry: document.getElementById('training_cert_expiry').value || null
                    };

                    const { data, error } = await supabase
                        .from('table_internal_staff')
                        .insert([payload]);

                    if (error) {
                        if (error.code === '23505') {
                            alert("❌ มีรหัสพนักงาน/บัตร ปชช. นี้ในระบบแล้วครับ");
                        } else {
                            throw error;
                        }
                    } else {
                        alert("✅ ขึ้นทะเบียนบุคลากรและอัปโหลดเอกสารสำเร็จ!");
                        document.getElementById('staffForm').reset();
                    }

                } catch (err) {
                    console.error(err);
                    alert("เกิดข้อผิดพลาด: " + err.message);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'บันทึกข้อมูลและอัปโหลดเอกสาร';
                }
            });
        });
    </script>
</body>
</html>
