<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM - ระบบจัดการพื้นที่ปฏิบัติงาน (Area Master Setup)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #edf2f7; margin: 0; padding: 20px; color: #2d3748; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background-color: #2b6cb0; color: white; padding: 20px; text-align: center; }
        .header h2 { margin: 0; font-size: 22px; }
        .form-section { padding: 20px 25px; border-bottom: 1px solid #e2e8f0; }
        .section-title { font-size: 16px; font-weight: 600; color: #2b6cb0; margin-bottom: 15px; border-left: 4px solid #2b6cb0; padding-left: 10px; }
        .form-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 200px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #4a5568; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 4px; font-family: 'Sarabun', sans-serif; box-sizing: border-box; }
        .btn-submit { background-color: #38a169; color: white; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 16px; width: 100%; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background-color: #2f855a; }
        .btn-submit:disabled { background-color: #a0aec0; cursor: not-allowed; }
        
        /* สไตล์สำหรับตารางแสดงข้อมูล */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background-color: #edf2f7; font-weight: 600; color: #4a5568; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; color: white; display: inline-block; }
        .bg-danger { background-color: #e53e3e; } /* เขตอันตราย */
        .bg-warning { background-color: #dd6b20; } /* เขตควบคุม */
        .bg-success { background-color: #38a169; } /* เขตปลอดภัย */
        .status-active { color: #38a169; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>ระบบจัดการพื้นที่ปฏิบัติงาน (Area Master Setup)</h2>
        <p style="margin:5px 0 0; font-size: 14px; opacity: 0.9;">สำหรับ Project Manager (PM) เพื่อกำหนดระดับความเสี่ยงของพื้นที่</p>
    </div>

    <!-- ส่วนที่ 1: ฟอร์มสร้างพื้นที่ใหม่ -->
    <form id="areaForm" onsubmit="submitAreaMaster(event)">
        <div class="form-section">
            <div class="section-title">1. ขึ้นทะเบียนพื้นที่โครงการใหม่</div>
            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>รหัสพื้นที่ (Area ID) *</label>
                    <input type="text" id="areaId" required placeholder="เช่น AREA-001">
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>ชื่อโครงการ / พื้นที่ปฏิบัติงาน *</label>
                    <input type="text" id="projectName" required placeholder="เช่น งานซ่อมบำรุงหอระบายความร้อน">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>ชื่อ Project Manager (ผู้รับผิดชอบ) *</label>
                    <input type="text" id="pmName" required placeholder="ระบุชื่อ PM">
                </div>
                <div class="form-group">
                    <label>ระดับเขตพื้นที่ (อ้างอิงตามหลักวิชาการ) *</label>
                    <select id="workZone" required>
                        <option value="">-- ประเมินระดับความเสี่ยง --</option>
                        <option value="เขตอันตราย">เขตอันตราย (พื้นที่เสี่ยงสูงสุด / Hot Zone)</option>
                        <option value="เขตควบคุม">เขตควบคุม (พื้นที่ควบคุมความเสี่ยง / Warm Zone)</option>
                        <option value="เขตปลอดภัย">เขตปลอดภัย (พื้นที่ทั่วไป / Cold Zone)</option>
                    </select>
                </div>
            </div>

            <div style="padding-top: 10px;">
                <button type="submit" class="btn-submit" id="submitBtn">บันทึกข้อมูลและเปิดใช้งานพื้นที่</button>
            </div>
        </div>
    </form>

    <!-- ส่วนที่ 2: ตารางแสดงพื้นที่ที่เปิดใช้งานแล้ว -->
    <div class="form-section" style="background-color: #f8fafc;">
        <div class="section-title" style="border-left-color: #805ad5;">2. ฐานข้อมูลพื้นที่ทั้งหมด (เชื่อมโยงไปยังฝ่ายงบประมาณ)</div>
        <div style="overflow-x: auto;">
            <table id="areaTable">
                <thead>
                    <tr>
                        <th>รหัสพื้นที่</th>
                        <th>ชื่อโครงการ / พื้นที่</th>
                        <th>PM ผู้รับผิดชอบ</th>
                        <th>ระดับเขตพื้นที่</th>
                        <th>สถานะ</th>
                    </tr>
                </thead>
                <tbody id="areaTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center;">กำลังโหลดข้อมูล...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://ancwqgaaqliandzdzphg.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_IVdSBILj_etRSNF48ig1PA_sBAt23NG';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 1. ฟังก์ชันโหลดข้อมูลพื้นที่จาก Database มาแสดงในตาราง
    async function loadAreaList() {
        const tbody = document.getElementById('areaTableBody');
        
        try {
            const { data, error } = await supabaseClient
                .from('table_area_master')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (data && data.length > 0) {
                tbody.innerHTML = ''; // ล้างข้อมูลเดิม
                data.forEach(area => {
                    // กำหนดสีของ Badge ตามระดับเขตพื้นที่
                    let badgeClass = 'bg-success';
                    if (area.work_zone === 'เขตอันตราย') badgeClass = 'bg-danger';
                    if (area.work_zone === 'เขตควบคุม') badgeClass = 'bg-warning';

                    const row = `
                        <tr>
                            <td><strong>${area.area_id}</strong></td>
                            <td>${area.project_name}</td>
                            <td>${area.pm_name}</td>
                            <td><span class="badge ${badgeClass}">${area.work_zone}</span></td>
                            <td class="status-active">Active</td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">ยังไม่มีข้อมูลพื้นที่ในระบบ</td></tr>';
            }
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">โหลดข้อมูลล้มเหลว: ${error.message}</td></tr>`;
        }
    }

    // 2. ฟังก์ชันบันทึกข้อมูลพื้นที่ใหม่ลง Database
    async function submitAreaMaster(event) {
        event.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; 
        btn.innerHTML = '⏳ กำลังบันทึกข้อมูลเข้าสู่ฐานข้อมูล...';

        const areaData = {
            area_id: document.getElementById('areaId').value,
            project_name: document.getElementById('projectName').value,
            pm_name: document.getElementById('pmName').value,
            work_zone: document.getElementById('workZone').value,
            status: 'Active'
        };

        try {
            const { error } = await supabaseClient
                .from('table_area_master')
                .insert([areaData]);

            if (error) throw error;

            alert(`✅ สร้างพื้นที่ ${areaData.area_id} สำเร็จ!\nฝ่ายงบประมาณสามารถเลือกพื้นที่นี้ในการทำสัญญาได้ทันที`);
            
            // ล้างฟอร์มและโหลดตารางใหม่
            document.getElementById('areaForm').reset();
            loadAreaList();

        } catch (error) {
            alert(`❌ ไม่สามารถบันทึกข้อมูลได้: ${error.message}\n(ตรวจสอบว่ารหัสพื้นที่ซ้ำหรือไม่)`);
        } finally {
            btn.disabled = false; 
            btn.innerHTML = 'บันทึกข้อมูลและเปิดใช้งานพื้นที่';
        }
    }

    // เรียกใช้งานโหลดข้อมูลทันทีที่เปิดหน้าเว็บ
    window.onload = loadAreaList;
</script>
</body>
</html>
