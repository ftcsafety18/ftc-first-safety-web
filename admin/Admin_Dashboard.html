const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* ---------------------- เข้าสู่ระบบ ---------------------- */
async function doLogin() {
  const email = document.getElementById('log-email').value.trim();
  const pass  = document.getElementById('log-pass').value;
  const err   = document.getElementById('log-err');
  const btn   = document.getElementById('btn-login');
  err.classList.add('hidden');
  if (!email || !pass) { err.textContent='กรอกอีเมลและรหัสผ่านให้ครบ'; err.classList.remove('hidden'); return; }
  btn.disabled = true; btn.textContent='กำลังตรวจสอบ…';
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent='เข้าสู่ระบบ';
  if (error) { err.textContent='อีเมลหรือรหัสผ่านไม่ถูกต้อง'; err.classList.remove('hidden'); return; }
  await enterApp();
}
async function doLogout() { await sb.auth.signOut(); FTC.clearProject(); location.reload(); }

async function openForgot() {
  const { value: email } = await Swal.fire({
    title: 'ลืมรหัสผ่าน',
    html: '<p style="font-size:.85rem;color:#64748B;margin-bottom:.75rem">กรอกอีเมลที่ใช้เข้าสู่ระบบ ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้</p>',
    input: 'email', inputPlaceholder: 'name@company.co.th',
    inputValue: (document.getElementById('log-email') || {}).value || '',
    showCancelButton: true, confirmButtonText: 'ส่งลิงก์', cancelButtonText: 'ยกเลิก',
    confirmButtonColor: '#19335A',
    inputValidator: v => (!v || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())) ? 'กรอกอีเมลให้ถูกรูปแบบ' : undefined
  });
  if (!email) return;
  Swal.fire({ title:'กำลังส่ง…', allowOutsideClick:false, didOpen:()=>Swal.showLoading() });
  const { error } = await sb.auth.resetPasswordForEmail(email.trim(),
    { redirectTo: window.location.origin + window.location.pathname });
  Swal.close();
  await new Promise(r => setTimeout(r, 250));
  if (error) console.error('[FTC] resetPasswordForEmail', error);
  Swal.fire({ icon:'success', title:'ส่งลิงก์แล้ว',
    html:'ถ้าอีเมลนี้มีบัญชีอยู่ในระบบ จะได้รับลิงก์ตั้งรหัสผ่านใหม่ภายในไม่กี่นาที',
    confirmButtonColor:'#19335A' });
}

async function enterApp() {
  const { data } = await sb.auth.getUser();
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').textContent = (data && data.user ? data.user.email : '') + ' · FTC First Safety';
  renderMenu();
  await Promise.all([loadProjects(), loadKpi()]);
}

/* ---------------------- โครงการที่กำลังทำงาน ---------------------- */
async function loadProjects() {
  const r = await sb.from('tb_projects')
    .select('project_id, project_name, status').order('created_at', { ascending:false });
  if (r.error) { console.error('[FTC] โหลดโครงการไม่สำเร็จ', r.error); return; }
  PROJECTS = r.data || [];

  const sel = document.getElementById('proj-select');
  sel.innerHTML = PROJECTS.length
    ? PROJECTS.map(p => `<option value="${esc(p.project_id)}">${esc(p.project_name)}` +
        `${p.status !== 'Active' ? ' (ยังไม่เปิดใช้งาน)' : ''}</option>`).join('')
    : '<option value="">-- ยังไม่มีโครงการ กรุณาสร้างที่หน้าตั้งค่าโครงการ --</option>';

  if (PROJECTS.length) {
    const pick = FTC.pickProject(PROJECTS);
    sel.value = pick;
    onProjectChange(pick);
  }
}

function onProjectChange(id) {
  const p = PROJECTS.find(x => x.project_id === id);
  if (p) FTC.setProject(p.project_id, p.project_name);
}

/* ---------------------- ตัวเลขสรุป ---------------------- */

    const [permits, pending, workers] = await Promise.all([
      sb.from('tb_work_permits').select('ptw_id', { count:'exact', head:true }).eq('status','Approved'),
      sb.from('tb_work_permits').select('ptw_id', { count:'exact', head:true }).eq('status','Pending'),
      sb.from('tb_workers').select('worker_id', { count:'exact', head:true })
    ]);

    document.getElementById('kpi-permits').textContent = permits.count != null ? permits.count : '—';
    document.getElementById('kpi-pending').textContent = pending.count != null ? pending.count : '—';
    document.getElementById('notif-dot').classList.toggle('hidden', !(pending.count > 0));

    // ชั่วโมงทำงานปลอดภัยยังไม่มีข้อมูลจริง จนกว่าระบบสแกนเข้า-ออกจะเปิดใช้งาน
    // จึงแสดงเป็นจำนวนคนงานในระบบไปก่อน ไม่ใส่ตัวเลขสมมติเพราะจะเข้าใจผิดว่าเป็นของจริง
    document.getElementById('kpi-hours').textContent = workers.count != null ? workers.count : '—';
    document.querySelector('#kpi-hours + p').textContent = 'คนงานในระบบ';
  } catch (e) {
    console.error('[FTC] โหลดตัวเลขสรุปไม่สำเร็จ', e);
  }
}

/* ---------------------- เมนู ---------------------- */
function renderMenu() {
  document.getElementById('menu-root').innerHTML = MENU.map((g, gi) => {
    const items = g.items.map(it => {
      const ready = !!it.href;
      const inner = `
        <div class="flex items-center gap-3 px-4 py-3">
          <div class="flex size-9 shrink-0 items-center justify-center rounded-lg ${ready ? 'bg-slate-100 text-brand-navy' : 'bg-slate-50 text-slate-300'}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          </div>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-semibold ${ready ? 'text-slate-800' : 'text-slate-400'}">${esc(it.th)}</p>
            <p class="text-[11px] ${ready ? 'text-slate-400' : 'text-slate-300'}">${esc(it.en)}</p>
          </div>
          ${ready
            ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0 text-slate-300"><path d="m9 18 6-6-6-6"/></svg>'
            : '<span class="shrink-0 rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-semibold text-slate-400">เร็วๆ นี้</span>'}
        </div>`;
      return ready
        ? `<a href="${it.href}" class="block border-t border-slate-100 transition hover:bg-slate-50">${inner}</a>`
        : `<button type="button" onclick="comingSoon('${esc(it.th)}')" class="block w-full border-t border-slate-100 text-left">${inner}</button>`;
    }).join('');

    const readyCount = g.items.filter(i => i.href).length;

    return `
      <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <button type="button" onclick="toggleGroup(${gi})"
          class="flex w-full items-center gap-3 px-4 py-3.5 text-left transition hover:bg-slate-50">
          <div class="flex size-11 shrink-0 items-center justify-center rounded-xl bg-brand-navy text-white">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${g.icon}"/></svg>
          </div>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-bold text-slate-800">
              <span class="text-brand-orange">${g.no}</span> ${esc(g.title)}
            </p>
            <p class="text-[11px] text-slate-500">${esc(g.sub)}
              <span class="ml-1 text-slate-400">· พร้อมใช้งาน ${readyCount}/${g.items.length}</span></p>
          </div>
          <svg id="chev-${gi}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               class="shrink-0 text-slate-400 transition-transform ${g.open ? 'rotate-180' : ''}"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="grp-${gi}" class="grp-body" style="max-height:${g.open ? '600px' : '0'}">${items}</div>
      </section>`;
  }).join('');
}

function toggleGroup(i) {
  const body = document.getElementById('grp-' + i);
  const chev = document.getElementById('chev-' + i);
  const open = body.style.maxHeight !== '0px' && body.style.maxHeight !== '0';
  body.style.maxHeight = open ? '0' : '600px';
  chev.classList.toggle('rotate-180', !open);
}

function comingSoon(name) {
  Swal.fire({
    icon: 'info', title: name,
    html: 'โมดูลนี้อยู่ระหว่างพัฒนา ยังไม่เปิดใช้งาน<br>' +
          '<span style="font-size:.8rem;color:#64748B">เมนูที่พร้อมใช้งานแล้วจะมีลูกศรทางขวา</span>',
    confirmButtonColor: '#19335A'
  });
}

window.addEventListener('unhandledrejection', ev => {
  console.error('[FTC] promise ที่ไม่มีใครดัก', ev.reason);
});

(async function init() {
  const { data } = await sb.auth.getSession();
  if (data && data.session) await enterApp();
})();
</script>
</body>
</html>
