<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรับรองการเข้าปฏิบัติงานสำหรับนายจ้าง - FTC Digital Safety</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #e2e8f0; margin: 0; padding: 20px; color: #2d3748; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background-color: #2b6cb0; color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header-left h2 { margin: 0; font-size: 22px; }
        .header-left p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }
        .header-right { font-size: 14px; text-align: right; }
        .header-right strong { font-size: 16px; color: #ebf8ff; }
        .content-section { padding: 30px; }
        .section-title { font-size: 18px; font-weight: 600; color: #2b6cb0; margin-bottom: 15px; border-left: 4px solid #2b6cb0; padding-left: 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background-color: #f7fafc; font-weight: 600; color: #4a5568; }
        td.text-center { text-align: center; }
        .badge-pending { background-color: #feebc8; color: #c05621; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .btn-view-doc { background-color: #edf2f7; border: 1px solid #cbd5e0; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-bottom: 4px;}
        .verify-checkbox { transform: scale(1.3); cursor: pointer; }
        .consent-box { display: flex; gap: 15px; background: #fff5f5; padding: 20px; border-radius: 6px; border-left: 5px solid #e53e3e; margin-top: 30px; margin-bottom: 20px; align-items: flex-start; }
        .consent-box input { margin-top: 5px; transform: scale(1.5); cursor: pointer; }
        .consent-text { font-size: 14px; line-height: 1.6; margin: 0; }
        .btn-submit { background-color: #3182ce; color: white; border: none; padding: 15px 30px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px; width: 100%; transition: 0.3s; }
        .btn-submit:hover { background-color: #2b6cb0; }
        .btn-submit:disabled { background-color: #a0aec0; cursor: not-allowed; }
        .loading-text { text-align: center; color: #718096; font-weight: 600; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-left">
            <h2>ระบบรับรองการเข้าปฏิบัติงานสำหรับนายจ้าง</h2>
            <p>Contractor Verification Portal - FTC Digital Safety</p>
        </div>
        <div class="header-right">
            <span>เข้าสู่ระบบโดย:</span><br>
            <strong id="displayVendorName">TesCompany</strong><br>
            <span id="displayVendorId">รหัส: VEN001</span>
        </div>
    </div>

    <form id="vendorVerifyForm" class="content-section" onsubmit="submitVerification(event)">
        <div class="section-title">รายชื่อพนักงานที่รอการรับรอง (Pending Verification)</div>
        <table>
            <thead>
                <tr>
                    <th width="5%" class="text-center">ลำดับ</th>
                    <th width="25%">ชื่อ-นามสกุล</th>
                    <th width="20%">เลขบัตรอ้างอิง</th>
                    <th width="15%" class="text-center">สถานะ</th>
                    <th width="15%" class="text-center">รับรอง (Verify)</th>
                </tr>
            </thead>
            <tbody id="workerTableBody">
                <tr><td colspan="5" class="loading-text">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>

        <div class="consent-box">
            <input type="checkbox" id="vendorSafetyCheck" required onchange="checkApprovalStatus()">
            <label class="consent-text" for="vendorSafetyCheck" style="color: #c53030;">
                <strong>คำรับรองด้านความปลอดภัยสำหรับผู้รับเหมา (Contractor Safety Declaration):</strong><br>
                ข้าพเจ้ายืนยันว่าได้ศึกษาและทำความเข้าใจ "ข้อปฏิบัติความปลอดภัย" และยินดีรับผิดชอบร่วมกับลูกจ้างทุกประการ
            </label>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit" disabled>
            ยืนยันการรับรองและส่งให้ FTC ตรวจสอบ (Submit to FTC)
        </button>
    </form>
</div>

<script>
    async function fetchPendingWorkers() {
        const tableBody = document.getElementById('workerTableBody');
        try {
            // ดึงข้อมูลทั้งสถานะ Pending (รอตรวจ) และ Rejected (ถูกตีกลับ)
            const { data: workers, error } = await supabaseClient
                .from('table_users')
                .select('citizen_id, full_name, vendor_verified_status, reject_reason')
                .eq('vendor_id', CURRENT_VENDOR_ID)
                .in('vendor_verified_status', ['Pending', 'Rejected']);

            if (error) throw error;
            tableBody.innerHTML = '';

            if (!workers || workers.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="text-center" style="color: green;">🎉 ไม่มีพนักงานที่รอการตรวจสอบ หรือถูกตีกลับ</td></tr>';
                return;
            }

            workers.forEach((worker, index) => {
                // ตรวจสอบว่าถูกตีกลับหรือเปล่า
                const isRejected = worker.vendor_verified_status === 'Rejected';
                
                // ตกแต่งสถานะ
                const statusBadge = isRejected 
                    ? `<span style="background-color: #fed7d7; color: #c53030; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">❌ ถูกตีกลับ</span><br><span style="font-size: 11px; color: #e53e3e; display:block; margin-top:4px;">เหตุผล: ${worker.reject_reason || 'ไม่ระบุ'}</span>`
                    : `<span class="badge-pending">รอตรวจสอบ</span>`;

                const rowHtml = `
                    <tr style="${isRejected ? 'background-color: #fff5f5;' : ''}">
                        <td class="text-center">${index + 1}</td>
                        <td>${worker.full_name}</td>
                        <td><span style="font-size: 12px; color: #718096;">${worker.citizen_id}</span></td>
                        <td class="text-center">${statusBadge}</td>
                        <td class="text-center">
                            <!-- ถ้าถูกตีกลับ ให้เลือกรับรองใหม่ได้ -->
                            <input type="checkbox" class="verify-checkbox worker-check" value="${worker.citizen_id}" onchange="checkApprovalStatus()">
                        </td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML('beforeend', rowHtml);
            });
        } catch (error) {
            tableBody.innerHTML = `<tr><td colspan="5" class="text-center" style="color: red;">❌ ดึงข้อมูลไม่สำเร็จ: ${error.message}</td></tr>`;
        }
    }
</script>

</body>
</html>
