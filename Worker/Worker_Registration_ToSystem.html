<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC First Safety - WebRTC Demo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { navy: '#19335A', orange: '#DB5A24', 'navy-light': '#254B82', 'orange-hover': '#C14B1A' } }, fontFamily: { sans: ['Sarabun', 'sans-serif'], } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F4F6F8; }
        .input-field { width: 100%; padding: 0.6rem 0.75rem; border-radius: 0.5rem; border: 1px solid #D1D5DB; background-color: #F9FAFB; font-size: 0.875rem; color: #1F2937; transition: all 0.2s; }
        .input-field:focus { outline: none; border-color: #19335A; background-color: #FFFFFF; box-shadow: 0 0 0 3px rgba(25, 51, 90, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* สไตล์สำหรับกล้อง WebRTC */
        #live-video { width: 100%; border-radius: 0.5rem; background-color: #000; object-fit: cover; max-height: 300px; }
    </style>
</head>
<body class="min-h-screen text-gray-800">

    <header class="sticky top-0 z-40 bg-brand-navy shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <div>
                    <h1 class="text-[13px] sm:text-base font-bold text-white leading-tight">FTC First Safety (WebRTC Demo)</h1>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-6 pb-12">
        
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 sm:p-8">
            
            <!-- ================= STEP 2 (ทดสอบฝัง WebRTC) ================= -->
            <div id="step-2" class="block">
                <div class="rounded-xl bg-gray-50 border border-gray-200 p-4 mb-6 flex items-start gap-3">
                    <div class="w-7 h-7 rounded-full bg-brand-orange flex items-center justify-center text-white text-xs font-bold shrink-0 mt-0.5">2</div>
                    <div>
                        <p class="text-sm font-bold text-brand-navy">สาธิตการฝัง WebRTC</p>
                        <p class="text-xs text-gray-500 mt-0.5">ระบบดึงภาพจากกล้องมาแสดงบนหน้าเว็บโดยตรง (ไม่ต้องผ่านแอปกล้องมือถือ)</p>
                    </div>
                </div>

                <!-- พื้นที่ WebRTC Dropzone -->
                <div class="mb-6">
                    <label id="upload-label" class="block text-sm font-semibold text-gray-800 mb-2">อัปโหลดสำเนาบัตรประชาชน (ID Card Copy) <span class="text-red-500">*</span></label>
                    <div id="dropzone-main" class="relative flex flex-col items-center justify-center gap-4 rounded-2xl border-2 border-dashed border-brand-navy/30 bg-blue-50/50 px-4 py-8 text-center transition-colors">
                        
                        <!-- ซ่อน/แสดง กล้องวิดีโอ -->
                        <video id="live-video" class="hidden" autoplay playsinline></video>
                        <canvas id="snapshot-canvas" class="hidden"></canvas>

                        <div class="w-full max-w-xs flex flex-col gap-2">
                            <!-- ปุ่มเปิดกล้อง WebRTC -->
                            <button type="button" id="btn-start-cam" onclick="startWebRTC()" class="px-6 py-4 bg-brand-navy text-white text-sm font-bold rounded-xl shadow-md hover:bg-brand-navy-light flex items-center gap-2 w-full justify-center transition-all active:scale-95">
                                <i data-lucide="camera" class="w-5 h-5"></i>
                                เปิดกล้องหน้าเว็บ (WebRTC)
                            </button>

                            <!-- ปุ่มจับภาพ (จะแสดงตอนกล้องเปิดแล้ว) -->
                            <button type="button" id="btn-snap" onclick="takeSnapshot()" class="hidden px-6 py-4 bg-brand-orange text-white text-sm font-bold rounded-xl shadow-md hover:bg-brand-orange-hover flex items-center gap-2 w-full justify-center transition-all active:scale-95">
                                <i data-lucide="scan" class="w-5 h-5"></i>
                                📸 ถ่ายภาพ (Snap)
                            </button>

                            <!-- อินพุตรับไฟล์ไว้แนบขึ้น Supabase -->
                            <input type="file" id="file-main-upload" class="hidden" accept="image/*" onchange="updateFileUI('main', this)">
                        </div>
                        <p id="text-main" class="text-xs text-brand-orange mt-2 font-bold"></p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        window.addEventListener('load', function() {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });

        // ==========================================
        // 💡 ชุดคำสั่ง WebRTC (ฝังในหน้าเว็บ)
        // ==========================================
        let currentStream = null;

        // ฟังก์ชันขออนุญาตเปิดกล้อง
        async function startWebRTC() {
            try {
                // ขอเข้าถึงกล้อง (facingMode: 'environment' คือขอกล้องหลัง)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                
                currentStream = stream;
                
                // เอาภาพวิดีโอไปฉายในแท็ก <video>
                const videoElement = document.getElementById('live-video');
                videoElement.srcObject = stream;
                
                // สลับปุ่มและโชว์จอวิดีโอ
                videoElement.classList.remove('hidden');
                document.getElementById('btn-snap').classList.remove('hidden');
                document.getElementById('btn-start-cam').classList.add('hidden');
                
            } catch (err) {
                console.error("WebRTC Error:", err);
                Swal.fire('ไม่สามารถเปิดกล้องได้', 'เบราว์เซอร์หรือมือถือของคุณไม่อนุญาตให้ใช้กล้อง (Permission Denied)', 'error');
            }
        }

        // ฟังก์ชันแชะภาพ (แคปหน้าจอวิดีโอ)
        function takeSnapshot() {
            if(!currentStream) return;
            
            const video = document.getElementById('live-video');
            const canvas = document.getElementById('snapshot-canvas');
            
            // วาดภาพจากวิดีโอลงบน Canvas
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            // แปลงภาพบน Canvas ให้กลายเป็นไฟล์ .jpg
            canvas.toBlob((blob) => {
                const file = new File([blob], "FTC_WebRTC_Snapshot_" + Date.now() + ".jpg", { type: "image/jpeg" });
                
                // ยัดไฟล์ที่ได้ ลงไปในช่อง <input type="file"> เพื่อหลอกฟอร์มว่าเราเลือกไฟล์มาแล้ว
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                
                const inputElement = document.getElementById('file-main-upload');
                inputElement.files = dataTransfer.files;
                
                // อัปเดตหน้าจอว่ารับไฟล์สำเร็จ
                updateFileUI('main', inputElement);
                
                // ปิดการใช้งานกล้อง เพื่อประหยัดแบตเตอรี่
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
                
                // คืนสภาพปุ่มกลับเป็นเหมือนเดิม
                video.classList.add('hidden');
                document.getElementById('btn-snap').classList.add('hidden');
                document.getElementById('btn-start-cam').classList.remove('hidden');
                document.getElementById('btn-start-cam').innerHTML = '<i data-lucide="camera" class="w-5 h-5"></i> ถ่ายภาพใหม่ (Retake)';
                lucide.createIcons();
                
            }, 'image/jpeg', 0.8);
        }

        // อัปเดตข้อความเมื่อถ่ายเสร็จ
        function updateFileUI(type, inputElement) {
            var textElement = document.getElementById('text-' + type);
            var dropzone = document.getElementById('dropzone-' + type);
            
            if(inputElement.files.length > 0) {
                var fileName = inputElement.files[0].name;
                textElement.innerHTML = "✅ แคปภาพสำเร็จ: <span class='text-brand-navy'>" + fileName + "</span>";
                dropzone.classList.add('border-green-500', 'bg-green-50');
            }
        }
    </script>
</body>
</html>
