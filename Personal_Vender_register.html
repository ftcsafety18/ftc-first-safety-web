<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขึ้นทะเบียนผู้รับเหมา (บุคคลธรรมดา) - FTC Safety</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #e2e8f0; margin: 0; padding: 20px; color: #2d3748; }
        .container { max-width: 850px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background-color: #2b6cb0; color: white; padding: 20px; text-align: center; }
        .header h2 { margin: 0; font-size: 24px; }
        .form-section { padding: 25px; border-bottom: 1px solid #e2e8f0; }
        .section-title { font-size: 18px; font-weight: 600; color: #2b6cb0; margin-bottom: 15px; border-left: 4px solid #2b6cb0; padding-left: 10px; }
        .form-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 250px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input[type="text"], input[type="tel"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        .upload-box { background: #f7fafc; border: 1px dashed #a0aec0; padding: 15px; border-radius: 6px; margin-bottom: 10px; }
        .upload-label { font-weight: 600; color: #2d3748; display: block; }
        .consent-box { background: #fff0f2; padding: 15px; border-radius: 4px; border-left: 4px solid #e53e3e; margin-bottom: 15px; display: flex; gap: 10px; }
        .btn-submit { background-color: #3182ce; color: white; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 16px; width: 100%; }
        .btn-submit:hover { background-color: #2b6cb0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>ระบบขึ้นทะเบียนผู้รับเหมา (บุคคลธรรมดา/เถ้าแก่)</h2>
        <p>FTC Digital Safety Transformation</p>
    </div>

    <form id="vendorRegistryForm" onsubmit="submitVendorForm(event)">
        <div class="form-section">
            <div class="section-title">1. ข้อมูลผู้รับจ้าง</div>
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label>ชื่อ-นามสกุล เถ้าแก่ / ผู้รับเหมา *</label>
                    <input type="text" id="companyName" required placeholder="นายสมชาย รักความปลอดภัย">
                </div>
                <div class="form-group">
                    <label>เลขประจำตัวประชาชน (13 หลัก) *</label>
                    <input type="text" id="taxId" required maxlength="13" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
            </div>
        </div>

        <div class="form-section" style="background-color: #f8fafc;">
            <div class="section-title" style="border-left-color: #38a169;">2. ข้อมูลสัญญา และการติดต่อ</div>
            <div class="form-row">
                <div class="form-group">
                    <label>เลขที่สัญญา / ใบสั่งจ้าง (PO) *</label>
                    <input type="text" id="contractNo" required>
                </div>
                <div class="form-group">
                    <label>พื้นที่ปฏิบัติงาน (Area) *</label>
                    <input type="text" id="projectName" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>ชื่อผู้ควบคุมงานหน้างาน *</label>
                    <input type="text" id="contactName" required>
                </div>
                <div class="form-group">
                    <label>เบอร์โทรศัพท์ *</label>
                    <input type="tel" id="contactPhone" required maxlength="10">
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="section-title" style="border-left-color: #d69e2e;">3. เอกสารประกอบ (อัปโหลด)</div>
            <div class="upload-box">
                <span class="upload-label">1. สำเนาสัญญาจ้าง / ใบสั่งจ้าง (PO) *</span>
                <input type="file" id="fileContract" accept=".pdf,image/*" required>
            </div>
            <div class="upload-box">
                <span class="upload-label">2. กรมธรรม์ประกันอุบัติเหตุ (Group PA) *</span>
                <input type="file" id="fileInsurance" accept=".pdf,image/*" required>
            </div>
            <div class="upload-box">
                <span class="upload-label">3. หนังสือข้อตกลงด้านความปลอดภัย (Signed) *</span>
                <input type="file" id="fileSafetyAgreement" accept=".pdf,image/*" required>
            </div>
        </div>

        <div class="form-section">
            <div class="consent-box">
                <input type="checkbox" id="legalConsent" required style="transform: scale(1.5);">
                <label for="legalConsent" style="margin-left: 10px;">
                    ข้าพเจ้ายอมรับว่าการเข้าปฏิบัติงานเป็นรูปแบบ "สัญญาจ้างทำของ" ข้าพเจ้ามีหน้าที่ดูแลลูกจ้างตามกฎหมายความปลอดภัย หากเกิดอุบัติเหตุ ข้าพเจ้าจะเป็นผู้รับผิดชอบตามกฎหมายแต่เพียงผู้เดียว
                </label>
            </div>
            <button type="submit" class="btn-submit">ลงทะเบียนและส่งข้อมูล</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ตั้งค่า Supabase
    const SUPABASE_URL = 'https://ancwqgaaqliandzdzphg.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_IVdSBILj_etRSNF48ig1PA_sBAt23NG'; // รบกวนพี่ณัฐธัญตรวจสอบคีย์นี้อีกครั้งก่อนใช้งานจริงนะครับ
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function submitVendorForm(event) {
        event.preventDefault();
        const submitBtn = document.querySelector('.btn-submit');
        submitBtn.disabled = true; submitBtn.innerHTML = '⏳ กำลังบันทึกข้อมูล...';

        try {
            const generatedVendorId = 'VEN-' + Date.now().toString().slice(-6);
            let documentUrls = {};
            const files = [
                { id: 'fileContract', folder: 'contracts' },
                { id: 'fileInsurance', folder: 'insurance' },
                { id: 'fileSafetyAgreement', folder: 'safety' }
            ];

            // อัปโหลดไฟล์ทีละรายการ
            for (let f of files) {
                const file = document.getElementById(f.id).files[0];
                if (file) {
                    const fileName = `${generatedVendorId}_${Date.now()}.${file.name.split('.').pop()}`;
                    const { error: uploadErr } = await supabaseClient.storage.from('vendor-documents').upload(`${f.folder}/${fileName}`, file);
                    if (uploadErr) throw uploadErr;
                    
                    const { data } = supabaseClient.storage.from('vendor-documents').getPublicUrl(`${f.folder}/${fileName}`);
                    documentUrls[f.folder] = data.publicUrl;
                }
            }

            // จัดเตรียม JSON เอกสาร
            const documentData = {
                contract_url: documentUrls['contracts'] || null,
                insurance_url: documentUrls['insurance'] || null,
                safety_agreement_url: documentUrls['safety'] || null
            };

            // บันทึกเข้าตารางหลัก
            const { error: insertError } = await supabaseClient.from('table_vendors').insert([{
                vendor_id: generatedVendorId,
                vendor_name: document.getElementById('companyName').value,
                tax_id: document.getElementById('taxId').value,
                entity_type: 'Individual', // เถ้าแก่/บุคคลธรรมดา
                contract_no: document.getElementById('contractNo').value,
                project_name: document.getElementById('projectName').value,
                contact_name: document.getElementById('contactName').value,
                contact_phone: document.getElementById('contactPhone').value,
                verification_status: 'Pending',
                vendor_documents: documentData,
                safety_rules_accepted: document.getElementById('legalConsent').checked,
                safety_rules_accepted_at: new Date().toISOString(),
                safety_rules_accepted_by: document.getElementById('contactName').value
            }]);

            if (insertError) throw insertError;
            alert(`✅ ลงทะเบียนสำเร็จ! รหัสของท่านคือ: ${generatedVendorId}\nรอเจ้าหน้าที่ตรวจสอบเอกสารครับ`);
            window.location.reload();

        } catch (error) {
            alert("❌ เกิดข้อผิดพลาด: " + error.message);
        } finally {
            submitBtn.disabled = false; submitBtn.innerHTML = 'ลงทะเบียนและส่งข้อมูล';
        }
    }
</script>
</body>
</html>
