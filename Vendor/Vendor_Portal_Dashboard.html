              <path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>

<script>
/* =====================================================================
 * ศูนย์บริหารงานผู้รับเหมา — หน้าจอ Dashboard
 *
 * ⚠️ ขั้นนี้เป็นงานหน้าตาอย่างเดียว ยังไม่ต่อฐานข้อมูลตามที่ตกลงกันไว้
 *
 * ตัวเลขและชื่อบริษัทที่เห็นเป็นค่าตัวอย่างในไฟล์ HTML โดยตรง
 * เมื่อถึงขั้นต่อข้อมูลจริง ให้แทนที่ด้วยการอ่านจาก
 *   ชื่อบริษัท   → tb_vendors ผ่าน LINE UID ของผู้ใช้ที่ผูกบัญชีไว้
 *   งานรอดำเนินการ → tb_workers ที่ badge_status = 'Pending' ของ vendor นี้
 *   ใบสั่งแก้ไข   → tb_ncr_tickets ที่ยังไม่ปิด
 *   กำลังคนวันนี้  → tb_access_logs ของวันนี้ที่ยังไม่เช็กเอาต์
 * ===================================================================== */

/* ---------------------- แถบล่าง ---------------------- */
const NAV_ON  = 'nav-item flex flex-1 flex-col items-center gap-1 py-1 text-brand-navy';
const NAV_OFF = 'nav-item flex flex-1 flex-col items-center gap-1 py-1 text-slate-400';

function setTab(name) {
  document.querySelectorAll('.nav-item').forEach(el => {
    const on = el.dataset.nav === name;
    // ปุ่มแจ้งเตือนมี class relative เพิ่มเพราะต้องวางจุดแดงทับ
    el.className = (on ? NAV_ON : NAV_OFF) + (el.dataset.nav === 'notify' ? ' relative' : '');
  });
  if (name !== 'menu') comingSoon(({
    notify:'แจ้งเตือน', docs:'เอกสาร', profile:'โปรไฟล์'
  })[name]);
}

/* ---------------------- เมนู ---------------------- */
const SCREEN_NAME = {
  'worker-verify':'ยืนยันทะเบียนพนักงาน',
  'ptw-request':'จัดการคำขอใบอนุญาตทำงาน',
  'defect':'ตรวจสอบและส่งผลการแก้ไข',
  'progress':'อัปเดตความก้าวหน้าโครงการ',
  'scan':'สแกน QR'
};

/** หน้าจอที่ทำเสร็จแล้วให้เปิดจริง ส่วนที่ยังไม่มีให้ขึ้นข้อความแจ้ง */
const SCREEN_URL = {
  'worker-verify': 'Vendor_Worker_Register.html',
  'ptw-request':   'Vendor_PTW_Request.html'
};

function goto(key) {
  const url = SCREEN_URL[key];
  if (url) { window.location.href = url; return; }
  comingSoon(SCREEN_NAME[key] || key);
}

function comingSoon(name) {
  const box = document.getElementById('toast');
  box.textContent = name + ' — หน้าจอนี้อยู่ระหว่างพัฒนา';
  box.classList.remove('opacity-0', 'translate-y-3');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => {
    box.classList.add('opacity-0', 'translate-y-3');
  }, 2200);
}

/**
 * ปิดหน้าต่าง
 * เมื่อเปิดในแอป LINE จะสั่งปิดผ่าน LIFF ได้
 * แต่ตอนนี้ยังไม่ได้ต่อ LIFF จึงถอยไปใช้การปิดแท็บหรือย้อนกลับแทน
 */
function closePortal() {
  try {
    if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
      liff.closeWindow();
      return;
    }
  } catch (e) { /* ไม่ได้อยู่ในแอป LINE */ }

  if (history.length > 1) history.back();
  else comingSoon('ปิดหน้าต่าง');
}

setTab('menu');

/* ---------------------- ดึงข้อมูลจริงผ่าน Edge Function ---------------------- */
/**
 * หน้านี้ไม่เรียกฐานข้อมูลตรง แต่เรียกผ่าน Edge Function เสมอ
 * เพราะ anon key พิสูจน์ไม่ได้ว่าผู้ใช้เป็นผู้รับเหมารายไหน
 * เซิร์ฟเวอร์จะตรวจ LINE ID Token แล้วตอบเฉพาะข้อมูลของบริษัทนั้น
 */
async function loadPortal() {
  try {
    const vendor = await VendorAPI.me();
    document.getElementById('vendor-name').textContent = vendor.vendor_name;

    const r = await VendorAPI.call('dashboard');
    const s = r.stats;
    document.getElementById('stat-tasks').textContent     = s.pending_tasks;
    document.getElementById('stat-defect').textContent    = s.open_defects;
    document.getElementById('stat-headcount').textContent = s.headcount_today;

    // ป้ายนับจำนวนในเมนู
    setBadge('badge-worker', s.pending_workers);
    setBadge('badge-ptw', s.pending_permits);

    // จุดแดงบนกระดิ่งขึ้นเฉพาะเมื่อมีงานค้างจริง
    document.querySelector('[data-nav="notify"] span span')
      .classList.toggle('hidden', (s.pending_tasks + s.open_defects) === 0);

  } catch (err) {
    console.error('[FTC] โหลดข้อมูลไม่สำเร็จ', err);

    if (err.code === 'NOT_LINKED') {
      showBlocked('บัญชี LINE ยังไม่ได้ผูกกับบริษัท',
        'กรุณาติดต่อเจ้าหน้าที่ FTC เพื่อผูกบัญชี LINE ของท่านกับทะเบียนผู้รับเหมาก่อนใช้งาน');
    } else if (err.code === 'BLACKLISTED') {
      showBlocked('บริษัทถูกระงับสิทธิ์การใช้งาน',
        'กรุณาติดต่อเจ้าหน้าที่ FTC เพื่อตรวจสอบสถานะ');
    } else {
      document.getElementById('vendor-name').textContent = 'เชื่อมต่อไม่สำเร็จ';
      ['stat-tasks','stat-defect','stat-headcount'].forEach(id => {
        document.getElementById(id).textContent = '—';
      });
      toastMsg(err.message || 'เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่');
    }
  }
}

function setBadge(id, n) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = n + ' รายการ';
  el.classList.toggle('hidden', !n);
}

/** ปิดหน้าจอเมื่อผู้ใช้ไม่มีสิทธิ์เข้าถึง แทนการแสดงข้อมูลว่างเปล่าให้สับสน */
function showBlocked(title, detail) {
  document.querySelector('main').innerHTML =
    '<div class="rounded-2xl bg-white p-8 text-center shadow-sm">' +
      '<div class="mx-auto mb-4 flex size-16 items-center justify-center rounded-full bg-amber-50 text-amber-500">' +
        '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>' +
      '</div>' +
      '<p class="text-base font-bold text-brand-navy">' + title + '</p>' +
      '<p class="mx-auto mt-2 max-w-xs text-sm leading-relaxed text-slate-500">' + detail + '</p>' +
    '</div>';
  document.querySelector('section.-mt-14').classList.add('hidden');
}

function toastMsg(m) { comingSoon(m); }

loadPortal();
</script>

<!-- ข้อความแจ้งชั่วคราว วางไว้ท้ายสุดเพื่อให้ลอยอยู่เหนือทุกอย่าง -->
<div id="toast"
  class="pointer-events-none fixed bottom-28 left-1/2 z-50 w-[86%] max-w-sm -translate-x-1/2 translate-y-3 rounded-xl bg-brand-navy/95 px-4 py-3 text-center text-sm font-medium text-white opacity-0 shadow-xl transition-all duration-200"></div>

</body>
</html>
