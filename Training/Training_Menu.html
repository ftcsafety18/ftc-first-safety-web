<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC E-Training System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { background-color: #F4F6F8; font-family: sans-serif; }</style>
</head>
<body class="p-4 sm:p-6 max-w-3xl mx-auto">
    <div class="mb-6 flex items-center gap-3">
        <button onclick="window.location.href='index.html'" class="p-2 bg-white rounded-lg shadow-sm"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
        <h1 class="text-xl font-bold text-[#19335A]">ระบบฝึกอบรมความปลอดภัย</h1>
    </div>

    <div class="grid grid-cols-1 gap-4">
        <!-- Course 1 -->
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center"><i data-lucide="shield" class="text-blue-600"></i></div>
                <div>
                    <h2 class="font-bold text-[#19335A]">ความปลอดภัยพื้นฐาน (Basic Safety)</h2>
                    <p class="text-xs text-gray-500 mt-1">ข้อสอบ 10 ข้อ • มีการถ่ายภาพยืนยันตัวตน</p>
                </div>
            </div>
            <button onclick="alert('ระบบเปิดกล้องสอบ (E-Proctoring) กำลังเชื่อมต่อฐานข้อมูล')" class="px-4 py-2 bg-[#DB5A24] text-white text-sm font-bold rounded-lg shadow-md hover:bg-[#C14B1A]">เข้าสอบ</button>
        </div>
        <!-- เพิ่ม Course อื่นๆ ตาม Database -->
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
